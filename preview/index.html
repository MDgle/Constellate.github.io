/* html: fill the full height of the screen. */

const chipIn=(c,vp,al,rk)=>chipDot(c)+'<span class="ct"><span>'+esc(cpuOf(c)?'CPU':NM[c])+' '+(al?'#'+rk:'X')+'</span><span>'+vp+' VP</span></span>';

// ===== (new) Fixed positions: a 5 by 5 lattice of legal spots in every system =====
// Free placement lets a star go anywhere legal in a system. Fixed positions offer 25 set spots instead, so a player (or the computer) picks from a short list. The spots are the points of a 5 by 5 lattice that spans the WHOLE legal range of a star's center (from MARG in from one border to MARG in from the other), so the corner spot S1 is exactly where the closest free placement to that corner can be. In tic-tac-toe terms: Space = the 9 cell centers (S1-S9), Line = the 12 midpoints of the grid lines (L1-L12), Vertex = the 4 line crossings (V1-V4); all numbered left to right, top to bottom. Lattice index i (across) and j (down) run 1 to 5, evenly spaced from the near legal limit (1) to the far one (5): Space = both odd, Vertex = both even, Line = one of each. (Line spots are the midpoints between neighboring Spaces; Vertices are the centers of four Spaces.)
// FX = the 25 spots in order, each {t: S/L/V, n: its number, i, j, k: label such as 'S5'}.
const FX=(()=>{const out=[];let s=0,l=0,v=0;for(let j=1;j<=5;j++)for(let i=1;i<=5;i++){const a=i%2,b=j%2;if(a&&b)out.push({t:'S',n:++s,i,j});else if(!a&&!b)out.push({t:'V',n:++v,i,j});else out.push({t:'L',n:++l,i,j})}out.forEach(q=>q.k=q.t+q.n);return out})();
// fxPos(cx,cy,q) = the board position of spot q inside system (cx,cy).
const fxPos=(cx,cy,q)=>({x:cx+MARG+(1-2*MARG)*(q.i-1)/4,y:cy+MARG+(1-2*MARG)*(q.j-1)/4});
// fxOK(a,p) = can a new star at p be connected from star a? It must clear every star and connection (spotErr) and the new line must clear every other star (clear).
const fxOK=(a,p)=>!spotErr(p)&&clear(a,p);
// fxLegal(a,cx,cy) = the spots of system (cx,cy) that are legal right now, as a list of FX entries.
const fxLegal=(a,cx,cy)=>FX.filter(q=>fxOK(a,fxPos(cx,cy,q)));
// fxSys(cx,cy) = the system's name: sector letter+number, then system letter+number inside the sector, e.g. 'A1 · a1' (first system) or 'G7 · c3' (last system on the standard board). fxName adds the spot: 'G7 · c3 · L12'.
const fxSys=(cx,cy)=>String.fromCharCode(65+Math.floor(cx/3))+(Math.floor(cy/3)+1)+' · '+'abc'[cx%3]+(cy%3+1);
const fxName=(cx,cy,q)=>fxSys(cx,cy)+' · '+q.k;

const useFixed=()=>!!G&&!cpuRun&&(G.pm=='fixed'||(G.pm!='free'&&fixOn));

let fx=null;
// fxOpen(a,cx,cy,c) opens the placement window for an empty system, but only when at least one spot is legal (otherwise it says why and nothing opens).

// fxSvg() draws the zoomed-in window: the legal part of the system, the tic-tac-toe reference lines, nearby connections, the spots of the chosen tab (blue = legal, grey ring = blocked), and the star and its new line at the chosen spot.

// ===== (new) Computer players =====
// MAP of the CPU code (search for these names): cpuStep = one action of the computer's turn (place a Fleet, move a Fleet, make a move) | cpuCands = list the candidate moves and score each | cpuChoose = pick one | cpuDo / cpuMultiDo = play it through the normal tap code | cpuPlace2, cpuFleetMove2 = Fleets | cpuDefend (cpuPick) = Hold/Retreat answers | SCORING: cpuInc + incAdd + incPot2 (fast tally, see "Fast scoring" below) are what cpuCands/cpuCaps/cpuLoss use; cpuPot / cpuPot2 / cpuPotL are the slow full-board originals, kept only as the reference the harness checks the fast tally against | EVALUATOR (step 4): CPU_PARAMS = the one table of tunable values (per level), cpuP / cpuSet / cpuReset = read / change / reset them, cpuDlg = the CPU settings page generated from the table (step 8; Settings > CPU Designer and Menu > Dev), cpuGameSync = records the values in the game (G.cpuV) so saves replay the same, Custom = level 6, incEval = the position value built from them (own points, opponent point loss, leader focus, contest margins, rows, elimination risk) | TURN CACHE + PLANNER (step 5): cclear / cpuStrTab = remembered geometry and strengths; cpuPlanStep (cpuPlanMake, cpuPlanRoll, cpuPlanGen, cpuPlanApply, cpuPlanLeaf, cpuPlanOK) = plans a whole turn on a copy of the board, used by the levels in cpuPlanLv | cpuFleetLv / cpuFleetPlanOn, cpuPlanPlace (placement), the 'fmove' and 'ftake' moves in cpuPlanGen = Fleets planned inside the turn (step 6, test level 5 only, see cpuPlanCfg) | cpuFeat / cpuFeat3 = switches for the Medium / Hard ideas | cpuDangerCheck = near deficit elimination.
// A computer player is a color listed in G.cpu (color -> level; level 1 = Easy). It plays through the game's own move code (tap, placeF, resolve, ...), so it can only do what a person could do, and it must obey the same End-turn rule (all Fleets placed, all Fuel used while a move exists). It runs on this device in a local game, and on the host's device in an online game. cpuOf(c) = is color c a computer; cpuHere(c) = does THIS device run it.
const cpuOf=c=>!!(G&&G.cpu&&G.cpu[c]);
// allCpu() = every player still in the game is a computer.
const allCpu=()=>!!G&&!!G.cpu&&G.pl.filter(c=>G.alive[c]).every(c=>G.cpu[c]);
const cpuHere=c=>cpuOf(c)&&(!net.on||net.role=='host');
// cpuMs = pause between the computer's moves (so you can follow them); 700 normal, 250 fast, 0 instant. cpuRun = true while the computer is making a move (it lets its moves through the "computer is playing" lock). cpuTimer = the pending next-move timer. cpuTimers = false turns the timer off (tests drive the computer by hand). cpuSeed = a number makes its randomness repeatable (tests); null = real randomness. cpuErr = the last error the computer hit (it never stops the game; after a few failures it just ends its turn; tests check it stays empty). cpuBad = moves that failed this turn, so they are not retried; cpuTurn = which turn cpuBad belongs to; cpuStall = consecutive failures.
let cpuErr=null,cpuMs=700,cpuRun=false,cpuTimer=null,cpuTimers=true,cpuSeed=null,cpuBad=new Set(),cpuTurn='',cpuStall=0;try{const v=localStorage.getItem('constellate-cpums');if(v!==null&&!isNaN(+v))cpuMs=+v}catch(e){}
const cpuR=()=>cpuSeed==null?Math.random():((cpuSeed=(cpuSeed*1664525+1013904223)>>>0)/4294967296);
// cpuSpeedLabel() / cpuSpeedCycle(b) = the Game menu button that changes the pause.
const cpuSpeedLabel=()=>'CPU speed: '+(cpuMs>=500?'Normal':cpuMs>0?'Fast':'Instant');
function cpuSpeedCycle(b){cpuMs=cpuMs>=500?250:cpuMs>0?0:700;try{localStorage.setItem('constellate-cpums',String(cpuMs))}catch(e){}b.textContent=cpuSpeedLabel()}

// incEval(T,me,P,danger) = how good the board in tally T is for color me, using the values P (one level's cpuP). It adds up: my points (center discounted unless danger) + my lead per sector + progress on full rows/columns, then (only if those values are on) incRival: opponent points lost, rival leads, elimination risk. With the Easy / Medium / Hard defaults it gives exactly the old cpuPot / cpuPot2 values (the harness checks that).
function incEval(T,me,P,danger){const Z=T.Z,mid=T.mid,ci=mid*Z+mid,nc=cpuFeat.center&&P.centerCut>0&&!danger,W=P.ownVp;let v=incVp(T,me)*W;

if(cpuFeat.rows&&(P.lineOwn||P.lineBlock))for(let i=0;i<Z;i++)for(let L=i;L<2*Z;L+=Z){const mn=T.lc[L*4+me];let no=0,f=-1;for(let c=0;c<4;c++)if(c!=me&&T.lc[L*4+c]>0){no++;f=c}

return v}
// incRival(T,me,P,nc) = the part of the value that comes from the opponents (negative when they are doing well). Each opponent's points and sector leads are subtracted, weighted up by Leader focus when that opponent is ahead of me (the center discount applies to them too). Then the elimination risk: if I am in or tied for last place, the gap to the nearest higher score (plus the expected slip) costs elimPen per point beyond elimFrom, spread so that a gap of 4 costs the full elimPen (and more beyond).
function incRival(T,me,P,nc){const ci=T.mid*T.Z+T.mid,vme=incVp(T,me);let v=0,lo=vme,up=1e9;
for(const c of T.pl)if(c!=me){const x=incVp(T,c);if(x<lo)lo=x}
for(const c of T.pl){if(c==me)continue;const x=incVp(T,c),m=1+P.leaderBoost*Math.max(0,Math.min(1,(x-vme)/P.leaderSpan));
v-=P.oppVp*m*(x-(nc&&T.ctl[ci]==c?P.centerCut:0));v-=P.marginOpp*m*(T.mg[c]-(nc?incMarg(T.n,ci*4,c):0));if(x>lo&&x<up)up=x}

// incPot1 / incPot2 = the OLD Easy and Medium values (default parameters), kept so the harness can compare them with the slow cpuPot / cpuPot2. incPotL(T,me) = the value for the level playing now, with its current parameters (this is what the CPU uses).
const incPot1=(T,me)=>incEval(T,me,cpuDefP(1),false);
const incPot2=(T,me,danger)=>incEval(T,me,cpuDefP(2),danger);
const incPotL=(T,me)=>incEval(T,me,cpuPar(),cpuDanger);
// incTake(T,b,me) = the board value for me if star b flipped to me (the star is put back before returning). incClaim(T,x,y,me) = the same if a new star of mine appeared at system position (x,y).
function incTake(T,b,me){incStar(T,b,b.o,-1);incStar(T,b,me,1);const v=incPotL(T,me);incStar(T,b,me,-1);incStar(T,b,b.o,1);return v}
function incClaim(T,x,y,me){incAdd(T,Math.floor(x/3),Math.floor(y/3),me,1);const v=incPotL(T,me);incAdd(T,Math.floor(x/3),Math.floor(y/3),me,-1);return v}
// cpuLoss(s,me,T) = how much worse the board gets for me if star s flips to the nearest opponent. T = an optional tally of the current board (callers that ask many times pass one).
function cpuLoss(s,me,T){const foe=G.stars.filter(q=>q.o!=me&&G.alive[q.o]).sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y))[0];if(!foe)return 0;T=T||cpuInc(G);const b=incPotL(T,me);incStar(T,s,s.o,-1);incStar(T,s,foe.o,1);const a=incPotL(T,me);incStar(T,s,foe.o,-1);incStar(T,s,s.o,1);return Math.max(0,b-a)}
// cpuSupport(a,N,c,ap) = the strength a new star at N (claimed from star a, costing c Fuel) can be expected to reach. It starts at 1 (its connection to a) and adds the three kinds of support: free Fleets on a or a's neighbors that can step onto it; a nearby friendly star it can be connected to with Fuel left over; and another star claimed or captured this turn close by (advancing with several stars).

const cpuFeat3={buffer:1,hopeless:1,cut:1,multi:1,cap:1};
const cpuHard=()=>cpuLvl()>2;
// cpuSec(S) = stars per sector, as {'x,y': [count per color]}.
function cpuSec(S){const c={};S.stars.forEach(s=>{const k=Math.floor(s.x/3)+','+Math.floor(s.y/3);(c[k]=c[k]||[0,0,0,0])[s.o]++});return c}

function cpuBuffer(N,me,sc){let v=0;const foes=G.stars.filter(s=>s.o!=me&&G.alive[s.o]);for(const k in sc){const n=sc[k];let o=0;n.forEach((c,col)=>{if(col!=me&&c>o)o=c});if(n[me]<1||n[me]<=o)continue;const [sx,sy]=k.split(',').map(Number),x0=sx*3,y0=sy*3,dx=Math.max(x0-N.x,0,N.x-(x0+3)),dy=Math.max(y0-N.y,0,N.y-(y0+3)),d=Math.hypot(dx,dy);if(d<=0||d>1.6)continue;if(foes.some(f=>Math.hypot(f.x-(x0+1.5),f.y-(y0+1.5))<6))v+=.8}return Math.min(1.6,v)}

function cpuBufTab(me,sc){const foes=G.stars.filter(s=>s.o!=me&&G.alive[s.o]),t=[];for(const k in sc){const n=sc[k];let o=0;n.forEach((c,col)=>{if(col!=me&&c>o)o=c});if(n[me]<1||n[me]<=o)continue;const [sx,sy]=k.split(',').map(Number),x0=sx*3,y0=sy*3;if(foes.some(f=>Math.hypot(f.x-(x0+1.5),f.y-(y0+1.5))<6))t.push(x0,y0)}return t}
function cpuBufFast(N,t){let v=0;for(let i=0;i<t.length;i+=2){const x0=t[i],y0=t[i+1],dx=Math.max(x0-N.x,0,N.x-(x0+3)),dy=Math.max(y0-N.y,0,N.y-(y0+3)),d=Math.hypot(dx,dy);if(d<=0||d>1.6)continue;v+=.8}return Math.min(1.6,v)}
// cpuHopeless(N,me,sc) = penalty for putting a star in a sector where an opponent already leads by 2 or more stars.
function cpuHopeless(N,me,sc){const n=sc[Math.floor(N.x/3)+','+Math.floor(N.y/3)];if(!n)return 0;let o=0;n.forEach((c,col)=>{if(col!=me&&c>o)o=c});const d=o-n[me];return d>=2?Math.min(4,1.2*(d-1)):0}
// cpuRoutes(s) = the stars a Fleet on s could retreat to (stars of the same owner connected to it).
const cpuRoutes=s=>G.conns.filter(c=>c[0]==s.id||c[1]==s.id).map(c=>by(c[0]==s.id?c[1]:c[0])).filter(u=>u&&u.o==s.o);
// cpuCutBonus(b,mineStars) = extra value of capturing star b for Fleet reasons: (1) b holds Fleets and has no retreat, so they will be forced to Hold; (2) b is the connection some Fleet-holding neighbor retreats through, and capturing b erases it (worth most when it is that neighbor's last route and the neighbor is itself within reach).

const wait=fp&&(!cpuPlan||cpuPlan.tid!=cpuTurn||cpuPlan.made==0)&&G.ap>0&&moveAvail();
if(!cpuPlanBusy()&&!wait&&(!fp||cpuPlanCfg.post)&&cpuFleetMove())return 'acted';
if(G.ap>0&&moveAvail()){if(cpuPlanOn()&&cpuPlanStep())return 'acted';let c=cpuCands(3);if(!c.length)c=cpuCands(G.ap);
if(c.length){const m=cpuChoose(c);if(!cpuDo(m))cpuStall++;return 'acted'}
if(cpuMulti())return 'acted';
if(++cpuStall>3){cpuStall=0;endTurn();return 'ended'}return 'acted'}
if(cpuStall>3||!endBlock()){cpuStall=0;endTurn();return 'ended'}
if(++cpuStall>3){cpuStall=0;endTurn();return 'ended'}return 'acted'}
catch(e){cpuErr=e&&e.message?e.message+' | '+((e.stack||'').split('\n')[1]||''):String(e);cpuStall++;if(cpuStall>3){cpuStall=0;try{endTurn()}catch(x){}return 'ended'}return 'acted'}
finally{cpuRun=false;cpuTab=null}}
// The timer: after every redraw, if it is a computer's turn on this device, make its next move after a pause. It waits while a dialog is open (the Menu, the round popup) or a person is answering a Hold/Retreat question.
function cpuSched(){if(!cpuTimers||cpuTimer||!G||G.over||!cpuHere(cur()))return;cpuTimer=setTimeout(cpuTick,cpuMs)}
function cpuTick(){cpuTimer=null;if(!G||G.over||!cpuHere(cur()))return;const ovOn=$('ov').style.display&&$('ov').style.display!='none';if(ovOn||(pend&&pend.ph)){cpuTimer=setTimeout(cpuTick,250);return}
const r=cpuStep();if(r=='wait'&&!cpuTimer)cpuTimer=setTimeout(cpuTick,250);else if(r=='acted'&&!cpuTimer)cpuTimer=setTimeout(cpuTick,cpuMs)}
// cpuAuto(max) plays computer turns back to back with no pauses until the game ends, a person is needed, or max moves were made (used by tests).
function cpuAuto(max){let n=0;while(G&&!G.over&&n<max){const o=$('ov');if(o.onclick)o.onclick();o.style.display='none';const r=cpuStep();if(r=='idle'||r=='wait')break;n++}return n}
