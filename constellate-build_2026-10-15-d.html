// ===== (new) Fixed positions: a 5 by 5 lattice of legal spots in every system =====
// Free placement lets a star go anywhere legal in a system. Fixed positions offer 25 set spots instead, so a player (or the computer) picks from a short list. The spots are the points of a 5 by 5 lattice that spans the WHOLE legal range of a star's center (from MARG in from one border to MARG in from the other), so the corner spot S1 is exactly where the closest free placement to that corner can be. In tic-tac-toe terms: Space = the 9 cell centers (S1-S9), Line = the 12 midpoints of the grid lines (L1-L12), Vertex = the 4 line crossings (V1-V4); all numbered left to right, top to bottom. Lattice index i (across) and j (down) run 1 to 5, evenly spaced from the near legal limit (1) to the far one (5): Space = both odd, Vertex = both even, Line = one of each. (Line spots are the midpoints between neighboring Spaces; Vertices are the centers of four Spaces.)

const fxOK=(a,p)=>!spotErr(p)&&clear(a,p);

// netHost(n,sz,col) opens a room for n players on a board of sz sectors per side, with the host playing color col: try random codes until the matchmaking server accepts one.
async function netHost(n,sz,col,pm,cpu){try{await netLib()}catch(e){return nmsg(e.message)}
netCleanup(true);net.role='host';net.n=n;net.sz=[3,5,7].includes(sz)?sz:7;net.pm=pm=='free'||pm=='fixed'?pm:'choice';net.started=false;const pl=n==2?[0,2]:[0,2,3,1],hc=pl.includes(col)?col:pl[0];net.seats=pl.map(c=>({c,kind:c===hc?'host':(cpu&&cpu[c]?'cpu':'open'),lvl:cpu&&cpu[c]?([1,2,3].includes(cpu[c])?cpu[c]:1):0,tok:null,conn:null,online:c===hc||!!(cpu&&cpu[c])}));netMy();net.tok=null;nmsg('Opening a room...');

if(!net.room){net.role=null;net.seats=[];net.my=[];return nmsg('Could not reach the matchmaking server. Check your connection and try again.')}
net.on=true;net.gone=false;netSave();netLobby()}
// netOpenPeer(id) registers the host's room id; answers ok, taken (id in use) or fail.
function netOpenPeer(id){return new Promise(res=>{let done=false;const p=mkPeer(id),fin=v=>{if(!done){done=true;res(v)}};
p.on('open',()=>{net.peer=p;hookHost(p);fin('ok')});
p.on('error',e=>{if(done)return netPeerErr(e);try{p.destroy()}catch(x){}fin(e&&e.type=='unavailable-id'?'taken':'fail')});

// hookHost(p) wires up a host's room: new guests arriving, and keeping the link to the matchmaking server alive.
function hookHost(p){p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLost(c));c.on('error',()=>{})});p.on('disconnected',()=>{setTimeout(()=>{try{if(!p.destroyed&&net.peer===p)p.reconnect()}catch(e){}},1500)})}

// hostMsg(conn,m) handles one message from a guest.
function hostMsg(conn,m){if(!m||typeof m!='object')return;conn._t=Date.now();if(m.t=='hello')return hostHello(conn,m);

if(m.t=='ping')return nsend(conn,{t:'pong'});if(m.t=='need')return nsend(conn,fullMsg(false));if(m.t=='bye')return hostLost(conn);
// A state message is accepted only from the device whose turn it is; anything else is answered with the truth so the sender is corrected.

// hostHello(conn,m): a guest says hello. Same versions required; a returning key gets its old seat back (even one the host took over); a new player gets the first open seat, before the game starts only.
function hostHello(conn,m){if(m.nv!==NET_VER||m.v!==SHARE_VER)return nsend(conn,{t:'no',why:'The host and you are running different versions of the game. Both of you need the latest hosted copy.'});

// hostLost(conn): a guest's line closed. In the lobby the seat reopens; in a game it just shows offline until they return.
function hostLost(conn){const s=net.seats.find(q=>q.conn===conn);if(!s)return;s.conn=null;s.online=false;if(!net.started&&s.kind=='guest'){s.kind='open';s.tok=null}netPush();if(net.started&&G)say(NM[s.c]+' disconnected.')}
// netStart() (host): everyone is seated, so create the game with the normal start code and send everyone a full copy.
function netStart(sz,pm){if(net.role!='host'||net.seats.some(s=>s.kind=='open'))return nmsg('Fill every seat first.');

// netToggleSeat(c) (host): in the lobby, turn an open seat into "the host plays this one too" and back.
// netCpuSeat(c) (host): in the lobby, turn an open seat into a computer player and back.
function netCpuSeat(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host')return;if(s.kind=='open'){s.kind='cpu';s.lvl=1;s.online=true}else if(s.kind=='cpu'){s.kind='open';s.lvl=0;s.online=false}netPush()}
// netCpuLvl(c) (host): cycle a lobby computer seat through Easy, Medium and Hard.
function netCpuLvl(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host'||s.kind!='cpu')return;s.lvl=(s.lvl||1)%3+1;netPush()}
function netToggleSeat(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host')return;if(s.kind=='open')s.kind='local';else if(s.kind=='local'&&!s.took)s.kind='open';netPush()}
// netTakeover(c) (host): play an offline player's color from this device. They get it back automatically if they return.
function netTakeover(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host'||s.online)return;s.kind='local';s.took=true;netPush();

// netJoin(code): join a room. Keeps the same seat key if this browser was in this room before.
async function netJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!=5)return nmsg('Enter the 5-character room code.');

// guestConnect() opens (or reopens) the line to the host and says hello. If anything fails it tries again every 3 seconds.
async function guestConnect(){if(!net.on||net.role!='guest'||net.busy||net.gone)return;net.busy=true;clearTimeout(net.retry);net.retry=null;

const p=mkPeer();net.peer=p;let up=false;
const fail=why=>{if(p!==net.peer||net.retry||net.gone)return;net.busy=false;net.fails++;netStatus(why+(net.fails>3?' If this keeps happening, a firewall or mobile network may be blocking direct connections. Try Wi-Fi on both devices.':''));net.retry=setTimeout(()=>{net.retry=null;guestConnect()},3000)};

c.on('data',guestMsg);c.on('close',()=>{if(c===net.conn){net.conn=null;fail('Connection lost. Reconnecting...')}});c.on('error',()=>{});
setTimeout(()=>{if(!up&&c===net.conn){const ice=c.peerConnection&&c.peerConnection.iceConnectionState;try{c.close()}catch(e){}net.conn=null;fail('Could not reach the host yet'+(ice?' (link: '+ice+')':'')+'. Retrying...')}},12000)});
p.on('error',e=>fail(e&&e.type=='peer-unavailable'?'The host is not online yet. Retrying...':'Network problem'+(e&&e.type?' ('+e.type+')':'')+'. Retrying...'))}
// guestMsg(m) handles one message from the host.
function guestMsg(m){if(!m||typeof m!='object')return;net.last=Date.now();
if(m.t=='welcome'){net.my=[m.c];net.n=m.n;net.seats=m.seats||[];net.started=!!m.started;net.status='';netSave();
// Back in a running game: if it is my turn (or I just finished it) my copy is the truth, so push it to the host; otherwise ask for the host's copy.
if(net.started){if(G&&(net.my.includes(cur())||net.acting)){net.lastG='';net.hsent=0;net.acting=true;render()}else nsend(net.conn,{t:'need'})}
if(net.rq)net.rq.sent=false;return netUI()}
if(m.t=='no')return netFail(m.why);

function netEnded(){netCleanup(true);ov('<h1>Room closed</h1><p>The host ended the online game. The board is still here on your device; you can keep it as a local game or save it.</p><div class="r"><button onclick="$(\'ov\').style.display=\'none\'">OK</button></div>');if(G)render()}
// netDrop() (guest): the line to the host seems dead (no reply, or the phone slept): close it and reconnect.
function netDrop(){if(!net.on||net.role!='guest'||net.gone)return;try{net.conn&&net.conn.close()}catch(e){}net.conn=null;net.busy=false;netStatus('Connection lost. Reconnecting...');guestConnect()}
// netBeat() runs every 5 seconds: guests ping the host and reconnect if nothing comes back; the host drops guests that went silent.
function netBeat(){if(!net.on)return;const now=Date.now();

// ===== (new) Computer players =====
// MAP of the CPU code (search for these names): cpuStep = one action of the computer's turn (place a Fleet, move a Fleet, make a move) | cpuCands = list the candidate moves and score each | cpuChoose = pick one | cpuDo / cpuMultiDo = play it through the normal tap code | cpuPlace2, cpuFleetMove2 = Fleets | cpuDefend (cpuPick) = Hold/Retreat answers | SCORING: cpuInc + incAdd + incPot2 (fast tally, see "Fast scoring" below) are what cpuCands/cpuCaps/cpuLoss use; cpuPot / cpuPot2 / cpuPotL are the slow full-board originals, kept only as the reference the harness checks the fast tally against | EVALUATOR (step 4): CPU_PARAMS = the one table of tunable values (per level), cpuP / cpuSet / cpuReset = read / change / reset them, cpuDlg = the CPU settings page generated from the table (step 8; Settings > CPU settings and Menu > Dev), cpuGameSync = records the values in the game (G.cpuV) so saves replay the same, Custom = level 6, incEval = the position value built from them (own points, opponent point loss, leader focus, contest margins, rows, elimination risk) | TURN CACHE + PLANNER (step 5): cclear / cpuStrTab = remembered geometry and strengths; cpuPlanStep (cpuPlanMake, cpuPlanRoll, cpuPlanGen, cpuPlanApply, cpuPlanLeaf, cpuPlanOK) = plans a whole turn on a copy of the board, used by the levels in cpuPlanLv | cpuFleetLv / cpuFleetPlanOn, cpuPlanPlace (placement), the 'fmove' and 'ftake' moves in cpuPlanGen = Fleets planned inside the turn (step 6, test level 5 only, see cpuPlanCfg) | cpuFeat / cpuFeat3 = switches for the Medium / Hard ideas | cpuDangerCheck = near deficit elimination.
// A computer player is a color listed in G.cpu (color -> level; level 1 = Easy). It plays through the game's own move code (tap, placeF, resolve, ...), so it can only do what a person could do, and it must obey the same End-turn rule (all Fleets placed, all Actions used while a move exists). It runs on this device in a local game, and on the host's device in an online game. cpuOf(c) = is color c a computer; cpuHere(c) = does THIS device run it.
const cpuOf=c=>!!(G&&G.cpu&&G.cpu[c]);
// allCpu() = every player still in the game is a computer.
const allCpu=()=>!!G&&!!G.cpu&&G.pl.filter(c=>G.alive[c]).every(c=>G.cpu[c]);
const cpuHere=c=>cpuOf(c)&&(!net.on||net.role=='host');
// cpuMs = pause between the computer's moves (so you can follow them); 700 normal, 250 fast, 0 instant. cpuRun = true while the computer is making a move (it lets its moves through the "computer is playing" lock). cpuTimer = the pending next-move timer. cpuTimers = false turns the timer off (tests drive the computer by hand). cpuSeed = a number makes its randomness repeatable (tests); null = real randomness. cpuErr = the last error the computer hit (it never stops the game; after a few failures it just ends its turn; tests check it stays empty). cpuBad = moves that failed this turn, so they are not retried; cpuTurn = which turn cpuBad belongs to; cpuStall = consecutive failures.

// cpuSpeedLabel() / cpuSpeedCycle(b) = the Game menu button that changes the pause.
const cpuSpeedLabel=()=>'CPU speed: '+(cpuMs>=500?'Normal':cpuMs>0?'Fast':'Instant');
function cpuSpeedCycle(b){cpuMs=cpuMs>=500?250:cpuMs>0?0:700;try{localStorage.setItem('constellate-cpums',String(cpuMs))}catch(e){}b.textContent=cpuSpeedLabel()}
// (reference only: the game now uses the fast incPot1/incPot2; the harness checks them against this) cpuPot(S,me) = how good board S is for color me: 10 per Victory Point plus a small reward for leading in a sector (my stars minus the best opponent's, capped), so a move toward a majority counts even before it scores. S is a copy of the game with its stars changed (calc needs the whole game).
function cpuPot(S,me){const vp=calc(S).vp[me],cnt={};S.stars.forEach(s=>{const k=Math.floor(s.x/3)+','+Math.floor(s.y/3);(cnt[k]=cnt[k]||[0,0,0,0])[s.o]++});let g=0;Object.values(cnt).forEach(n=>{let o=0;n.forEach((v,c)=>{if(c!=me&&v>o)o=v});g+=.4*Math.max(-2,Math.min(2,n[me]-o))});return vp*10+g}
// ----- Levels. G.cpu[color] is 1 Easy, 2 Medium, 3 Hard (plans whole turns), 4 Hard (legacy, the old move-by-move Hard), 5 Hard+F (test, also plans Fleets), 6 Custom (the player's own saved level, step 8). cpuRaw() = the level number of the computer whose turn it is; cpuLvl() = its STYLE level: the same, except that Custom plays like the built-in level it was based on (1-3), so every 'is it Medium / Hard' check keeps working. Only the values (cpuPar) are Custom's own.
const CPU_LEVELS=['','Easy','Medium','Hard','Hard (legacy)','Hard+F (test)','Custom'],cpuRaw=()=>(G&&G.cpu&&G.cpu[cur()])||1,cpuEff=l=>l==6?cpuBaseNow():l,cpuLvl=()=>cpuEff(cpuRaw());
// cpuDanger = this computer is close to deficit elimination (it is last and 2 or more points behind the next player), so the center sector is worth its full 3 points again; cpuNew = ids of stars it claimed or captured this turn (they support each other).
// cpuFeat = switches for Medium's separate ideas (so each can be measured on its own): center = discount the center sector; rows = reward row/column progress; threat = discount claims and captures the opponent could take back; conn = value connections that lift a threatened star to safety; place = put Fleets on threatened stars; move = move Fleets onto threatened stars; attack = place and move Fleets to enable captures; reach = how many Actions away an opponent star must be to count as a threat (opponents rarely spend more than a few Actions on one capture); def = pick the strongest Retreat star. (The random wobble when choosing is the 'noise' row of CPU_PARAMS.)
const cpuFeat={center:1,rows:1,threat:1,conn:1,place:1,move:1,def:1,attack:1,reach:3};
let cpuDanger=false,cpuNew=[];
function cpuDangerCheck(me){const vp=calc(G).vp,alive=G.pl.filter(c=>G.alive[c]);if(alive.some(c=>c!=me&&vp[c]<vp[me]))return false;const higher=alive.filter(c=>vp[c]>vp[me]).map(c=>vp[c]);return !!higher.length&&Math.min(...higher)-vp[me]>=2}
// cpuOppAp() = the Actions an opponent will have on their next turn (this round's or next round's, whichever is more).
const cpuOppAp=()=>Math.max(1,Math.min(15,Math.max(acts(Math.min(30,G.round)),acts(Math.min(30,G.round+1)))));
// cpuThreatened(pos,tStr,me,ign) = could some live opponent star take a star at pos that has strength tStr, spending no more Actions than the opponent will have? (ign = a star to leave out, such as the one being captured right now.)
function cpuThreatened(pos,tStr,me,ign){const ap=Math.min(cpuOppAp(),cpuFeat.reach);return G.stars.some(A=>A!==ign&&A.o!=me&&G.alive[A.o]&&cost(A,pos)<=ap&&cStr(A)>tStr)}
// (reference only, see incPot2) cpuPot2(S,me,danger) = Medium's board value for color me: 10 per Victory Point, but the center sector counts as 1 point not 3 (it costs too much to defend) unless danger; a small reward for leading each non-center sector; and progress toward full rows and columns of sectors that no one else has broken into (a rival's open line is subtracted, so blocking it counts).

Object.keys(cnt).forEach(k=>{const [x,y]=k.split(',').map(Number);if(cpuFeat.center&&!danger&&x==mid&&y==mid)return;const n=cnt[k];let o=0;n.forEach((c,col)=>{if(col!=me&&c>o)o=c});v+=.4*Math.max(-2,Math.min(2,n[me]-o))});

// cpuPotL(S,me) = the board value for the level playing now.
const cpuPotL=(S,me)=>cpuLvl()>1?cpuPot2(S,me,cpuDanger):cpuPot(S,me);
// ===== Turn cache (CPU project step 5, part 1) =====
// The planner (and the old move search) ask the same geometry and strength questions many times per turn, so they are remembered. cclear(a,b) = clear(a,b) remembered (computed by clearBB, the same test that skips stars outside the line's bounding box; the harness --check compares it with clear): stars never move and are never removed, so a pair's answer can only change when a NEW star appears; the memory is therefore dropped when the star count changes, when the game object is replaced (Undo, online sync, new game) and at the start of every computer turn. cpuTab = strength table: cpuStrTab() counts every star's connections in ONE pass over the connection list; while cpuTab is set, cStr(s) / cCs(s) read it instead of rescanning the list for every call (same numbers as str / cs). cpuTab is only ever set INSIDE a read-only search (cpuCands, cpuPlace2, cpuFleetMove, ...) and is cleared before any move is made and in cpuStep's finally, so it can never be stale.
let cpuGeo={g:null,n:-1,m:new Map()},cpuTab=null;

const cCs=s=>cpuTab?cpuTab[s.id]:cs(s),cStr=s=>cpuTab?cpuTab[s.id]+(s.f||0):str(s);
// ===== Fast scoring (CPU project step 3) =====
// The slow cpuPot/cpuPot2 above rescan every star for all 49 sectors for EVERY candidate move (and copy the star list). A candidate only ever changes ONE sector (a star appears, or a star changes owner), so the fast version keeps a tally of the board and changes just that sector, reads the value, and puts it back.
// cpuInc(S) builds the tally T for board S: n = stars per sector per color (index (y*Z+x)*4+color), ctl = who controls each sector (-1 nobody), vp = raw Victory Points per color (dead players are zeroed when read), lc = for each of the 2Z lines (rows 0..Z-1, then columns Z..2Z-1) how many of its sectors each color controls, mg = per color the sum over ALL sectors of the margin clamp(my stars - best other, -2, 2) as a whole number, alive = S.alive, pl = the players still in the game.

for(let y=0;y<Z;y++)for(let x=0;x<Z;x++){const s=y*Z+x,w=incOwner(T,s);T.ctl[s]=w;if(w>=0){T.vp[w]+=incPts(T,x,y);T.lc[y*4+w]++;T.lc[(Z+x)*4+w]++}for(let k=0;k<4;k++)T.mg[k]+=incMarg(T.n,s*4,k)}

// incOwner(T,s) = the color with MORE THAN HALF of the stars in sector s, or -1 (the same rule calc uses).

// incMarg(n,b,k) = the margin of color k in the sector starting at index b: its stars minus the best other color's, kept between -2 and 2.

const KK=Math.min(cpuPlanCfg.K,X.P.planK),fx=Math.min(4,X.P.planFixed);let best=null;for(let r=0;r<KK;r++){const al=r<fx?[0,1,.5,1.5][r]:cpuR()*1.5,tau=r<fx?0:.4+.6*cpuR(),res=cpuPlanRoll(base,X,al,tau,X.fp?(r<4?cpuPOL[r]:{wa:.3+2.2*cpuR(),wd:.3+2.2*cpuR(),conc:cpuR()<.5?1:0,tau:.4+.6*cpuR()}):null);cpuPS.rolls++;if(cpuPlanCfg.dbg)(cpuPS.dbg=cpuPS.dbg||[]).push([G.round,r,+al.toFixed(2),+res.val.toFixed(2),res.moves.map(m=>m.t[0]+m.c+':'+(m.t=='claim'?m.cx+','+m.cy:m.b)+'@'+m.d.toFixed(2)).join(' ')]);if(!best||res.val>best.val)best=res;if(cpuSeed==null&&r>=3&&performance.now()-t0>cpuPlanCfg.ms)break}
cpuPS.ms+=performance.now()-t0;if(!best||!best.moves.length)return [];
const R=i=>base.real[i];if(cpuPlanCfg.pred)cpuPlan.pred={n:Array.from(best.s.T.n),ap:best.s.ap,val:best.val,f:Array.from({length:base.n0},(_,i)=>[base.id[i],best.s.f[i]])};
return best.moves.map(m=>{const a=R(m.a);if(m.t=='place')return {t:'place',a,v:0,key:'p'+a.id};if(m.t=='fmove'){const cx=best.s.cx[m.b],cy=best.s.cy[m.b];return {t:'fmove',a,n:m.n,cx,cy,v:m.d,key:'f'+a.id+'_'+cx+'_'+cy+'_'+m.n}}if(m.t=='claim')return {t:'claim',a,cx:m.cx,cy:m.cy,v:m.d,key:'s'+a.id+'_'+m.cx+'_'+m.cy};const b=R(m.b);if(m.t=='multi'){const y=R(m.y);return {t:'multi',a,y,b,v:m.d,key:'x'+b.id+'_'+a.id+'_'+y.id}}return {t:m.t,a,b,v:m.d,key:(m.t=='take'?'t':'c')+a.id+'_'+b.id}})}
// cpuPlanOK(m) = is the planned move still legal on the real board? (Actions, the star has not acted, targets, strengths, free line, empty system.)
// cpuFleetTgt(m) = the own star standing in the system a planned Fleet move aims at (new stars have no id at plan time, so the system is the address).
const cpuFleetTgt=m=>G.stars.find(q=>q.o==cur()&&Math.floor(q.x)==m.cx&&Math.floor(q.y)==m.cy);
function cpuPlanOK(m){const me=cur(),a=m.a;if(m.t=='place')return G.pool>0&&a.o==me&&placeable().includes(a);
if(m.t=='fmove'){const t=cpuFleetTgt(m);return !!t&&t!==a&&a.o==me&&!cpuBad.has(m.key)&&(a.f||0)-(a.fm||0)>=m.n&&cpuReach(a,m.n).has(t.id)}
if(a.o!=me||G.used.includes(a.id)||cpuBad.has(m.key))return false;
if(m.t=='claim')return !G.stars.some(q=>Math.floor(q.x)==m.cx&&Math.floor(q.y)==m.cy)&&Math.abs(Math.floor(a.x)-m.cx)+Math.abs(Math.floor(a.y)-m.cy)<=G.ap;
const b=m.b;if(m.t=='conn')return b.o==me&&cost(a,b)<=G.ap&&cclear(a,b)&&!G.conns.some(q=>(q[0]==a.id&&q[1]==b.id)||(q[0]==b.id&&q[1]==a.id));
if(b.o==me)return false;if(m.t=='take')return cost(a,b)<=G.ap&&cclear(a,b)&&str(a)>str(b);
const y=m.y;return y.o==me&&!G.used.includes(y.id)&&cost(a,b)+cost(y,b)<=G.ap&&cclear(a,b)&&cclear(y,b)&&str(a)+str(y)>str(b)}
// cpuPlanBusy() = a plan is running (moves left): Fleets are not moved meanwhile.
const cpuPlanBusy=()=>cpuPlanOn()&&!!cpuPlan&&cpuPlan.tid==cpuTurn&&cpuPlan.q.length>0;
// cpuPlanStep() = make the next planned move (making a new plan first when there is none). Returns false when the planner has nothing to do (no move found, or maxPlans used up), so cpuStep falls back to the move-by-move code. A planned move that is no longer legal, or that fails, throws the rest of the plan away; the next call plans again from the real board.
function cpuPlanStep(){if(!cpuPlan||cpuPlan.tid!=cpuTurn)cpuPlan={tid:cpuTurn,q:[],made:0};
for(let g=0;g<3;g++){if(!cpuPlan.q.length){if(cpuPlan.made>=cpuPlanCfg.maxPlans)return false;cpuPlan.made++;cpuPlan.q=cpuPlanMake();cpuPS.plans++;if(!cpuPlan.q.length){cpuPS.empty++;return false}}
const m=cpuPlan.q.shift();if(!cpuPlanOK(m)){cpuPlan.q=[];cpuPS.stale++;if(m.t=='place')cpuPS.xp++;if(m.t=='fmove')cpuPS.xf++;continue}
if(m.t=='place'){const f0=m.a.f||0;mode='p';placeF(m.a);mode='s';if((m.a.f||0)==f0+1){cpuPS.exec++;cpuPS.pl++;return true}cpuPlan.q=[];cpuPS.failed++;cpuPS.xp++;cpuStall++;return true}
if(m.t=='fmove'){if(cpuMoveExec(m.a,cpuFleetTgt(m),m.n,m.key)){cpuPS.exec++;cpuPS.fm++;return true}cpuPlan.q=[];cpuPS.failed++;cpuPS.xf++;cpuStall++;return true}
if(!cpuDo(m)){(window.__fails=window.__fails||[]).push('L'+cpuLvl()+' '+m.t+' '+(m.key||'')+' r'+G.round+' ap'+G.ap);cpuPlan.q=[];cpuPS.failed++;cpuStall++;return true}cpuPS.exec++;return true}return false}
// cpuStep() makes ONE move for the computer whose turn it is: place a Fleet, or make the best legal move, or end the turn. Returns 'acted', 'ended', 'wait' (a person must answer a Hold/Retreat question first) or 'idle' (not a computer turn here).
function cpuStep(){if(!G||G.over||!cpuHere(cur()))return 'idle';if(pend)return 'wait';
const tid=G.round+':'+G.ti+':'+cur();if(tid!=cpuTurn){cpuTurn=tid;cpuBad=new Set();cpuStall=0;cpuNew=[];cpuGeo.g=null;cpuDanger=cpuLvl()>1&&cpuDangerCheck(cur())}
cpuRun=true;try{
// (step 6) A level that plans its Fleets starts with the plan: it places the Fleets, moves them and makes the moves. The old placing / moving code below is the fallback (and, with cpuPlanCfg.post, the clean-up after the plan).
const fp=cpuFleetPlanOn()&&!!cpuPlanCfg.fPlace;
if(fp&&(G.pool>0||cpuPlanBusy())&&cpuPlanStep())return 'acted';
if(G.pool>0&&placeable().length){cpuPlace();return 'acted'}
// (new) Then bring Fleets up toward the enemy before spending Actions, so they can join this turn's attacks.
const wait=fp&&(!cpuPlan||cpuPlan.tid!=cpuTurn||cpuPlan.made==0)&&G.ap>0&&moveAvail();
if(!cpuPlanBusy()&&!wait&&(!fp||cpuPlanCfg.post)&&cpuFleetMove())return 'acted';
if(G.ap>0&&moveAvail()){if(cpuPlanOn()&&cpuPlanStep())return 'acted';let c=cpuCands(3);if(!c.length)c=cpuCands(G.ap);
if(c.length){const m=cpuChoose(c);if(!cpuDo(m))cpuStall++;return 'acted'}
if(cpuMulti())return 'acted';
if(++cpuStall>3){cpuStall=0;endTurn();return 'ended'}return 'acted'}
if(cpuStall>3||!endBlock()){cpuStall=0;endTurn();return 'ended'}
if(++cpuStall>3){cpuStall=0;endTurn();return 'ended'}return 'acted'}
catch(e){cpuErr=e&&e.message?e.message+' | '+((e.stack||'').split('\n')[1]||''):String(e);cpuStall++;if(cpuStall>3){cpuStall=0;try{endTurn()}catch(x){}return 'ended'}return 'acted'}
finally{cpuRun=false;cpuTab=null}}
// The timer: after every redraw, if it is a computer's turn on this device, make its next move after a pause. It waits while a dialog is open (the Menu, the round popup) or a person is answering a Hold/Retreat question.
function cpuSched(){if(!cpuTimers||cpuTimer||!G||G.over||!cpuHere(cur()))return;cpuTimer=setTimeout(cpuTick,cpuMs)}
function cpuTick(){cpuTimer=null;if(!G||G.over||!cpuHere(cur()))return;const ovOn=$('ov').style.display&&$('ov').style.display!='none';if(ovOn||(pend&&pend.ph)){cpuTimer=setTimeout(cpuTick,250);return}
const r=cpuStep();if(r=='wait'&&!cpuTimer)cpuTimer=setTimeout(cpuTick,250);else if(r=='acted'&&!cpuTimer)cpuTimer=setTimeout(cpuTick,cpuMs)}
// cpuAuto(max) plays computer turns back to back with no pauses until the game ends, a person is needed, or max moves were made (used by tests).
function cpuAuto(max){let n=0;while(G&&!G.over&&n<max){const o=$('ov');if(o.onclick)o.onclick();o.style.display='none';const r=cpuStep();if(r=='idle'||r=='wait')break;n++}return n}

// On window resize refit the board, fit it now, and show the start menu.
addEventListener('resize',fit);fit();menu();
// (new) If the address carries #g=..., open that shared game (and react if the address changes later).
addEventListener('hashchange',shareOnLoad);shareOnLoad();
// (new) A room link (#r=CODE) opens the Join screen with the code filled in.
addEventListener('hashchange',roomOnLoad);roomOnLoad();
// (new) Tells the early diagnostic script that the game started.
window.__booted=true;
</script></body></html>
