<title>Constellate</title>
<!-- When opened from a web link on an iPhone, "Add to Home Screen" then runs it full screen like an app. -->

<!-- Head: page title and character set above, mobile viewport above. Next comes the CSS (how things LOOK), then the HTML (what is ON the page), then the JavaScript (what it DOES). -->
<style>
/* :root holds color "variables" (--name) reused everywhere below; these are the light-theme values. The padding keeps content clear of phone notches. */
:root{--bg:#eef3f6;--panel:#fff;--ink:#14212b;--mut:#5c6f7d;--grid:#8fa6b5;--sec:#35505f;--line:#cfdbe3;--acc:#2a6a8c;--acc-hover:#2f78a0;--acc-press:#1d5470;--acc-ink:#fff;--acc-line:#4b8fb3;--sel:#1f4a63;--sel-hover:#245773;--sel-press:#173a4e;--sel-ink:#fff;--sel-line:#5fa3c4;--dis:#c9d3da;--dis-ink:#465866;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Dark theme: the same variables with dark values, used when the device is in dark mode. */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--panel:#18222c;--ink:#e8eef3;--mut:#93a5b3;--grid:#33444f;--sec:#6d8799;--line:#2a3945;--dis:#1a2530;--dis-ink:#7f93a2}}
/* Same dark values, used if the page is forced dark. */
:root[data-theme="dark"]{--bg:#0d141b;--panel:#18222c;--ink:#e8eef3;--mut:#93a5b3;--grid:#33444f;--sec:#6d8799;--line:#2a3945;--dis:#1a2530;--dis-ink:#7f93a2}
/* html: fill the full height of the screen. */
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
/* body: no margin; stack children vertically (top panel, board, bottom bar); base font and colors; stop pull-to-refresh bounce and text selection. */
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* #top: the panel across the top that holds round info, player chips and mode buttons. */
#top{padding:8px 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
/* #info: the row showing whose turn, the round and Actions left. */
#info{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
/* #info b: the current player's name is bigger. */
#info b{font-size:17px}
/* #chips: the row of player score boxes. */
#chips{display:flex;gap:6px;margin-top:6px}
/* .chip: one player's box (border, rounded corners, layout). */
.chip{flex:1;border:2px solid var(--line);border-radius:8px;padding:3px 7px;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
/* .chip i: the small colored dot inside a chip. */
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
/* .chip small: the star count text, pushed to the right and dimmed. */
.chip small{color:var(--mut);margin-left:auto}
/* .chip.on: outline in the player's color for whoever's turn it is; .chip.dead: faded and crossed out when eliminated. */
.chip.on{border-color:var(--c)}.chip.dead{opacity:.4;text-decoration:line-through}
/* #modes: the row of three mode buttons (Stars, Place, Move); .act marks the selected one. */
#modes{display:flex;gap:6px;margin-top:6px}#modes button{flex:1;min-height:38px;padding:0 6px}#modes .act{background:var(--sel);color:var(--sel-ink);border-color:var(--sel-line);font-weight:600}
/* #st: the board area stretches to fill leftover space; position:relative lets overlays be placed inside it. */
#st{flex:1;position:relative;min-height:0;overflow:hidden}
/* svg: the drawing surface fills its area; touch-action:none lets our code handle finger drags and pinches. */
svg{width:100%;height:100%;display:block;touch-action:none}
/* Strength numbers (class t) are hidden unless zoomed in (data-z is 1). */
svg .t{display:none}svg[data-z="1"] .t{display:block}
/* #msg: the message toast along the bottom of the board. */
#msg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;pointer-events:none}
/* Hide the toast when it has no text. */
#msg:empty{display:none}
/* #bar: the bottom button bar. */
#bar{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
/* button: the shared look for all buttons, at least 44px so they are easy to tap. */
button{font:inherit;touch-action:manipulation;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 12px}
/* #en: the End turn button takes the spare width and is dark. */
#en,#mcf{flex:1;background:var(--acc);color:var(--acc-ink);border-color:var(--acc-line);font-weight:600}
/* Pressed: darker fill while a finger or mouse button is down. Hover (mouse only): slightly lighter. Disabled: muted fill and text, no highlight. Focus ring for keyboard use. */
@media(hover:hover){#en:hover:not(:disabled),#mcf:hover:not(:disabled){background:var(--acc-hover)}#modes .act:hover:not(:disabled){background:var(--sel-hover)}}
/* Pressed comes AFTER hover and has equal weight so it wins while the button is held down, even with a mouse. */
#en:active:not(:disabled),#mcf:active:not(:disabled){background:var(--acc-press)}#modes .act:active:not(:disabled){background:var(--sel-press)}
#en:disabled,#mcf:disabled,#modes button:disabled{background:var(--dis);color:var(--dis-ink);border-color:var(--line);cursor:not-allowed}
button:focus-visible{outline:2px solid var(--sel-line);outline-offset:2px}
/* #ov: full-screen dim backdrop that centers pop-up dialogs (hidden until JS shows it). */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
/* #ov>div: the dialog box itself. */
#ov>div{background:var(--panel);border-radius:12px;padding:20px;max-width:340px;width:100%}
/* Dialog heading and paragraph text. */
#ov h1{margin:0 0 6px;font-size:26px}#ov p{color:var(--mut);margin:0 0 14px}
/* .r: rows of buttons inside dialogs. */
#ov .r{display:flex;gap:8px}#ov .r button{flex:1;font-weight:600}
/* #zoom: the zoom buttons floating at the top right of the board; also lets tall dialogs scroll. */
#zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}#zoom button{background:var(--panel)}#ov>div{max-height:92%;overflow:auto}
/* #hold: the Hold button, hidden until the defender has a Hold to choose. */
#hold{display:none;font-weight:600}
/* #mcx and #mcf: Cancel and Confirm for a multi-attack, hidden until a multi-attack is being set up (JS shows them and hides End turn meanwhile). */
#mcx,#mcf{display:none;font-weight:600}
/* Apple WebKit only: lock the page so Safari cannot scroll or bounce it, keep the board out of the notch, stop double-tap zoom, and use 16px text in boxes so Safari does not zoom in when one is tapped. */
@supports (-webkit-touch-callout:none){:root{padding-top:0;padding-bottom:0}html{touch-action:manipulation}body{position:fixed;inset:0;height:auto;width:100%;overflow:hidden;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-touch-callout:none}textarea,input{font-size:16px!important}}
/* History viewer. #hv covers the whole screen above everything else; .on shows it. Big arrow buttons and a tall slider make single steps easy to hit with a thumb. */
#zoom{align-items:flex-end}#hbtn{min-width:72px;font-size:13px;font-weight:600}
/* (new) Hide UI, for clean screenshots. .hui = the Hide UI / Show UI button in each side stack (live board and history viewer). When body has class noui, every OTHER button in those stacks turns invisible (visibility keeps their space, so the Hide UI button stays exactly where it was) and stops catching taps; the stack boxes let taps fall through to the board; and the Hide UI button itself fades to a faint ghost that still works. */
.hui,.sbtn{min-width:72px;font-size:13px;font-weight:600}
/* (new) body.nostr: strength numbers stay hidden whatever the zoom (the Strength button). */
body.nostr svg .t{display:none!important}
/* (new) .sbtn.off: the Strength button looks struck through while the numbers are hidden. */
.sbtn.off{text-decoration:line-through;opacity:.6}
body.noui #zoom button:not(.hui),body.noui #hz button:not(.hui){visibility:hidden}
body.noui #zoom,body.noui #hz{pointer-events:none}body.noui .hui{pointer-events:auto;opacity:.18}
/* (new) .chip.off: a player's score box fades when that player is offline in an online game. */
.chip.off{opacity:.5}
/* (new) #ov button.act: the selected choice in a dialog (board size). */
#ov button.act{background:var(--sel);color:var(--sel-ink);border-color:var(--sel-line);font-weight:600}
#hv{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:var(--bg);color:var(--ink);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hv.on{display:flex}
#hvh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#hvt{display:block;font-size:17px}#hvb{display:block;color:#ffb347;font-weight:600;letter-spacing:.02em}
#hvx{min-height:48px;font-weight:600;background:var(--acc);color:var(--acc-ink);border-color:var(--acc-line)}
#hvs{flex:1;position:relative;min-height:0;overflow:hidden}#hsvg{width:100%;height:100%;display:block;touch-action:none}
#hz{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}#hz button{background:var(--panel)}
#hvi{display:flex;gap:6px;padding:6px 10px;background:var(--panel)}
#hvc{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel)}
#hvc button{min-width:60px;min-height:52px;font-size:22px}#hvr{flex:1;height:44px;min-width:0}
/* (new) #hvc2: the step-by-turn buttons under the round slider. */
#hvc2{display:flex;gap:8px;padding:0 10px 8px;background:var(--panel)}#hvc2 button{flex:1;min-height:48px;font-weight:600}
#hvl{padding:0 10px 6px;background:var(--panel);font-weight:600}
#hvq{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 8px;background:var(--panel)}
#hvq button{min-height:46px;padding:0 14px;font-weight:600;color:#000;border-color:transparent}#hvq button.cur{outline:3px solid var(--ink);outline-offset:1px}
#hvm{padding:6px 10px 10px;background:var(--panel);color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
</style></head><body>
<!-- Top panel: empty boxes that JavaScript fills in (info, chips), plus the mode buttons. -->
<div id="top"><div id="info"></div><div id="chips"></div><div id="modes"><button data-m="s">Stars</button><button data-m="p">Place</button><button data-m="m">Move</button><button data-m="x">Multi</button></div></div>
<!-- Board area: the svg drawing surface, with group "w" holding everything drawn, plus the zoom buttons and the message toast. -->
<div id="st"><svg id="svg"><g id="w"></g></svg><div id="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="fi">Fit</button><button id="sbtn" class="sbtn" aria-label="Show or hide strength numbers">Strength</button><button id="hbtn" aria-label="History">History</button><button id="hui" class="hui" aria-label="Hide interface buttons">Hide UI</button></div><div id="msg"></div></div>
<!-- Bottom bar: Undo, Menu, Hold (only shown while the defender chooses), End turn. -->
<div id="bar"><button id="un">Undo</button><button id="sv">Menu</button><button id="hold">Hold</button><button id="mcx">Cancel</button><button id="mcf">Confirm</button><button id="en">End turn</button></div>
<!-- Empty dialog backdrop that JavaScript fills when it needs a pop-up. -->
<div id="ov"></div>
<!-- History viewer: a full-screen, read-only look at past positions. It has its own drawing surface and its own zoom, and never touches the live game. -->
<div id="hv"><div id="hvh"><div><b id="hvt"></b><small id="hvb">PAST POSITION: not the live game</small></div><button id="hvx">Back to game</button></div><div id="hvs"><svg id="hsvg"><g id="hw"></g></svg><div id="hz"><button id="hzi" aria-label="Zoom in">+</button><button id="hzo" aria-label="Zoom out">−</button><button id="hfi">Fit</button><button id="hsbtn" class="sbtn" aria-label="Show or hide strength numbers">Strength</button><button id="hhui" class="hui" aria-label="Hide interface buttons">Hide UI</button></div></div><div id="hvi"></div><div id="hvc"><button id="hvp" aria-label="Previous round">◀</button><input type="range" id="hvr" min="0" max="0" step="1" value="0" aria-label="Round"><button id="hvn" aria-label="Next round">▶</button></div><div id="hvc2"><button id="hvtp" aria-label="Previous turn">◀ Turn</button><button id="hvtn" aria-label="Next turn">Turn ▶</button></div><div id="hvl"></div><div id="hvq"></div><div id="hvm"></div></div>
<script>
/*
A quick JavaScript glossary for reading this file:
const x = 5;     makes a value that never gets reassigned.   let x = 5;   makes one you can change later.
function f(a){}  is a named block of code you run by writing f(1).   (a)=>a+1   is a short anonymous version (an arrow function).
{ }              groups statements. Inside {} after a name: value pairs it is an object, like {x:1,y:2}. [ ] is a list (array).
a==b  equal.  a!=b  not equal.  a&&b  both true.  a||b  either true (also used as 'or use this default').  !a  not.
cond ? x : y     gives x if cond is true, else y.
x.y              the thing called y that belongs to x.   x[0]  the first item of a list.
`text ${v}`      a template string: ${v} is replaced by the value of v.
return           ends the function and hands back a value.   if/else, for and forEach repeat or choose.
Lines are packed tightly, so one physical line often holds several statements separated by ;  The comment above a line explains them in order.
*/
// Constants. COL = player colors by number (0 red, 1 purple, 2 blue, 3 orange). NM = player names. KEY = the name the autosave is stored under in the browser.
const COL=['#ff3b3b','#8a4dff','#34b4ff','#ffa63d'],NM=['Red','Purple','Blue','Orange'],KEY='constellate-save';
// (new) SHARE_BASE = the web address of the hosted game. Share links are built from THIS, never from the page address, so a link copied from a local file still opens the hosted game. Moving hosts later means changing only this line. SHARE_VER = the save/link FORMAT version: raise it whenever the shape or meaning of the game state G changes, so an older hosted copy can refuse a newer link with a clear message.
const SHARE_BASE='https://constellate-alpha.tiiny.site/',SHARE_VER=1;
// (new) ONE shared definition of how big things are drawn, in board units (1 = one system). The drawing code and every placement check read these, so they cannot drift apart. R_STAR/R_CAP are the drawn sizes (unchanged); PAD = just a hair, so drawn edges can never touch yet may sit barely apart (about 1px at the maximum zoom; invisible when zoomed out). BORDER_HALF = half the border line's thickness at maximum zoom (border lines are drawn in screen pixels). Both are fixed in board units so a move is legal or not regardless of zoom.
const R_STAR=.18,R_STROKE=.04,R_CAP=.4,R_CAP_IN=.22,LINE_W=.1,PAD=.01,BORDER_HALF=.011;
// outerR(s) = the real drawn radius of star s including half its outline; capitals are drawn bigger than normal stars.
// (new) BADGE = where a star's Fleet-count badge is drawn relative to the star (board units). The drawing and the tap test (badgeAt) both read it.
const BADGE={dx:.12,dy:.04,w:.52,h:.34};
const outerR=s=>(s&&s.cap?R_CAP:R_STAR)+R_STROKE/2;
// MARG = how far a new star's center must stay from a system border: its drawn radius, the border's half-width and the padding.
const MARG=outerR(null)+BORDER_HALF+PAD;
// $ is a shortcut for finding an HTML element by its id. st, svg and W grab the board area, the drawing surface and the group that holds everything drawn.
const $=i=>document.getElementById(i),st=$('st'),svg=$('svg'),W=$('w');
// CWP = turn-order position of each color (red, blue, orange, purple). Then variables that change while playing: hl (stars to ring), mode (s=stars, p=place, m=move), flow (the move group chosen so far, or nothing), pend (an attack waiting on a choice), G (the whole game state), sel (selected star id), undo (stack of saved states), view (pan and zoom).
const CWP={0:0,2:1,3:2,1:3};let hl=[],mode='s',flow=null,multi=null,pend=null,G=null,sel=null,undo=[],view={k:18,x:0,y:0,min:18};
// acts(r) = Actions available in round r (rises to 15, then falls by 1 per round). cur() = the color number of whoever's turn it is.
const acts=r=>r<=15?r:31-r,cur=()=>G.order[G.ti];
// (new) Board size. G.sz = sectors per side: 7 standard, 5 medium, 3 small (a standard game has no sz field, and older saves are standard). Every sector is 3 by 3 systems, so NSYS(S) = systems per side (21, 15 or 9).
const NSYS=S=>((S&&S.sz)||7)*3;
// say(t) shows message t in the toast at the bottom of the board; empty text hides it.
const say=t=>{$('msg').textContent=t||''};
// ov(h) shows a pop-up dialog containing the HTML text h.
function ov(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').style.display='flex'}
// menu() builds the start screen. First it looks for an autosave in the browser (try/catch so a blocked browser does not crash it).
function menu(){let sv=null;try{sv=localStorage.getItem(KEY)}catch(e){}
// (new) Online: while in an online game the start menu is replaced by the online one.
if(net.on)return netMenuGame();
// (changed) The start screen: New game (opens the New game page), Continue if a save was found, Load game file (so a saved game, including a finished one with its history, can be opened without starting a new game first), Join online game, and Rejoin if this browser was in a room.
 ov('<h1>Constellate</h1><p>Tap one of your Stars, then tap a target. Pinch or scroll to zoom, drag to pan.</p><div class="r"><button onclick="newGameDlg()">New game</button></div>'+(sv?'<div class="r" style="margin-top:8px"><button onclick="cont()">Continue saved game</button></div>':'')+'<div class="r" style="margin-top:8px"><button onclick="$(\'lf\').click()">Load game file</button><button onclick="netMenuOpen()">Join online game</button></div>'+(netSess()?'<div class="r" style="margin-top:8px"><button onclick="netResume()">Rejoin online game</button></div>':'')+'<input id="lf" type="file" accept=".json,.txt" hidden onchange="fromFile(this)"><p id="lm" style="margin:8px 0 0;min-height:1.3em;color:var(--mut)"></p>')}
// start(n) begins a new game. pl = player colors in turn order. caps = where each capital sits as (system column, system row).
// (changed) start(n,sz): n players on a board of sz sectors per side (default 7). Capitals sit the same distance from the edges on every size: one system in (e = far side, m = middle).
function start(n,sz){sz=[3,5,7].includes(sz)?sz:7;const N=sz*3,e=N-2,m=(N-1)/2,pl=n==2?[0,2]:[0,2,3,1],caps=n==2?{0:[e,1],2:[1,e]}:{0:[m,1],1:[1,m],2:[e,m],3:[m,e]};
// Creates the game state G: players, capitals, who is alive, stars, connections, round 1, turn order, whose turn, Action points, used stars, scores, next star id.
 G={pl,caps,alive:{},stars:[],conns:[],round:1,order:[...pl],ti:0,ap:1,used:[],score:{},nid:1,over:null,first:pl[0],gid:newGid()};if(sz!=7)G.sz=sz;
// For each player, add a capital star in the middle of its system (the +.5) with a unique id. cap marks it a capital, co remembers who it originally belonged to.
 pl.forEach(c=>{G.alive[c]=true;G.stars.push({id:G.nid++,x:caps[c][0]+.5,y:caps[c][1]+.5,o:c,cap:1,co:c,f:0})});
// Start the first turn, clear selection and undo, hide the dialog, fit the board to the screen, announce the first player, draw.
 mode='s';resetFlow();G.rank=rankSnap({});beginTurn();sel=null;undo=[];$('ov').style.display='none';fit();say(NM[pl[0]]+' to move');
// (new) A new game starts a fresh history with its first snapshot (round 1, before any turn).
H=newHist();histSnap('s');histSave();render();roundPop()}
// sysStar(x,y) finds the star in system column x, row y (or nothing).
const sysStar=(x,y)=>G.stars.find(s=>Math.floor(s.x)==x&&Math.floor(s.y)==y);
// Helpers. by(id) = star with that id. cs(s) = how many connections star s has. str(s) = strength = connections + fleets. capStar(c) = color c's capital.
const by=id=>G.stars.find(q=>q.id==id),cs=s=>G.conns.filter(c=>c[0]==s.id||c[1]==s.id).length,str=s=>cs(s)+(s.f||0),capStar=c=>G.stars.find(s=>s.cap&&s.co==c);
// beginTurn() resets per-turn things: used stars, Actions, mode. pool = Fleets to place = 1 + the number of players with a higher score than you (your rank). Clears moved-fleet flags. capOnly is true if your capital is held by someone else.
function beginTurn(){G.used=[];G.ap=acts(G.round);mode='s';G.pool=G.rank[cur()]||1;G.stars.forEach(s=>s.fm=0);const cp=capStar(cur());G.capOnly=!!cp&&cp.o!=cur()}
// placeable() lists stars that can receive Fleets: none if your capital is lost, only the capital if capOnly, otherwise every own star reachable from the capital by walking your own connections (a flood-fill search).
function placeable(){const me=cur(),cp=capStar(me);if(!cp||cp.o!=me)return[];if(G.capOnly)return[cp];const seen=new Set([cp.id]),q=[cp];while(q.length){const s=q.pop();G.conns.forEach(c=>{if(c[0]==s.id||c[1]==s.id){const t=by(c[0]==s.id?c[1]:c[0]);if(t.o==me&&!seen.has(t.id)){seen.add(t.id);q.push(t)}}})}return G.stars.filter(s=>seen.has(s.id))}
// placeF(t) places one Fleet on star t if allowed, otherwise explains why. It saves an undo snapshot first.
function placeF(t){if(G.pool<1)return say('No Fleets left to place.');const ok=placeable();if(!t||!ok.includes(t))return say(!ok.length?'Retake your Capital to place Fleets.':G.capOnly?'After a Capital loss you can only place on your Capital.':'Place Fleets on a Star connected to your Capital.');undo.push(JSON.stringify(G));t.f=(t.f||0)+1;G.pool--;say(G.pool+' Fleets left to place.');render()}
// (new) resetFlow() is the ONE place that clears every half-finished interaction: the selected star, a move group in progress, a pending attack, retreat rings and the Hold button. Undo, mode switches, End turn, new game, load and every Cancel call it, so no stale selection or count can survive.
function resetFlow(){sel=null;flow=null;multi=null;pend=null;hl=[];$('hold').style.display=''}
// (new) badgeAt(bx,by) finds the star whose Fleet-count badge is under the board point (bx,by), with a little extra touch tolerance. Used only in Move mode so tapping the Fleets selects their star.
function badgeAt(bx,by){const pad=Math.min(.12,Math.max(.04,8/view.k));return G.stars.find(q=>(q.f||0)>0&&bx>=q.x+BADGE.dx-pad&&bx<=q.x+BADGE.dx+BADGE.w+pad&&by>=q.y+BADGE.dy-pad&&by<=q.y+BADGE.dy+BADGE.h+pad)||null}
// moveF(t) handles taps in Move mode. The step is decided by flow (the group chosen so far), never by sel alone, and the group size always comes from an explicit choice.
function moveF(t){const me=cur();
// Step 1, no group chosen yet: the tap must be one of your stars that holds Fleets.
if(!flow){if(!t||t.o!=me)return say('Tap one of your Stars that has Fleets.');
// fr = Fleets that have not moved this turn.

// How it works: one player HOSTS a room and everyone else JOINS it with a 5-character room code. A free public "matchmaking" server (PeerJS Cloud) only introduces the devices to each other; after that, game data goes straight between the devices (WebRTC), so no game server holds your match. The host's device is the hub: guests talk to the host and the host passes messages on. Whoever's turn it is, that device is in charge of the board and sends the full game state after every change; everyone else just shows it. The only mid-turn question, a defender's Hold or Retreat choice, is sent to the defender's device and the answer is sent back.

// applyFull(m) takes a complete copy of the game and history (new game, rejoin, repair).
function applyFull(m){let g;try{g=prepG(JSON.parse(m.g))}catch(e){return nsend(net.conn,{t:'need'})}
G=g;adoptHistory(m.h);if(m.seats)net.seats=m.seats;net.started=true;net.lobby=false;net.rq=null;net.acting=false;netClearFlow();net.lastG=JSON.stringify(G);net.hsent=H?H.snaps.length:0;
$('ov').onclick=null;$('ov').style.display='none';fit();say(NM[cur()]+' to move'+(net.my.includes(cur())?' (your turn)':''));render();if(m.start)roundPop();if(G.over)overDlg();else if(net.my.includes(cur()))buzz(220)}
// netAsk(m) arrives on the DEFENDER's device: show the ringed Retreat spots and Hold button, or clear them.
function netAsk(m){if(!net.my.includes(m.def))return;net.rq=m.ask?{def:m.def,nb:m.ask.nb,hOK:m.ask.hOK,i:m.ask.i,D:m.ask.D,sent:false}:null;
if(net.rq){buzz([120,70,120]);hl=net.rq.nb;$('hold').style.display=net.rq.hOK?'block':'';say(NM[net.rq.def]+': Fleet '+net.rq.i+' of '+net.rq.D+'. Tap a ringed Star to Retreat'+(net.rq.hOK?', or press Hold.':'.'))}else{hl=[];$('hold').style.display='';say('')}render()}
// netAns(v) arrives on the ATTACKER's device: the defender chose Hold ('H') or a Retreat star (its id). Apply it exactly like a local choice.
function netAns(v){if(!pend||!pend.ph||!pend.rem)return;if(v==='H'){if(pend.hOK)defHold()}else if(typeof v=='number'&&pend.nb.includes(v)&&by(v))defTap(by(v))}
// netAnswer(v) sends this device's answer and waits; netDefTap(x,y) turns a board tap into an answer; holdBtn() is the Hold button for both local and remote defenders.
function netAnswer(v){net.rq.sent=true;$('hold').style.display='';netOut({t:'ans',v});say('Answer sent. Waiting for '+NM[cur()]+'.');render()}
function netDefTap(x,y){const cx=Math.floor(x),cy=Math.floor(y),t=cx>=0&&cy>=0&&cx<NSYS(G)&&cy<NSYS(G)?sysStar(cx,cy):null;if(!t||!net.rq.nb.includes(t.id))return say('Tap a ringed Star to Retreat there'+(net.rq.hOK?', or press Hold.':'.'));netAnswer(t.id)}
function holdBtn(){if(net.on&&net.rq&&!net.rq.sent&&!net.my.includes(cur())){if(net.rq.hOK)netAnswer('H');return}if(pend&&pend.rem)return;defHold()}
// netWaitMsg() is the note the ATTACKER sees while a remote defender decides.
function netWaitMsg(){const d=pend.def;return 'Waiting for '+NM[d]+' to choose Hold or Retreat.'+(seatUp(d)?'':' '+NM[d]+' is offline: Undo cancels the attack, or wait for them to return.')}
// ---- Host side ----
// netHost(n,sz,col) opens a room for n players on a board of sz sectors per side, with the host playing color col: try random codes until the matchmaking server accepts one.
async function netHost(n,sz,col){try{await netLib()}catch(e){return nmsg(e.message)}
netCleanup(true);net.role='host';net.n=n;net.sz=[3,5,7].includes(sz)?sz:7;net.started=false;const pl=n==2?[0,2]:[0,2,3,1],hc=pl.includes(col)?col:pl[0];net.seats=pl.map(c=>({c,kind:c===hc?'host':'open',tok:null,conn:null,online:c===hc}));netMy();net.tok=null;nmsg('Opening a room...');
for(let i=0;i<6&&!net.room;i++){const code=rnd(5),r=await netOpenPeer('cstl-'+code);if(r=='ok')net.room=code;else if(r!='taken')break}
if(!net.room){net.role=null;net.seats=[];net.my=[];return nmsg('Could not reach the matchmaking server. Check your connection and try again.')}
net.on=true;net.gone=false;netSave();netLobby()}
// netOpenPeer(id) registers the host's room id; answers ok, taken (id in use) or fail.
function netOpenPeer(id){return new Promise(res=>{let done=false;const p=mkPeer(id),fin=v=>{if(!done){done=true;res(v)}};
p.on('open',()=>{net.peer=p;hookHost(p);fin('ok')});
p.on('error',e=>{if(done)return netPeerErr(e);try{p.destroy()}catch(x){}fin(e&&e.type=='unavailable-id'?'taken':'fail')});
setTimeout(()=>{if(!done){try{p.destroy()}catch(x){}fin('fail')}},10000)})}
// hookHost(p) wires up a host's room: new guests arriving, and keeping the link to the matchmaking server alive.
function hookHost(p){p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLost(c));c.on('error',()=>{})});p.on('disconnected',()=>{setTimeout(()=>{try{if(!p.destroyed&&net.peer===p)p.reconnect()}catch(e){}},1500)})}
function netPeerErr(e){if(e&&(e.type=='peer-unavailable'))return;netStatus('Network problem: '+(e&&e.type?e.type:'unknown'))}
// hostMsg(conn,m) handles one message from a guest.
function hostMsg(conn,m){if(!m||typeof m!='object')return;conn._t=Date.now();if(m.t=='hello')return hostHello(conn,m);
const s=net.seats.find(q=>q.conn===conn);if(!s)return;
if(m.t=='ping')return nsend(conn,{t:'pong'});if(m.t=='need')return nsend(conn,fullMsg(false));if(m.t=='bye')return hostLost(conn);
// A state message is accepted only from the device whose turn it is; anything else is answered with the truth so the sender is corrected.
if(m.t=='st'){if(!net.started||!G||cur()!==s.c)return nsend(conn,fullMsg(false));if(!applySt(m))return nsend(conn,fullMsg(false));relay(m,conn);return}
if(m.t=='ask')return routeAsk(m,conn);if(m.t=='ans')return routeAns(m,conn)}
// hostHello(conn,m): a guest says hello. Same versions required; a returning key gets its old seat back (even one the host took over); a new player gets the first open seat, before the game starts only.
function hostHello(conn,m){if(m.nv!==NET_VER||m.v!==SHARE_VER)return nsend(conn,{t:'no',why:'The host and you are running different versions of the game. Both of you need the latest hosted copy.'});
let s=m.tok&&net.seats.find(q=>q.tok&&q.tok===m.tok);if(!s&&!net.started)s=net.seats.find(q=>q.kind=='open');
if(!s)return nsend(conn,{t:'no',why:net.started?'This game has already started, and this device was not one of its players.':'This room is full.'});
if(s.conn&&s.conn!==conn){try{s.conn.close()}catch(e){}}
s.conn=conn;s.tok=m.tok||mkTok();s.online=true;s.kind='guest';s.took=false;conn._t=Date.now();
nsend(conn,{t:'welcome',c:s.c,n:net.n,started:net.started,seats:lobbyView()});netPush()}
// hostLost(conn): a guest's line closed. In the lobby the seat reopens; in a game it just shows offline until they return.
function hostLost(conn){const s=net.seats.find(q=>q.conn===conn);if(!s)return;s.conn=null;s.online=false;if(!net.started&&s.kind=='guest'){s.kind='open';s.tok=null}netPush();if(net.started&&G)say(NM[s.c]+' disconnected.')}
// netStart() (host): everyone is seated, so create the game with the normal start code and send everyone a full copy.
function netStart(sz){if(net.role!='host'||net.seats.some(s=>s.kind=='open'))return nmsg('Fill every seat first.');
if(sz)net.sz=sz;net.hold=true;net.started=true;net.lobby=false;netMy();try{start(net.n,net.sz)}finally{net.hold=false}
net.lastG=JSON.stringify(G);net.acting=false;relay(fullMsg(true),null);netPush()}
// netToggleSeat(c) (host): in the lobby, turn an open seat into "the host plays this one too" and back.
function netToggleSeat(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host')return;if(s.kind=='open')s.kind='local';else if(s.kind=='local'&&!s.took)s.kind='open';netPush()}
// netTakeover(c) (host): play an offline player's color from this device. They get it back automatically if they return.
function netTakeover(c){const s=net.seats.find(q=>q.c===c);if(!s||net.role!='host'||s.online)return;s.kind='local';s.took=true;netPush();
if(pend&&pend.ph&&pend.def===c){pend.rem=false;$('hold').style.display=pend.hOK?'block':'';say(NM[c]+': Fleet '+(pend.dec.length+1)+' of '+pend.D+'. Tap a ringed Star to Retreat'+(pend.hOK?', or press Hold.':'.'))}
netMenu();render()}
// ---- Guest side ----
// netJoin(code): join a room. Keeps the same seat key if this browser was in this room before.
async function netJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!=5)return nmsg('Enter the 5-character room code.');
try{await netLib()}catch(e){return nmsg(e.message)}
const ss=netSess();netCleanup(true);net.tok=ss&&ss.role=='guest'&&ss.room==code&&ss.tok?ss.tok:mkTok();net.role='guest';net.room=code;net.on=true;net.gone=false;net.my=[];net.seats=[];net.started=false;net.fails=0;net.lobby=true;netSave();netStatus('Connecting...');guestConnect()}
// guestConnect() opens (or reopens) the line to the host and says hello. If anything fails it tries again every 3 seconds.
async function guestConnect(){if(!net.on||net.role!='guest'||net.busy||net.gone)return;net.busy=true;clearTimeout(net.retry);net.retry=null;
try{await netLib()}catch(e){net.busy=false;return netFail(e.message)}
try{net.peer&&net.peer.destroy()}catch(e){}
const p=mkPeer();net.peer=p;let up=false;
const fail=why=>{if(p!==net.peer||net.retry||net.gone)return;net.busy=false;net.fails++;netStatus(why+(net.fails>3?' If this keeps happening, a firewall or mobile network may be blocking direct connections. Try Wi-Fi on both devices.':''));net.retry=setTimeout(()=>{net.retry=null;guestConnect()},3000)};
p.on('open',()=>{const c=p.connect('cstl-'+net.room,{reliable:true});net.conn=c;
c.on('open',()=>{up=true;net.busy=false;net.fails=0;net.last=Date.now();nsend(c,{t:'hello',nv:NET_VER,v:SHARE_VER,tok:net.tok})});
c.on('data',guestMsg);c.on('close',()=>{if(c===net.conn){net.conn=null;fail('Connection lost. Reconnecting...')}});c.on('error',()=>{});
setTimeout(()=>{if(!up&&c===net.conn){const ice=c.peerConnection&&c.peerConnection.iceConnectionState;try{c.close()}catch(e){}net.conn=null;fail('Could not reach the host yet'+(ice?' (link: '+ice+')':'')+'. Retrying...')}},12000)});
p.on('error',e=>fail(e&&e.type=='peer-unavailable'?'The host is not online yet. Retrying...':'Network problem'+(e&&e.type?' ('+e.type+')':'')+'. Retrying...'))}
// guestMsg(m) handles one message from the host.
function guestMsg(m){if(!m||typeof m!='object')return;net.last=Date.now();
if(m.t=='welcome'){net.my=[m.c];net.n=m.n;net.seats=m.seats||[];net.started=!!m.started;net.status='';netSave();
// Back in a running game: if it is my turn (or I just finished it) my copy is the truth, so push it to the host; otherwise ask for the host's copy.
if(net.started){if(G&&(net.my.includes(cur())||net.acting)){net.lastG='';net.hsent=0;net.acting=true;render()}else nsend(net.conn,{t:'need'})}
if(net.rq)net.rq.sent=false;return netUI()}
if(m.t=='no')return netFail(m.why);
if(m.t=='lobby'){net.seats=m.seats||[];net.started=!!m.started;net.lastAsk='';return netUI()}
if(m.t=='full')return applyFull(m);
if(m.t=='st'){if(!applySt(m))nsend(net.conn,{t:'need'});return}
if(m.t=='ask')return netAsk(m);if(m.t=='ans')return netAns(m.v);
if(m.t=='end')return netEnded()}
// netFail(why) leaves the room and shows a plain reason.
function netFail(why){netCleanup(true);ov('<h1>Could not join</h1><p>'+esc(why||'Unknown problem.')+'</p><div class="r"><button onclick="menu()">OK</button></div>')}
// netEnded(): the host closed the room. The game stays on this device as an ordinary local game.
function netEnded(){netCleanup(true);ov('<h1>Room closed</h1><p>The host ended the online game. The board is still here on your device; you can keep it as a local game or save it.</p><div class="r"><button onclick="$(\'ov\').style.display=\'none\'">OK</button></div>');if(G)render()}
// netDrop() (guest): the line to the host seems dead (no reply, or the phone slept): close it and reconnect.
function netDrop(){if(!net.on||net.role!='guest'||net.gone)return;try{net.conn&&net.conn.close()}catch(e){}net.conn=null;net.busy=false;netStatus('Connection lost. Reconnecting...');guestConnect()}
// netBeat() runs every 5 seconds: guests ping the host and reconnect if nothing comes back; the host drops guests that went silent.
function netBeat(){if(!net.on)return;const now=Date.now();
if(net.role=='guest'){if(net.conn&&net.conn.open){nsend(net.conn,{t:'ping'});if(now-net.last>20000)netDrop()}else if(!net.busy&&!net.retry)guestConnect()}
else if(net.role=='host')net.seats.forEach(s=>{if(s.conn&&now-(s.conn._t||now)>25000){const c=s.conn;try{c.close()}catch(e){}hostLost(c)}})}
if(typeof setInterval=='function')setInterval(netBeat,5000);
// When a phone wakes up or a tab comes back, check the line at once instead of waiting for the next beat.
try{document.addEventListener('visibilitychange',()=>{if(document.hidden||!net.on||net.role!='guest')return;const t=Date.now();if(net.conn&&net.conn.open)nsend(net.conn,{t:'ping'});setTimeout(()=>{if(net.on&&net.last<t)netDrop()},3500)})}catch(e){}
// netCleanup(keepGame) closes everything online and returns this device to ordinary local play. The board stays on screen.
function netCleanup(quiet){net.gone=true;clearTimeout(net.retry);net.retry=null;try{net.seats.forEach(s=>{if(s.conn)try{s.conn.close()}catch(e){}})}catch(e){}try{net.conn&&net.conn.close()}catch(e){}try{net.peer&&net.peer.destroy()}catch(e){}
Object.assign(net,{sz:7,on:false,role:null,room:null,peer:null,conn:null,seats:[],my:[],started:false,rq:null,lastG:'',lastAsk:'',lastDef:null,acting:false,hsent:0,hold:false,status:'',lobby:false,busy:false,fails:0});try{localStorage.removeItem(SKEY)}catch(e){}
hl=[];$('hold').style.display='';if(!quiet&&G)render()}
// netLeave(): the Leave / End online game button. A guest says goodbye; the host tells everyone the room is closed.
function netLeave(){if(net.role=='host')relay({t:'end'},null);else nsend(net.conn,{t:'bye'});const had=!!G&&net.started;netCleanup(true);if(had){$('ov').style.display='none';say('Left the online game. The board is now a local game on this device.');render()}else menu()}
// ---- Screens ----
// netMenuOpen(code) is the Join online game screen: type the 5-character room code (a room link fills it in). Hosting is on the New game page.
function netMenuOpen(code){net.lobby=false;ov('<h1>Join online game</h1><p>Live play: everyone must be online at the same time. Enter the room code from the host, or open the room link they sent you.</p><div class="r"><input id="rc" maxlength="5" value="'+esc(code||'')+'" placeholder="Room code" autocapitalize="characters" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;min-height:44px;font:inherit;text-transform:uppercase;box-sizing:border-box"><button onclick="netJoin($(\'rc\').value)">Join</button></div><p id="nm" style="margin:8px 0 0;min-height:1.3em;color:var(--mut)"></p><div class="r"><button onclick="menu()">Back</button></div>')}
// seatRows() builds the seat list shown in the lobby and the in-game online menu.
function seatRows(game){return net.seats.map(s=>{const me=net.my.includes(s.c),lab=s.kind=='host'?(net.role=='host'?'You (host)':'Host'):s.kind=='local'?(s.took?'Host is playing this seat':'Host plays this seat too'):s.kind=='guest'?(me&&net.role=='guest'?'You':'Joined'):'Waiting...',off=s.kind=='guest'&&!s.online?' (offline)':'';
let btn='';if(net.role=='host'){if(!game&&s.kind=='open')btn='<button onclick="netToggleSeat('+s.c+')">I\'ll play it</button>';else if(!game&&s.kind=='local'&&!s.took)btn='<button onclick="netToggleSeat('+s.c+')">Open it</button>';else if(game&&s.kind=='guest'&&!s.online)btn='<button onclick="netTakeover('+s.c+')">Take over</button>'}
return '<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><i style="width:12px;height:12px;border-radius:50%;background:'+COL[s.c]+';flex:none"></i><b>'+NM[s.c]+'</b><span style="margin-left:auto;color:var(--mut)">'+lab+off+'</span>'+btn+'</div>'}).join('')}
// netLobby() is the waiting room before the game starts.
function netLobby(){net.lobby=true;const link=SHARE_BASE+'#r='+net.room,host=net.role=='host',full=net.seats.length&&!net.seats.some(s=>s.kind=='open');
ov('<h1>'+(host?'Your room':'Joining room')+'</h1><p>Room code: <b style="font-size:24px;letter-spacing:.12em;color:var(--ink)">'+esc(net.room||'')+'</b>'+(host&&net.sz!=7?'<br>Custom board: '+net.sz+' by '+net.sz+' sectors':'')+'</p>'+(host?'<p style="word-break:break-all;font-size:13px">Send friends this link or the code: '+esc(link)+'</p><div class="r"><button onclick="netCopy()">Copy link</button>'+(navigator.share?'<button onclick="netShare()">Share link</button>':'')+'</div>':'')+seatRows(false)+(host?'<div class="r" style="margin-top:10px"><button id="nstart" onclick="netStart()"'+(full?'':' disabled')+'>Start game</button></div>':'<p>'+esc(net.status||(net.seats.length?'Waiting for the host to start the game.':'Connecting...'))+'</p>')+'<p id="nm" style="margin:8px 0 0;min-height:1.3em;color:var(--mut)"></p><div class="r"><button onclick="netLeave()">'+(host?'Close room':'Leave')+'</button></div>')}
// netCopy() and netShare() copy or share the room link (hosts only).
async function netCopy(){nmsg(await copyText(SHARE_BASE+'#r='+net.room)?'Link copied.':'Copying is blocked here; select the link above and copy it by hand.')}
async function netShare(){const u=SHARE_BASE+'#r='+net.room;try{await navigator.share({title:'Constellate',text:'Join my Constellate game:',url:u})}catch(e){if(!e||e.name!='AbortError')netCopy()}}
// netMenu() redraws the Menu's current page (used after a take-over).
function netMenu(){menuPage(menuTab)}
// netMenuGame(keep) is the New game screen while online: the host starts a fresh game with the same players on a Standard or Custom board; guests wait.
function netMenuGame(keep){ng.view='net';if(!keep){ng.sz=net.sz||7;ng.tab=net.sz==7?'std':'cus'}
ov('<h1>Online game</h1><p>Room <b style="color:var(--ink)">'+esc(net.room)+'</b></p>'+(net.role=='host'?'<p style="margin:0 0 4px">New game, same players</p>'+tabBar([['std','Standard'],['cus','Custom']],ng.tab,'ngTab')+(ng.tab=='std'?'<p style="margin:10px 0 0">The full game on the standard 7x7 board.</p>':'<p style="margin:10px 0 4px">Board size</p>'+sizeRow())+'<div class="r" style="margin-top:12px"><button onclick="netStart(ngSize())"'+(net.seats.some(s=>s.kind=="open")?' disabled':'')+'>Start new game</button></div>':'<p>Waiting for the host to start a new game.</p>')+'<div class="r" style="margin-top:8px"><button onclick="netLeave()">'+(net.role=='host'?'End online game':'Leave game')+'</button><button onclick="$(\'ov\').style.display=\'none\'">Close</button></div>')}
// netResume() rejoins the room remembered in this browser after a reload: guests reconnect with their seat key; the host reopens the same room code (the matchmaking server may need up to a minute to free it).
async function netResume(){const ss=netSess();if(!ss||!ss.room)return menu();
try{await netLib()}catch(e){return netFail(e.message)}
try{const g=JSON.parse(localStorage.getItem(KEY));g.history=await histRead();loadObj(g)}catch(e){}
netCleanup(true);net.role=ss.role;net.room=ss.room;net.n=ss.n||2;net.sz=ss.sz||7;net.tok=ss.tok;net.started=!!ss.started;net.gone=false;net.fails=0;
if(ss.role=='guest'){net.on=true;net.lastG=G?JSON.stringify(G):'';net.hsent=H?H.snaps.length:0;net.seats=[];net.my=[];net.lobby=!G;netSave();$('ov').style.display='none';netStatus('Reconnecting...');return guestConnect()}
net.seats=(ss.seats||[]).map(s=>({c:s.c,kind:s.kind=='guest'?'guest':s.kind,tok:s.tok||null,took:!!s.took,conn:null,online:s.kind=='host'||s.kind=='local'}));netMy();net.on=true;net.lobby=!G||!net.started;netStatus('Reopening the room...');
let ok=false;for(let i=0;i<14&&!ok&&net.on;i++){ok=(await netOpenPeer('cstl-'+net.room))=='ok';if(!ok)await new Promise(r=>setTimeout(r,5000))}
if(!ok){return netFail('Could not reopen the room. The matchmaking server may still be holding it; wait a minute and try Rejoin again.')}
net.lastG=G?JSON.stringify(G):'';net.hsent=H?H.snaps.length:0;net.status='';netPush();if(G&&net.started){$('ov').style.display='none';render()}}
// roomOnLoad() opens the Join screen with the code filled in when the address carries #r=CODE (a room link).
function roomOnLoad(){const m=/^#r=([A-Za-z0-9]{5})$/.exec((location.hash||'').replace(/\s+/g,''));if(!m)return;clearHash();netMenuOpen(m[1].toUpperCase())}

// On window resize refit the board, fit it now, and show the start menu.
addEventListener('resize',fit);fit();menu();
// (new) If the address carries #g=..., open that shared game (and react if the address changes later).
addEventListener('hashchange',shareOnLoad);shareOnLoad();
// (new) A room link (#r=CODE) opens the Join screen with the code filled in.
addEventListener('hashchange',roomOnLoad);roomOnLoad();
</script></body></html>
