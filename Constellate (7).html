<title>Constellate</title>
<!-- Head: page title and character set above, mobile viewport above. Next comes the CSS (how things LOOK), then the HTML (what is ON the page), then the JavaScript (what it DOES). -->
<style>
/* :root holds color "variables" (--name) reused everywhere below; these are the light-theme values. The padding keeps content clear of phone notches. */
:root{--bg:#eef3f6;--panel:#fff;--ink:#14212b;--mut:#5c6f7d;--grid:#8fa6b5;--sec:#35505f;--line:#cfdbe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Dark theme: the same variables with dark values, used when the device is in dark mode. */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--panel:#18222c;--ink:#e8eef3;--mut:#93a5b3;--grid:#33444f;--sec:#6d8799;--line:#2a3945}}
/* Same dark values, used if the page is forced dark. */
:root[data-theme="dark"]{--bg:#0d141b;--panel:#18222c;--ink:#e8eef3;--mut:#93a5b3;--grid:#33444f;--sec:#6d8799;--line:#2a3945}
/* html: fill the full height of the screen. */
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
/* body: no margin; stack children vertically (top panel, board, bottom bar); base font and colors; stop pull-to-refresh bounce and text selection. */
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* #top: the panel across the top that holds round info, player chips and mode buttons. */
#top{padding:8px 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
/* #info: the row showing whose turn, the round and Actions left. */
#info{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
/* #info b: the current player's name is bigger. */
#info b{font-size:17px}
/* #chips: the row of player score boxes. */
#chips{display:flex;gap:6px;margin-top:6px}
/* .chip: one player's box (border, rounded corners, layout). */
.chip{flex:1;border:2px solid var(--line);border-radius:8px;padding:3px 7px;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
/* .chip i: the small colored dot inside a chip. */
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
/* .chip small: the star count text, pushed to the right and dimmed. */
.chip small{color:var(--mut);margin-left:auto}
/* .chip.on: outline in the player's color for whoever's turn it is; .chip.dead: faded and crossed out when eliminated. */
.chip.on{border-color:var(--c)}.chip.dead{opacity:.4;text-decoration:line-through}

#modes{display:flex;gap:6px;margin-top:6px}#modes button{flex:1;min-height:38px;padding:0 6px}#modes .act{background:var(--ink);color:var(--bg);font-weight:600}
/* #st: the board area stretches to fill leftover space; position:relative lets overlays be placed inside it. */
#st{flex:1;position:relative;min-height:0;overflow:hidden}
/* svg: the drawing surface fills its area; touch-action:none lets our code handle finger drags and pinches. */
svg{width:100%;height:100%;display:block;touch-action:none}
/* Strength numbers (class t) are hidden unless zoomed in (data-z is 1). */
svg .t{display:none}svg[data-z="1"] .t{display:block}
/* #msg: the message toast along the bottom of the board. */
#msg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;pointer-events:none}
/* Hide the toast when it has no text. */
#msg:empty{display:none}
/* #bar: the bottom button bar. */
#bar{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
/* button: the shared look for all buttons, at least 44px so they are easy to tap. */
button{font:inherit;touch-action:manipulation;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 12px}
/* #en: the End turn button takes the spare width and is dark. */
#en{flex:1;background:var(--ink);color:var(--bg);font-weight:600}
/* #ov: full-screen dim backdrop that centers pop-up dialogs (hidden until JS shows it). */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
/* #ov>div: the dialog box itself. */
#ov>div{background:var(--panel);border-radius:12px;padding:20px;max-width:340px;width:100%}
/* Dialog heading and paragraph text. */
#ov h1{margin:0 0 6px;font-size:26px}#ov p{color:var(--mut);margin:0 0 14px}
/* .r: rows of buttons inside dialogs. */
#ov .r{display:flex;gap:8px}#ov .r button{flex:1;font-weight:600}
/* #zoom: the zoom buttons floating at the top right of the board; also lets tall dialogs scroll. */
#zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}#zoom button{background:var(--panel)}#ov>div{max-height:92%;overflow:auto}
/* #hold: the Hold button, hidden until the defender has a Hold to choose. */
#hold{display:none;font-weight:600}
</style></head><body>
<!-- Top panel: empty boxes that JavaScript fills in (info, chips), plus the mode buttons. -->
<div id="top"><div id="info"></div><div id="chips"></div><div id="modes"><button data-m="s">Stars</button><button data-m="p">Place</button><button data-m="m">Move</button><button id="cc">Concede</button></div></div>
<!-- Board area: the svg drawing surface, with group "w" holding everything drawn, plus the zoom buttons and the message toast. -->
<div id="st"><svg id="svg"><g id="w"></g></svg><div id="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="fi">Fit</button></div><div id="msg"></div></div>
<!-- Bottom bar: Undo, Menu, Hold (only shown while the defender chooses), End turn. -->
<div id="bar"><button id="un">Undo</button><button id="sv">Menu</button><button id="hold">Hold</button><button id="en">End turn</button></div>
<!-- Empty dialog backdrop that JavaScript fills when it needs a pop-up. -->
<div id="ov"></div>
<script>
/*
A quick JavaScript glossary for reading this file:
const x = 5;     makes a value that never gets reassigned.   let x = 5;   makes one you can change later.
function f(a){}  is a named block of code you run by writing f(1).   (a)=>a+1   is a short anonymous version (an arrow function).
{ }              groups statements. Inside {} after a name: value pairs it is an object, like {x:1,y:2}. [ ] is a list (array).
a==b  equal.  a!=b  not equal.  a&&b  both true.  a||b  either true (also used as 'or use this default').  !a  not.
cond ? x : y     gives x if cond is true, else y.
x.y              the thing called y that belongs to x.   x[0]  the first item of a list.
`text ${v}`      a template string: ${v} is replaced by the value of v.
return           ends the function and hands back a value.   if/else, for and forEach repeat or choose.
Lines are packed tightly, so one physical line often holds several statements separated by ;  The comment above a line explains them in order.
*/
// Constants. COL = player colors by number (0 red, 1 purple, 2 blue, 3 orange). NM = player names. KEY = the name the autosave is stored under in the browser.
const COL=['#ff3b3b','#8a4dff','#34b4ff','#ffa63d'],NM=['Red','Purple','Blue','Orange'],KEY='constellate-save';
// (new) ONE shared definition of how big things are drawn, in board units (1 = one system). The drawing code and every placement check read these, so they cannot drift apart. R_STAR/R_CAP are the drawn sizes (unchanged); PAD = the 1px clearance, fixed in board units (about 1px at the smallest Fit scale on a phone) so a move is legal or not regardless of zoom.
const R_STAR=.18,R_STROKE=.04,R_CAP=.4,R_CAP_IN=.22,LINE_W=.1,PAD=.055,BORDER_HALF=.055;
// outerR(s) = the real drawn radius of star s including half its outline; capitals are drawn bigger than normal stars.
const outerR=s=>(s&&s.cap?R_CAP:R_STAR)+R_STROKE/2;
// MARG = how far a new star's center must stay from a system border: its drawn radius, the border's half-width and the padding.
const MARG=outerR(null)+BORDER_HALF+PAD;
// $ is a shortcut for finding an HTML element by its id. st, svg and W grab the board area, the drawing surface and the group that holds everything drawn.
const $=i=>document.getElementById(i),st=$('st'),svg=$('svg'),W=$('w');
// CWP = turn-order position of each color (red, blue, orange, purple). Then variables that change while playing: hl (stars to ring), mode (s=stars, p=place, m=move), mvN (size of the fleet group being moved), pend (an attack waiting on a choice), G (the whole game state), sel (selected star id), undo (stack of saved states), view (pan and zoom).
const CWP={0:0,2:1,3:2,1:3};let hl=[],mode='s',mvN=1,pend=null,G=null,sel=null,undo=[],view={k:18,x:0,y:0,min:18};
// acts(r) = Actions available in round r (rises to 15, then falls by 1 per round). cur() = the color number of whoever's turn it is.
const acts=r=>r<=15?r:31-r,cur=()=>G.order[G.ti];
// say(t) shows message t in the toast at the bottom of the board; empty text hides it.
const say=t=>{$('msg').textContent=t||''};
// ov(h) shows a pop-up dialog containing the HTML text h.
function ov(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').style.display='flex'}
// menu() builds the start screen. First it looks for an autosave in the browser (try/catch so a blocked browser does not crash it).
function menu(){let sv=null;try{sv=localStorage.getItem(KEY)}catch(e){}
// The start dialog: buttons for 2 or 4 players, plus Continue if a save was found.
 ov('<h1>Constellate</h1><p>Tap one of your Stars, then tap a target. Pinch or scroll to zoom, drag to pan.</p><div class="r"><button onclick="start(2)">2 players</button><button onclick="start(4)">4 players</button></div>'+(sv?'<div class="r" style="margin-top:8px"><button onclick="cont()">Continue saved game</button></div>':''))}
// start(n) begins a new game. pl = player colors in turn order. caps = where each capital sits as (system column, system row).
function start(n){const pl=n==2?[0,2]:[0,2,3,1],caps=n==2?{0:[19,1],2:[1,19]}:{0:[10,1],1:[1,10],2:[19,10],3:[10,19]};
// Creates the game state G: players, capitals, who is alive, stars, connections, round 1, turn order, whose turn, Action points, used stars, scores, next star id.
 G={pl,caps,alive:{},stars:[],conns:[],round:1,order:[...pl],ti:0,ap:1,used:[],score:{},nid:1,over:null};
// For each player, add a capital star in the middle of its system (the +.5) with a unique id. cap marks it a capital, co remembers who it originally belonged to.
 pl.forEach(c=>{G.alive[c]=true;G.stars.push({id:G.nid++,x:caps[c][0]+.5,y:caps[c][1]+.5,o:c,cap:1,co:c})});
// Start the first turn, clear selection and undo, hide the dialog, fit the board to the screen, announce the first player, draw.
 mode='s';pend=null;hl=[];$('hold').style.display='';G.rank=rankSnap({});beginTurn();sel=null;undo=[];$('ov').style.display='none';fit();say(NM[pl[0]]+' to move');render();roundPop()}
// sysStar(x,y) finds the star in system column x, row y (or nothing).
const sysStar=(x,y)=>G.stars.find(s=>Math.floor(s.x)==x&&Math.floor(s.y)==y);
// Helpers. by(id) = star with that id. cs(s) = how many connections star s has. str(s) = strength = connections + fleets. capStar(c) = color c's capital.
const by=id=>G.stars.find(q=>q.id==id),cs=s=>G.conns.filter(c=>c[0]==s.id||c[1]==s.id).length,str=s=>cs(s)+(s.f||0),capStar=c=>G.stars.find(s=>s.cap&&s.co==c);
// beginTurn() resets per-turn things: used stars, Actions, mode. pool = Fleets to place = 1 + the number of players with a higher score than you (your rank). Clears moved-fleet flags. capOnly is true if your capital is held by someone else.
function beginTurn(){G.used=[];G.ap=acts(G.round);mode='s';G.pool=G.rank[cur()]||1;G.stars.forEach(s=>s.fm=0);const cp=capStar(cur());G.capOnly=!!cp&&cp.o!=cur()}
// placeable() lists stars that can receive Fleets: none if your capital is lost, only the capital if capOnly, otherwise every own star reachable from the capital by walking your own connections (a flood-fill search).
function placeable(){const me=cur(),cp=capStar(me);if(!cp||cp.o!=me)return[];if(G.capOnly)return[cp];const seen=new Set([cp.id]),q=[cp];while(q.length){const s=q.pop();G.conns.forEach(c=>{if(c[0]==s.id||c[1]==s.id){const t=by(c[0]==s.id?c[1]:c[0]);if(t.o==me&&!seen.has(t.id)){seen.add(t.id);q.push(t)}}})}return G.stars.filter(s=>seen.has(s.id))}
// placeF(t) places one Fleet on star t if allowed, otherwise explains why. It saves an undo snapshot first.
function placeF(t){if(G.pool<1)return say('No Fleets left to place.');const ok=placeable();if(!t||!ok.includes(t))return say(!ok.length?'Retake your Capital to place Fleets.':G.capOnly?'After a Capital loss you can only place on your Capital.':'Place Fleets on a Star connected to your Capital.');undo.push(JSON.stringify(G));t.f=(t.f||0)+1;G.pool--;say(G.pool+' Fleets left to place.');render()}
// moveF(t) handles taps while in Move mode.
function moveF(t){const me=cur();
// First tap: must be your own star with free (not yet moved) Fleets. fr = how many are free.
 if(!sel){if(!t||t.o!=me)return say('Tap one of your Stars that has Fleets.');const fr=(t.f||0)-(t.fm||0);if(fr<1)return say('No free Fleets here.');
// If only 1 Fleet is free, select the star and wait for a destination.
  if(fr==1){sel=t.id;mvN=1;say('Tap a Star within 1 Connection.');return render()}
// Otherwise show a dialog with buttons 1 to fr to choose the group size.
  return ov(`<h1>Move how many Fleets?</h1><p>A group of n travels up to n Connections.</p><div class="r" style="flex-wrap:wrap">${[...Array(fr)].map((_,i)=>`<button onclick="pickN(${t.id},${i+1})">${i+1}</button>`).join('')}</div>`)}
// Second tap: a = the selected star. Tapping empty space, the same star or an enemy cancels.
 const a=by(sel);if(!t||t===a||t.o!=me){sel=null;say('');return render()}
// Breadth-first search: from a, walk along your own connections up to mvN steps, recording each star's distance in d.
 const d=new Map([[a.id,0]]),q=[a];while(q.length){const x=q.shift();if(d.get(x.id)>=mvN)continue;G.conns.forEach(c=>{if(c[0]==x.id||c[1]==x.id){const u=by(c[0]==x.id?c[1]:c[0]);if(u.o==me&&!d.has(u.id)){d.set(u.id,d.get(x.id)+1);q.push(u)}}})}
// If the target star was not reached within range, explain.
 if(!d.has(t.id))return say('Out of reach. '+mvN+' Fleet'+(mvN>1?'s travel':' travels')+' up to '+mvN+' Connection'+(mvN>1?'s':'')+' along your network.');
// Valid move: save undo, take Fleets from a, add them to t, mark them moved (fm), clear selection, say so.
 undo.push(JSON.stringify(G));a.f-=mvN;t.f=(t.f||0)+mvN;t.fm=(t.fm||0)+mvN;sel=null;say('Moved '+mvN+'.');render()}
// pickN(id,n) runs when a size button is tapped: remember the star and group size, then wait for a destination tap.
function pickN(id,n){$('ov').style.display='none';sel=id;mvN=n;say('Tap a Star within '+n+' Connection'+(n>1?'s':''));render()}
// resolve(A) runs once an attack is paid for with A committed Fleets. It now only gathers facts, then hands the defender's Fleets to the choice loop (defNext) below. Nothing on the board changes yet.
function resolve(A){$('ov').style.display='none';
// b = the target star, D = its defending Fleets, def = the defender's color, nb = retreat spots: the defender's other stars joined to the target by a connection.
const b=by(pend.b),D=b.f||0,def=b.o,nb=G.conns.filter(q=>q.includes(b.id)).map(q=>by(q[0]==b.id?q[1]:q[0])).filter(x=>x.o==def&&x!==b);
// Store on pend: A attackers, nb retreat spot ids, D defenders, dec = the decision for each defending Fleet so far, hold = Holds so far, ph = 1 marks that the defender is mid-decision (other input is blocked).
pend.A=A;pend.nb=nb.map(x=>x.id);pend.D=D;pend.dec=[];pend.hold=0;pend.ph=1;
// Start stepping through the defending Fleets (finishes straight away if there are none).
defNext()}
// defNext() walks through the defending Fleets one at a time. It decides by itself only when there is no real choice; otherwise it stops and waits for the defender.
function defNext(){
// Keep going until every defending Fleet has a decision.
while(pend.dec.length<pend.D){
// hOK: an attacking Fleet is still left to pair off, so Hold is allowed. rOK: at least one retreat spot exists.
const hOK=pend.hold<pend.A,rOK=pend.nb.length>0;
// Neither option exists: this Fleet is destroyed ('X').
if(!hOK&&!rOK){pend.dec.push('X');continue}
// Only Hold exists: it is forced ('H') and destroys one attacker.
if(hOK&&!rOK){pend.dec.push('H');pend.hold++;continue}
// A real choice: remember whether Hold is allowed, ring the retreat spots, show the Hold button only if allowed, and put the instruction in the bottom message area.
pend.hOK=hOK;hl=pend.nb;$('hold').style.display=hOK?'block':'';
say(NM[by(pend.b).o]+': Fleet '+(pend.dec.length+1)+' of '+pend.D+'. Tap a ringed Star to Retreat'+(hOK?', or press Hold.':'.'));
// Redraw (to show the rings) and wait for a tap or the Hold button.
return render()}
// Every Fleet has a decision, so apply the whole attack at once.
fin()}
// defTap(t) handles a board tap while the defender is choosing: a ringed star sends the current Fleet there.
function defTap(t){
// Anything that is not a ringed star is rejected with a hint.
if(!t||!pend.nb.includes(t.id))return say('Tap a ringed Star to Retreat there'+(pend.hOK?', or press Hold.':'.'));
// Record this Fleet's destination (the star id) and move on to the next Fleet.
pend.dec.push(t.id);defNext()}
// defHold() is the Hold button: only valid mid-decision and only when Hold is allowed. It records a Hold and moves on.
function defHold(){if(pend&&pend.ph&&pend.hOK){pend.dec.push('H');pend.hold++;defNext()}}
// lbl(s) makes a coordinate label like D4-bb: sector letter and row, then the position inside the sector.
const lbl=s=>'ABCDEFG'[Math.floor(s.x/3)]+(Math.floor(s.y/3)+1)+'-'+'abc'[Math.floor(s.x)%3]+'abc'[Math.floor(s.y)%3];
// fin() applies the finished attack in one go: capture the star, settle every defending Fleet from pend.dec, spend the Actions.
function fin(){const {a:ai,b:bi,A,c,dec}=pend,b=by(bi),D=b.f||0;
// Clear the rings and hide the Hold button, remember the attacker a and current player me, end the pending state, and save ONE undo snapshot so a single Undo reverses the whole attack.
hl=[];$('hold').style.display='';const a=by(ai),me=cur();pend=null;undo.push(JSON.stringify(G));
// Count outcomes: holds (each destroys one attacker), lost (no option left), rets (the destination star ids of retreating Fleets); surv = attacking Fleets that survive.
const holds=dec.filter(x=>x=='H').length,lost=dec.filter(x=>x=='X').length,rets=dec.filter(x=>typeof x=='number'),surv=A-holds;
// Each retreating Fleet joins the star the defender chose for it.
rets.forEach(id=>{const d=by(id);d.f=(d.f||0)+1});
// The capture (unchanged): take the committed Fleets off a, erase the target's connections, change its owner, set the surviving attackers on it (marked moved), connect a to it, mark both used, spend the Actions, clear selection.
a.f=(a.f||0)-A;G.conns=G.conns.filter(q=>q[0]!=b.id&&q[1]!=b.id);b.o=me;b.f=surv;b.fm=surv;G.conns.push([a.id,b.id]);G.used.push(a.id,b.id);G.ap-=c;sel=null;
// Check eliminations, report the outcome in the message area, redraw.
const m=elim();say('Star taken for '+c+'.'+(D?' '+rets.length+' retreated, '+holds+' held, '+lost+' destroyed.':'')+m);render()}
// kill(c) eliminates player c: remove their connections and Fleets (their stars stay on the board).
function kill(c){G.alive[c]=false;G.conns=G.conns.filter(q=>by(q[0]).o!=c);G.stars.forEach(s=>{if(s.o==c)s.f=0})}
// deficit(vp): al = alive players; t = the distinct scores sorted low to high.
function deficit(vp){const al=G.pl.filter(c=>G.alive[c]),t=[...new Set(al.map(c=>vp[c]))].sort((a,b)=>a-b);
// Walk up the gaps between scores; at the first gap bigger than 3, eliminate everyone at the lower score and return a message; otherwise return nothing.

// conc() asks the current player to confirm conceding.
function conc(){if(!G||G.over)return;if(pend&&pend.ph)return say('Finish the Hold or Retreat choices first.');ov(`<h1>${NM[cur()]} concedes?</h1><p>You are eliminated immediately.</p><div class="r"><button onclick="doConc()">Concede</button><button onclick="$('ov').style.display='none'">Cancel</button></div>`)}
// doConc() eliminates the current player and fixes the turn order. If fewer than 2 players remain the game ends; otherwise step back one and end the turn so the next player starts.
function doConc(){$('ov').style.display='none';const c=cur();kill(c);G.order=G.order.filter(x=>G.alive[x]);if(G.pl.filter(x=>G.alive[x]).length<2)return finish();G.ti--;endTurn();say(NM[c]+' conceded. '+NM[cur()]+' to move.')}
// cost(a,b) = Actions a line costs = system borders crossed = column difference plus row difference.
const cost=(a,b)=>Math.abs(Math.floor(a.x)-Math.floor(b.x))+Math.abs(Math.floor(a.y)-Math.floor(b.y));
// dseg(p,a,b) = shortest distance from point p to the line segment a-b (geometry).
function dseg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
// clear(a,b) is true when no other star sits within 0.2 of the line a-b.
// (changed) A line a-b must keep the star's drawn radius + half the line's width + the padding from every star except its own two ends (capitals count with their bigger radius).
const clear=(a,b)=>G.stars.every(s=>s===a||s===b||dseg(s,a,b)>=outerR(s)+LINE_W/2+PAD);
// (new) spotErr(p) checks a proposed NEW star position p: empty text means fine, otherwise the reason. It must clear every star and every existing connection by their drawn sizes plus the padding.
function spotErr(p){const me={x:p.x,y:p.y};
if(G.stars.some(s=>Math.hypot(s.x-p.x,s.y-p.y)<outerR(s)+outerR(null)+2*PAD))return 'Too close to another Star.';
if(G.conns.some(q=>dseg(me,by(q[0]),by(q[1]))<outerR(null)+LINE_W/2+PAD))return 'Too close to a Connection.';
return ''}
// (new) roomIn(cx,cy,a) tries an 11 by 11 grid of spots in system (cx,cy) and says whether ANY legal spot exists, counting the new line from star a too.
function roomIn(cx,cy,a){for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){const p={x:cx+MARG+(1-2*MARG)*i/10,y:cy+MARG+(1-2*MARG)*j/10};if(!spotErr(p)&&clear(a,p))return true}return false}
// calc() does the scoring. ctl = a 7x7 grid of who controls each sector (-1 = nobody). vp = Victory Points per color.
function calc(){const ctl=[...Array(7)].map(()=>Array(7).fill(-1)),vp=[0,0,0,0];
// For each sector count each color's stars (n) and the total t. A color controls the sector if it has more than half.
 for(let y=0;y<7;y++)for(let x=0;x<7;x++){const n=[0,0,0,0];G.stars.forEach(s=>{if(Math.floor(s.x/3)==x&&Math.floor(s.y/3)==y)n[s.o]++});const t=n[0]+n[1]+n[2]+n[3];n.forEach((v,c)=>{if(v*2>t)ctl[y][x]=c})}

 ctl.forEach((r,y)=>r.forEach((c,x)=>{if(c>=0)vp[c]+=(x==3&&y==3)?3:1}));
// Add 1 for every full row and every full column controlled by one color.
 for(let i=0;i<7;i++){const r=ctl[i][0];if(r>=0&&ctl[i].every(v=>v==r))vp[r]++;const c=ctl[0][i];if(c>=0&&ctl.every(q=>q[i]==c))vp[c]++}

// elim() checks eliminations. c0 remembers whose turn it is. Anyone alive with no stars is killed and noted in a message.
function elim(){const c0=cur();let m='';G.pl.forEach(c=>{if(G.alive[c]&&!G.stars.some(s=>s.o==c)){kill(c);m+=' '+NM[c]+' is eliminated.'}});

 G.over=top;render();ov('<h1>'+(top.length==1?NM[top[0]]+' wins':'Tied')+'</h1><p>'+G.pl.map(c=>NM[c]+' '+vp[c]+' VP, '+sys(c)+' systems').join('<br>')+(top.length>1?'<br>Overtime is not built yet.':'')+'</p><div class="r"><button onclick="saveFile(this)">Save file</button><button onclick="menu()">New game</button></div>')}

function tap(bx,by){if(!G||G.over)return;const cx=Math.floor(bx),cy=Math.floor(by);

// t = the star in the tapped system, me = the current player. Place mode goes to placeF, Move mode goes to moveF.
 const t=sysStar(cx,cy),me=cur();if(mode=='p')return placeF(t);if(mode=='m')return moveF(t);
// Nothing selected yet: tapping your own unused star selects it; anything else shows a hint.
 if(!sel){if(t&&t.o==me){if(G.used.includes(t.id))say('That Star already acted, or is new, this turn.');else{sel=t.id;say('Tap an empty system to set a Star, your Star to connect, or an enemy Star to take.')}}else say('Tap one of your Stars to start a move.');return render()}

// Set and connect moves: save an undo snapshot.

// Set: create a new star with a fresh id, connect it to the origin, mark both used.

// (new) rankSnap(sc) turns a score table into DENSE ranks among alive players: the best score is rank 1 and each lower distinct score is the next rank (7/4/4/4 gives 1/2/2/2, and two tied leaders give 1/1/2/3).
function rankSnap(sc){
// al = alive players; d = their distinct scores, highest first; r = the result table (color to rank).
const al=G.pl.filter(c=>G.alive[c]),d=[...new Set(al.map(c=>sc[c]||0))].sort((a,b)=>b-a),r={};
// A player's rank is the position of their score in that list, counted from 1.
al.forEach(c=>{r[c]=d.indexOf(sc[c]||0)+1});return r}
// (new) turnOrder(ref) builds next round's order from the rank snapshot, one place at a time. ref = the first player of the round that just ended.
function turnOrder(ref){
// rem = players still to place, out = the order being built, last = whoever just went (starts as ref), n = number of players in the list.
const rem=G.pl.filter(c=>G.alive[c]),out=[],n=G.pl.length;let last=ref;
// Repeat until everyone is placed.
while(rem.length){
// best = the best rank still waiting; tied = everyone holding it.
const best=Math.min(...rem.map(c=>G.rank[c])),tied=rem.filter(c=>G.rank[c]==best);
// dist(c) = how many steps "to the left" (next down the player list, wrapping) c is from last; last itself counts as farthest.
const dist=c=>(G.pl.indexOf(c)-G.pl.indexOf(last)+n-1)%n;
// Of the tied players the nearest one to the left of last goes next (so a single player is simply picked).
tied.sort((a,b)=>dist(a)-dist(b));const pick=tied[0];
// Add them to the order, remove them from the waiting list, and make them the reference for the next place.
out.push(pick);rem.splice(rem.indexOf(pick),1);last=pick}
return out}

function roundPop(){

const row=c=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><i style="width:12px;height:12px;border-radius:50%;background:${COL[c]};flex:none"></i><b>${NM[c]}</b><span style="margin-left:auto">Rank ${G.alive[c]?G.rank[c]:'X'}</span><span style="min-width:56px;text-align:right">${G.alive[c]?(G.score[c]||0)+' VP':'X'}</span></div>`;

// (fixed) The click that OPENS the popup (a button inside another dialog, which was just replaced) bubbles up to the popup's own tap handler and used to close it instantly. A click whose target is no longer on the page is therefore ignored.
function closeRound(e){if(e&&e.target&&!e.target.isConnected)return;$('ov').style.display='none';$('ov').onclick=null}
// endTurn() ends the current turn. em holds an extra message. Clear selection, undo history and used stars.
function endTurn(){if(!G||G.over)return;let em='',newRound=false;sel=null;undo=[];G.used=[];

// persist() autosaves the game in the browser (silently ignores errors).
function persist(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}

// apply() applies the current pan and zoom to the drawing and records the zoom level for CSS.
function apply(){W.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);svg.dataset.z=view.k>38?1:0}
// fit() sizes the whole board to the screen and centers it.
function fit(){const r=st.getBoundingClientRect();view.k=view.min=Math.min(r.width,r.height)/21.6;view.x=(r.width-21*view.k)/2;view.y=(r.height-21*view.k)/2;apply()}

if(pend&&pend.ph)return ov(`<h1>Menu</h1><p>An attack is in progress. A save now keeps the board as it was before the attack.</p><div class="r"><button onclick="saveFile(this)">Save file</button><button onclick="$('ov').style.display='none'">Close</button></div>`);ov(`<h1>Menu</h1><p>The game also autosaves in this browser.</p><div class="r" style="margin-bottom:8px"><button onclick="toFile()">Save file</button><button onclick="$('lf').click()">Load file</button></div><input id="lf" type="file" accept=".json,.txt" hidden onchange="fromFile(this)"><textarea id="sc" rows="4" style="width:100%;box-sizing:border-box;font:12px monospace">${JSON.stringify(G)}</textarea><div class="r" style="margin-top:8px"><button onclick="copySave()">Copy code</button><button onclick="fromText()">Load code</button><button onclick="$('ov').style.display='none'">Close</button></div><div class="r" style="margin-top:8px;align-items:center"><span style="flex:1">Dev: set round</span><input id="dr" type="number" min="1" max="30" value="${G.round}" style="width:64px;font:inherit;min-height:44px;box-sizing:border-box"><button onclick="setRound()">Set</button></div>`)}
// setRound() is the dev tool: sets the round (1 to 30), refreshes Actions, clears used stars and undo.
function setRound(){if(!G||G.over)return;const n=Math.max(1,Math.min(30,parseInt($('dr').value)||1));G.round=n;G.ap=acts(n);G.used=[];sel=null;undo=[];$('ov').style.display='none';say('Dev: round set to '+n+'. Actions: '+G.ap+'.');render()}
// Hook up the Menu button.
// (new) Hook up the Hold button.
$('hold').onclick=defHold;
$('sv').onclick=saveUI;
// On window resize refit the board, fit it now, and show the start menu.
addEventListener('resize',fit);fit();menu();
</script></body></html>
