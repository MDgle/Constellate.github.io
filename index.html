:root[data-theme="cgreen"]{--bg:#000000;--panel:#031006;--ink:#33ff66;--mut:#1fb84a;--grid:#0c4a1e;--sec:#1fb84a;--line:#14702c;--dis:#021208;--dis-ink:#1a6b30;--warn:#ffb000;--acc:#06260f;--acc-hover:#0a3a17;--acc-press:#031a0a;--acc-ink:#33ff66;--acc-line:#33ff66;--sel:#33ff66;--sel-hover:#5dff85;--sel-press:#1fcc50;--sel-ink:#000000;--sel-line:#aaffc0; color-scheme:dark}

/* Cassette filter: body.crt. A fixed overlay (never catches taps) draws scan lines and a dark vignette and flickers very slightly; a slow lighter band rolls down the screen; text glows a little. Everything is switched off by reduced-motion except the static lines. */
body.crt{text-shadow:0 0 3px currentColor}
body.crt::after{content:"";position:fixed;inset:0;z-index:2147483000;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.32) 0,rgba(0,0,0,.32) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);animation:crtf .12s steps(2) infinite}
body.crt::before{content:"";position:fixed;left:0;right:0;top:0;height:18%;z-index:2147483000;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.05),transparent);animation:crtr 7s linear infinite}
@keyframes crtf{0%{opacity:.94}100%{opacity:1}}
@keyframes crtr{0%{transform:translateY(-120%)}100%{transform:translateY(660%)}}
@media(prefers-reduced-motion:reduce){body.crt::after,body.crt::before{animation:none}body.crt::before{display:none}}
/* html: fill the full height of the screen. */
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
/* body: no margin; stack children vertically (top panel, board, bottom bar); base font and colors; stop pull-to-refresh bounce and text selection. */
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.3 "Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* #top: the panel across the top that holds round info, player chips and mode buttons. */
#top{padding:8px 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
/* #info: the row showing whose turn, the round and Fuel left. */
#info{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
/* #info b: the current player's name is bigger. */
#info b{font-size:17px}
/* (new) #inft holds the text that render() rewrites (name, team, round, online status); display:contents lets its spans sit in the #info row directly, so the Fuel gauge beside them is never rebuilt and can animate. .onl = the online status, kept at the end of the row. */
#inft{display:contents}#info .onl{order:2}
/* (new) Fuel gauge (see fuelUi): "Fuel X" in the warning color, then a bar that fills the rest of the row. #ffill = the Fuel left, flat-ended. Two shapes in the same color sit under it and only show while it moves (fuelGo): #fcres = a crescent whose hollow (8 px deep) faces right, its tips at the right end of the element; #fcap = a rounded cap. At rest both end where #ffill ends, so the edge is straight. #fdiv = one dashed line per Fuel step, under the fill, so a line shows only once no Fuel is over it. */
#fuel{order:1;flex:1;min-width:130px;display:flex;align-items:center;gap:8px}#info #fueln{font-size:16px;color:var(--warn);white-space:nowrap}
#fbar{flex:1;position:relative;height:16px;border-radius:8px;overflow:hidden}#fbar::after{content:'';position:absolute;inset:0;border:2px solid var(--warn);border-radius:8px;pointer-events:none}
#fdiv{position:absolute;inset:2px 0}#fdiv i{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(var(--warn) 0 2px,transparent 2px 4px)}
#ffill,#fcres,#fcap{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--warn)}#fcap{border-radius:0 999px 999px 0}
#fcres{-webkit-mask-image:radial-gradient(circle 6.25px at calc(100% - 1.75px) 50%,transparent 97%,#000 100%);mask-image:radial-gradient(circle 6.25px at calc(100% - 1.75px) 50%,transparent 97%,#000 100%)}
/* #chips: the row of player score boxes. */
#chips{display:flex;gap:6px;margin-top:6px}
/* .chip: one player's box (border, rounded corners, layout). (new) Its background is a dull tint of the player's color (10% over the panel) with the theme border; the active player's chip (.on) gets the round-screen chip look: 22% tint and a border in the player's color (see .pchip). */
.chip{flex:1;border:2px solid var(--line);border-radius:8px;padding:3px 6px;font-size:11.5px;line-height:1.25;display:flex;align-items:center;gap:5px;min-width:0;background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.chip .ct{display:flex;flex-direction:column;min-width:0;flex:1}.chip .ct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip .ct span+span{color:var(--mut)}
/* .chip i: the small colored dot inside a chip. */
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* .chip small: the star count text, pushed to the right and dimmed. */
.chip small{color:var(--mut);margin-left:auto}
/* .chip.on: outline in the player's color for whoever's turn it is; .chip.dead: faded and crossed out when eliminated. */
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel))}.chip.dead{opacity:.4;text-decoration:line-through}
/* (step 7) #tvp: the team totals line under the player chips (team games only; empty = hidden). */
#tvp{font-size:12px;color:var(--mut);margin-top:4px}#tvp:empty{display:none}
/* #modes: two mode buttons, Star (opens Set / Multi) and Fleet (opens Place / Move), each in its own slot (.mg); .act marks the selected one. A pair's second button (.sub) hides behind the first until its pair is open, then slides down from beneath it and hangs below the top panel, over the board (#top is raised above the board for this, z-index 3; popups #ov 4 and #ov2 6 stay above it). .calm (Animations Off) and reduced motion skip the slide. */
#top{position:relative;z-index:3}
#modes{display:flex;gap:6px;margin-top:6px}#modes .mg{flex:1;position:relative;display:flex;min-width:0}#modes button{flex:1;min-height:38px;padding:0 6px;position:relative;z-index:1;white-space:nowrap;overflow:hidden}
#modes .sub{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:0;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:transform .22s ease-out,opacity .22s ease-out}#modes .sub.shut{transform:translateY(calc(-100% - 6px));opacity:0;pointer-events:none;box-shadow:none}
#modes.calm .sub{transition:none}@media(prefers-reduced-motion:reduce){#modes .sub{transition:none}}#modes .act{background:var(--sel);color:var(--sel-ink);border-color:var(--sel-line);font-weight:600}
/* #st: the board area stretches to fill leftover space; position:relative lets overlays be placed inside it. */
#st{flex:1;position:relative;min-height:0;overflow:hidden}
/* svg: the drawing surface fills its area; touch-action:none lets our code handle finger drags and pinches. */
svg{width:100%;height:100%;display:block;touch-action:none}
/* Strength numbers (class t) are hidden unless zoomed in (data-z is 1). */
svg .t{display:none}svg[data-z="1"] .t{display:block}
/* #msg: the message toast along the bottom of the board. */
#msg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;pointer-events:none}
/* Hide the toast when it has no text. */
#msg:empty{display:none}
/* #bar: the bottom button bar. */
#bar{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}

/* button: the shared look for all buttons, at least 44px so they are easy to tap. */
button{font:inherit;touch-action:manipulation;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 12px}
/* #en: the End turn button takes the spare width and is dark. */
#en,#mcf,#pvc{flex:1;background:var(--acc);color:var(--acc-ink);border-color:var(--acc-line);font-weight:600}
/* Pressed: darker fill while a finger or mouse button is down. Hover (mouse only): slightly lighter. Disabled: muted fill and text, no highlight. Focus ring for keyboard use. */
@media(hover:hover){#en:hover:not(:disabled),#mcf:hover:not(:disabled){background:var(--acc-hover)}#modes .act:hover:not(:disabled){background:var(--sel-hover)}}
/* Pressed comes AFTER hover and has equal weight so it wins while the button is held down, even with a mouse. */
#en:active:not(:disabled),#mcf:active:not(:disabled){background:var(--acc-press)}#modes .act:active:not(:disabled){background:var(--sel-press)}
#en:disabled,#mcf:disabled,#modes button:disabled{background:var(--dis);color:var(--dis-ink);border-color:var(--line);cursor:not-allowed}
/* (new) #en.nogo: End turn while the turn cannot end yet (see endBlock): faded, with darker diagonal stripes over the button color. It stays tappable so a tap can say why and point at what is left (endHint). */
#en.nogo,#en.nogo:hover,#en.nogo:active,#mcf.nogo,#mcf.nogo:hover,#mcf.nogo:active{background:var(--acc) repeating-linear-gradient(135deg,transparent 0 7px,rgba(0,0,0,.32) 7px 11px);opacity:.6}
/* (new) .flick: a refused End turn or multi-attack Confirm flickers dark a few times. */
@keyframes flk{50%{filter:brightness(.3)}}.flick{animation:flk .15s ease-in-out 4}
/* (new) #mbar: during a multi-attack the mode row is swapped for two boxes shaped like the mode buttons (see uiMulti). #mbt = the target's Strength, in its owner's color; #mba = the attackers' combined Strength, in the attacker's color, dimmed until it beats the target, then bright with a ring (.win). Empty boxes are dulled. */
#mbar{display:none;gap:6px;margin-top:6px}#mbar>div{flex:1;min-height:38px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--dis);opacity:.55;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
#mbar>div.on{background:var(--c);opacity:1}#mba.on{filter:brightness(.7)}#mba.win{filter:brightness(1.2);border:2px solid var(--ink)}
:root[data-theme="cgreen"] #mbar>div,:root[data-theme="ccyan"] #mbar>div,:root[data-theme="corange"] #mbar>div{border-radius:0}
/* (new) svg .hint: the dashed rings End turn puts on Stars that can still use Fuel; they stay for 1 second, then fade out. */
svg .hint{animation:hintf 1.4s linear forwards}@keyframes hintf{0%,71%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){svg .hint{animation:none}}
button:focus-visible{outline:2px solid var(--sel-line);outline-offset:2px}
/* #ov: full-screen dim backdrop that centers pop-up dialogs (hidden until JS shows it). */
#ov{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
/* #ov>div: the dialog box itself. */
#ov>div{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:20px;max-width:340px;width:100%}
/* Dialog heading and paragraph text. */
#ov h1{margin:0 0 6px;font-size:26px}#ov p{color:var(--mut);margin:0 0 14px}
/* .r: rows of buttons inside dialogs. */
/* (new) Players rows on the New game page: .sdot = the color button (a dot), .sname = the name button; .slots = the 3-letter initials box (3 underlined slots drawn with a repeating gradient; widths are in ch/em so the slots line up with the letters). .pcol = one color in the color picker. */
.sdot{min-width:44px;padding:0 10px}.sdot i{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
.sname{min-width:84px}
.slots{font:700 26px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5em;width:calc(3 * (1ch + .5em));flex:none;padding:0 0 4px;border:0;border-radius:0;background:linear-gradient(90deg,var(--ink) 0 1ch,transparent 0) 0 100%/calc(1ch + .5em) 3px repeat-x;color:var(--ink);text-transform:uppercase;outline:none;text-align:left;box-sizing:content-box}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pgrid button{display:flex;gap:8px;justify-content:flex-start}.pgrid i{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
#ov .r{display:flex;gap:8px}#ov .r button{flex:1;font-weight:500}#ov .r button#ngplay{font-weight:600}
#ov button{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
/* (new) .pop: a dialog opening grows vertically from its middle (scaleY 0 to 1) while fading in. Added by ov() only when the dialog was not already open. */
#ov>div.pop{transform-origin:50% 50%;animation:ovpop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes ovpop{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}

PLAYER TEXT: the words on the How to play page and in the tutorial lessons. Edit them here; the game reads them as they are.
How it works:
- A line that starts and ends with === begins a section. Keep those lines as they are, except the name after the colon, which you may change
  (after "TUTORIAL:" it is the page heading; after "LESSON N:" it is the lesson's name on the Tutorial page and its heading).
- Every other line is one paragraph. In a lesson, each paragraph is one page of the tutorial panel (Back / Next). Empty lines are skipped. Lines up here, before the first section, are never shown.
- LESSON COMPLETE is the page after every lesson's last paragraph (the page with the lesson buttons).
- ADVANCED is a heading on the Tutorial page's list of lessons: it shows above the lesson whose section comes right after it, with its paragraphs under it.
  Move the section to move the heading.
- The two TUT marker lines (slash-star TUT...) around the tutorial sections mean only the preview has them (the live publish cuts them out). Keep them.
- Plain text only: no HTML. Any characters work, except the word made of < / script >, which would end this block.
- The lessons are checked by tools/lesson_tests.py (it finds each lesson by its section, not by the words), and the steps must still
  match what each lesson's position lets the player do. The positions are in docs/scenarios/lesson-*.txt.

=== HOW TO PLAY ===
To place a new Star, tap one of your Stars, then tap where the new Star goes. Or drag from your Star and let go there.
Hold while dragging, or hold newly placed Stars, for precise positioning.
Crossing grid lines costs 1 Fuel each. Crossing diagonally counts as 2 grid lines.
Place Fleets on Stars connected to your Capital to make them stronger.
You can move your Fleets along your Connections.
Stronger Stars can capture weaker Stars.
Watch out! After each round, the lowest score that is more than 3 points behind the next score above it is eliminated.
Each Sector you control gives you 1 point. The center Sector gives you 3 points.
Each full row or column of Sectors you control gives you 1 bonus point.


</script>

// Free placement lets a star go anywhere legal in a system. Fixed positions offer 25 set spots instead, so a player (or the computer) picks from a short list. The spots are the points of a 5 by 5 lattice that spans the WHOLE legal range of a star's center (from MARG in from one border to MARG in from the other), so the corner spot S1 is exactly where the closest free placement to that corner can be. In tic-tac-toe terms: Space = the 9 cell centers (S1-S9), Line = the 12 midpoints of the grid lines (L1-L12), Vertex = the 4 line crossings (V1-V4); all numbered left to right, top to bottom. Lattice index i (across) and j (down) run 1 to 5, evenly spaced from the near legal limit (1) to the far one (5): Space = both odd, Vertex = both even, Line = one of each. (Line spots are the midpoints between neighboring Spaces; Vertices are the centers of four Spaces.)

const FX=(()=>{const out=[];let s=0,l=0,v=0;for(let j=1;j<=5;j++)for(let i=1;i<=5;i++){const a=i%2,b=j%2;if(a&&b)out.push({t:'S',n:++s,i,j});else if(!a&&!b)out.push({t:'V',n:++v,i,j});else out.push({t:'L',n:++l,i,j})}out.forEach(q=>q.k=q.t+q.n);return out})();
// fxPos(cx,cy,q) = the board position of spot q inside system (cx,cy).
const fxPos=(cx,cy,q)=>({x:cx+MARG+(1-2*MARG)*(q.i-1)/4,y:cy+MARG+(1-2*MARG)*(q.j-1)/4});
// fxOK(a,p) = can a new star at p be connected from star a? It must clear every star and connection (spotErr) and the new line must clear every other star (clear).
const fxOK=(a,p)=>!spotErr(p)&&clear(a,p);
// fxLegal(a,cx,cy) = the spots of system (cx,cy) that are legal right now, as a list of FX entries.
const fxLegal=(a,cx,cy)=>FX.filter(q=>fxOK(a,fxPos(cx,cy,q)));
// fxSys(cx,cy) = the system's name: sector letter+number, then system letter+number inside the sector, e.g. 'A1 · a1' (first system) or 'G7 · c3' (last system on the standard board). fxName adds the spot: 'G7 · c3 · L12'.
const fxSys=(cx,cy)=>String.fromCharCode(65+Math.floor(cx/3))+(Math.floor(cy/3)+1)+' · '+'abc'[cx%3]+(cy%3+1);
const fxName=(cx,cy,q)=>fxSys(cx,cy)+' · '+q.k;
// fixOn = this device's choice (Game menu page) to use fixed positions when the game allows both; fxLabels = show the S/L/V labels in the precision placement menu (hidden until you turn them on; not remembered).
let fixOn=false,fxLabels=false;try{fixOn=localStorage.getItem('constellate-fixed')==='1'}catch(e){}
// useFixed() = should a new star be placed with the precision placement menu right now (on a tap, and on a drag's drop)? A game can force it (G.pm 'fixed'), forbid it (G.pm 'free'), or leave it to the player (no G.pm).
const useFixed=()=>!!G&&!cpuRun&&(G.pm=='fixed'||(G.pm!='free'&&fixOn));
// placeLabel() = text of the Game page toggle; placeToggle(b) flips it (when the game leaves it to the player).
const placeLabel=()=>G&&G.pm=='free'?'Placement: Free (game rule)':G&&G.pm=='fixed'?'Placement: Fixed (game rule)':'Placement: '+(fixOn?'Fixed positions':'Free');
function placeToggle(b){if(G&&G.pm)return;fixOn=!fixOn;try{localStorage.setItem('constellate-fixed',fixOn?'1':'0')}catch(e){}b.textContent=placeLabel()}
// (changed, drag and drop) fx = the precision placement menu's state (until build 2026-10-27-f the fixed-positions placement window): a = origin star id, cx,cy = target system, c = Fuel cost, mv = the Star being moved instead of a new one (null, {k:'pv', i: Star preview id} or {k:'st', id: a Star set this turn}), tab = F (Free) or S/L/V, pick = chosen fixed spot label or null, fp = chosen free point {x,y} or null. (2026-10-27-g) There is ONE choice: picking a fixed spot clears fp and placing a free point clears pick, and the choice stays on show (and is what Confirm places) whichever panel is open.
let fx=null;
// plFree() / plFix() = this game allows free placement / fixed positions (G.pm 'free' or 'fixed' allows only that one; no G.pm leaves it to each player, so both are allowed).
const plFree=()=>!!G&&G.pm!='fixed',plFix=()=>!!G&&G.pm!='free';
// fxOpen(a,cx,cy,c,o) opens the precision placement menu for an empty system, but only when at least one spot is legal (otherwise it says why and nothing opens). Panels: Free (anywhere legal: tap or drag inside the window) unless the game is fixed positions only, then Space / Line / Vertex unless it is free placement only. It starts on Space when this placement uses fixed positions (useFixed), otherwise on Free. o = {mv: the Star being moved (see fx), fp: a free point to start with, e.g. where a drag paused}.
function fxOpen(a,cx,cy,c,o){o=o||{};const m=o.mv||null,fr=plFree()&&exRun(m,()=>roomIn(cx,cy,a)),fi=plFix()&&exRun(m,()=>fxLegal(a,cx,cy).length>0);
if(!fr&&!fi)return say('No room for a Star in this system.');
fx={a:a.id,cx,cy,c,mv:m,tab:fi&&(useFixed()||!fr)?'S':'F',pick:null,fp:null};if(o.fp&&fr&&exRun(m,()=>fxOKp(o.fp)))fx.fp={x:o.fp.x,y:o.fp.y};fxDraw()}
function fxTab(t){if(fx){fx.tab=t;fxDraw()}}
// fxPick(k) chooses fixed spot k (the free point is dropped); tapping the spot already chosen confirms it.
function fxPick(k){if(!fx)return;if(fx.pick==k&&!fx.fp)return fxConfirm();fx.pick=k;fx.fp=null;fxDraw()}
function fxLabelsToggle(){fxLabels=!fxLabels;if(fx)fxDraw()}
function fxCancel(){fx=null;fxPd=null;$('ov').style.display='none';say('')}
// fxOKp(p) = a Star from the menu's origin may go at point p (clear of Stars and Connections, its line clear). fxCur() = the chosen point (free point or fixed spot) or null. Call these inside exRun(fx.mv, ...), so a Star being moved does not block itself.
const fxOKp=p=>!spotErr(p)&&clear(by(fx?fx.a:-1)||{x:p.x,y:p.y},p);
function fxCur(){if(fx.fp)return fx.fp;const q=fx.pick&&FX.find(z=>z.k==fx.pick);return q?fxPos(fx.cx,fx.cy,q):null}
// fxSel() = the chosen position as {p: board point, nm: its name}, or null while nothing legal is chosen. fxStat() = the line of text under the window. fxDyn() = the chosen Star and its dashed line (grey and dashed where blocked); on a fixed panel the Star itself confirms when tapped. Call these inside exRun(fx.mv, ...).
function fxSel(){const p=fxCur();if(!p||!fxOKp(p))return null;const q=!fx.fp&&FX.find(z=>z.k==fx.pick);return {p,nm:q?fxName(fx.cx,fx.cy,q):fxSys(fx.cx,fx.cy)}}
function fxStat(){const p=fxCur();if(!p)return fx.tab=='F'?'Tap or drag inside the system to place the Star.':'Tap a blue dot to choose a position. Grey rings are blocked.';
if(!fxOKp(p))return (spotErr(p)||'The line passes too close to another Star.')+' Try another spot.';const q=!fx.fp&&FX.find(z=>z.k==fx.pick);return 'Selected: '+(q?fxName(fx.cx,fx.cy,q):'free position in '+fxSys(fx.cx,fx.cy))+'. Tap the Star or Confirm.'}
function fxDyn(){const a=by(fx.a),pp=fxCur();if(!a||!pp)return '';const ok=fxOKp(pp),col=ok?COL[cur()]:'#8a97a3';
return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+pp.x+'" y2="'+pp.y+'" stroke="'+col+'" stroke-width="'+LINE_W+'" stroke-dasharray=".08 .06" stroke-linecap="round"/><circle cx="'+pp.x+'" cy="'+pp.y+'" r="'+R_STAR+'" fill="'+col+'" fill-opacity=".6" stroke="'+col+'" stroke-width="'+R_STROKE+'"'+(ok?'':' stroke-dasharray=".04 .03"')+(ok&&fx.tab!='F'?' style="cursor:pointer" onclick="fxConfirm()"':'')+'/>'}
// fxSvg() draws the zoomed-in window: the system, the tic-tac-toe reference lines, nearby connections and Stars, the chosen Star (#fxdyn, fxDyn), then on the fixed panels the spots of the chosen tab (blue = legal, grey ring = blocked). On the Free panel the window takes presses (fxFreeDn).
function fxSvg(){const cx=fx.cx,cy=fx.cy,pad=.04,vx=cx-pad,vy=cy-pad,vw=1+2*pad,zw=1-2*MARG,F=fx.tab=='F';
// The black square is the system border. The thin red lines are the tic-tac-toe guide between the Spaces (halfway between neighboring Space columns and rows).
let h='<svg id="fxsv" viewBox="'+vx+' '+vy+' '+vw+' '+vw+'" style="width:100%;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px"'+(F?' onpointerdown="fxFreeDn(event)" onpointermove="fxFreeMv(event)" onpointerup="fxFreeUp(event)" onpointercancel="fxFreeUp(event)"':'')+'>';
h+='<rect x="'+cx+'" y="'+cy+'" width="1" height="1" fill="none" stroke="var(--ink)" stroke-width=".012"/>';
[2,4].forEach(i=>{const x=cx+MARG+zw*(i-1)/4,y=cy+MARG+zw*(i-1)/4;h+='<line x1="'+x+'" y1="'+cy+'" x2="'+x+'" y2="'+(cy+1)+'" stroke="#e53e3e" stroke-opacity=".6" stroke-width=".008"/><line x1="'+cx+'" y1="'+y+'" x2="'+(cx+1)+'" y2="'+y+'" stroke="#e53e3e" stroke-opacity=".6" stroke-width=".008"/>'});
const inView=(x0,y0,x1,y1)=>Math.max(x0,x1)>=vx&&Math.min(x0,x1)<=vx+vw&&Math.max(y0,y1)>=vy&&Math.min(y0,y1)<=vy+vw;
G.conns.forEach(q=>{const s1=by(q[0]),s2=by(q[1]);if(!s1||!s2||!inView(s1.x,s1.y,s2.x,s2.y))return;h+='<line x1="'+s1.x+'" y1="'+s1.y+'" x2="'+s2.x+'" y2="'+s2.y+'" stroke="'+COL[s1.o]+'" stroke-opacity=".6" stroke-width="'+LINE_W+'" stroke-linecap="round"/>'});
G.stars.forEach(t=>{if(inView(t.x-.25,t.y-.25,t.x+.25,t.y+.25))h+='<circle cx="'+t.x+'" cy="'+t.y+'" r="'+outerR(t)+'" fill="'+COL[t.o]+'" fill-opacity=".45" stroke="'+COL[t.o]+'" stroke-width=".01"/>'});
h+='<g id="fxdyn">'+fxDyn()+'</g>';
const a=by(fx.a);if(!F)FX.filter(q=>q.t==fx.tab).forEach(q=>{const p=fxPos(cx,cy,q),ok=fxOK(a,p),sel=q.k==fx.pick&&!fx.fp;
if(ok)h+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(sel?.05:.04)+'" fill="'+(sel?'#fff':'#3bb4ff')+'" stroke="'+(sel?COL[cur()]:'#fff')+'" stroke-width=".012"/><circle cx="'+p.x+'" cy="'+p.y+'" r=".06" fill="transparent" style="cursor:pointer" onclick="fxPick(\''+q.k+'\')"/>';
else h+='<circle cx="'+p.x+'" cy="'+p.y+'" r=".03" fill="none" stroke="#8a97a3" stroke-opacity=".7" stroke-width=".008"/>';
if(fxLabels)h+='<text x="'+(p.x+.05)+'" y="'+(p.y-.035)+'" font-size=".042" font-weight="700" fill="var(--ink)" stroke="var(--bg)" stroke-width=".012" paint-order="stroke" pointer-events="none">'+q.k+'</text>'});
return h+'</svg>'}
// fxDraw() builds the menu: title, the panels this game allows (Free; Space / Line / Vertex with how many spots are legal), the window, what is selected, then Confirm, the label toggle (fixed panels) and Cancel. (2026-10-29-i, Shmorden) The line under the window always keeps room for two lines of text (#fxst), so a selection or message that wraps to a second line never moves the buttons or resizes the menu. The text is built with the moved Star off the board (exRun), and shown after.
function fxDraw(){const h=exRun(fx.mv,()=>{const a=by(fx.a),cnt=t=>FX.filter(q=>q.t==t&&fxOK(a,fxPos(fx.cx,fx.cy,q))).length,tabs=[];if(plFree())tabs.push(['F','Free']);if(plFix())tabs.push(['S','Space ('+cnt('S')+')'],['L','Line ('+cnt('L')+')'],['V','Vertex ('+cnt('V')+')']);
return '<h1>Precision placement</h1><p style="margin:0 0 8px">'+fxSys(fx.cx,fx.cy)+' · costs '+fx.c+' Fuel'+(fx.mv?' · moving a Star':'')+'</p>'+tabBar(tabs,fx.tab,'fxTab')+'<div style="margin:8px 0">'+fxSvg()+'</div><p id="fxst" style="margin:0 0 8px;line-height:1.3;min-height:2.6em;color:var(--mut)">'+fxStat()+'</p><div class="r"><button id="fxok" onclick="fxConfirm()"'+(fxSel()?'':' disabled')+'>Confirm</button>'+(fx.tab!='F'?'<button onclick="fxLabelsToggle()">Labels: '+(fxLabels?'Shown':'Hidden')+'</button>':'')+'</div><div class="r" style="margin-top:8px"><button onclick="fxCancel()">Cancel</button></div>'});ov(h)}
// (new) The Free panel. A press away from the chosen Star puts it at the nearest legal point to the finger (fxNear); a press on it and a drag slides it (fxSlide), and it stops against the padding of a Star or Connection instead of crossing it; a press on it and a lift without moving confirms (Shmorden, 2026-10-27). fxPt(ev) = the board point under the finger, kept inside the area a Star's center can use. fxPd = the press: {x,y: where, on: it was on the chosen Star, mv: it has moved}. Only the Star, the text and Confirm are refreshed (fxFresh), so the window keeps hold of the finger.
let fxPd=null;
function fxPt(ev){const r=$('fxsv').getBoundingClientRect(),pad=.04,vw=1+2*pad,x=fx.cx-pad+(ev.clientX-r.left)/r.width*vw,y=fx.cy-pad+(ev.clientY-r.top)/r.height*vw;return{x:Math.min(fx.cx+1-MARG,Math.max(fx.cx+MARG,x)),y:Math.min(fx.cy+1-MARG,Math.max(fx.cy+MARG,y))}}
function fxFreeDn(ev){if(!fx||fx.tab!='F')return;try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}const q=fxPt(ev),c=exRun(fx.mv,fxCur);fxPd={x:q.x,y:q.y,on:!!c&&Math.hypot(q.x-c.x,q.y-c.y)<=R_STAR+.06,mv:false};if(!fxPd.on){fx.pick=null;fx.fp=exRun(fx.mv,()=>fxNear(q));fxFresh()}}
function fxFreeMv(ev){if(!fx||!fxPd)return;const q=fxPt(ev);if(!fxPd.mv&&Math.hypot(q.x-fxPd.x,q.y-fxPd.y)<.03)return;fxPd.mv=true;exRun(fx.mv,()=>{const c=fxCur()||q;fx.pick=null;fx.fp=fxSlide(c,q)});fxFresh()}
function fxFreeUp(ev){const p=fxPd;fxPd=null;if(fx&&p&&p.on&&!p.mv&&ev&&ev.type=='pointerup'&&exRun(fx.mv,fxSel))fxConfirm()}
// fxNear(q) = q when a Star may go there, otherwise the nearest legal point on a 33 by 33 grid of the usable area (q itself, shown blocked, when there is none). fxSlide(c,q) = where a Star at c dragged toward q ends up: it moves in small steps and stops at the last legal one; it also tries sliding along each axis, and keeps whichever ends nearest q. From a blocked point it simply goes to q.
function fxNear(q){if(fxOKp(q))return q;let b=null,bd=1e9;const z=1-2*MARG;for(let i=0;i<=32;i++)for(let j=0;j<=32;j++){const p={x:fx.cx+MARG+z*i/32,y:fx.cy+MARG+z*j/32},d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd&&fxOKp(p)){bd=d;b=p}}return b||q}
function fxSlide(c,q){if(!fxOKp(c))return {x:q.x,y:q.y};const walk=(s,t)=>{const n=Math.max(1,Math.ceil(Math.hypot(t.x-s.x,t.y-s.y)/.005));let l=s;for(let i=1;i<=n;i++){const p={x:s.x+(t.x-s.x)*i/n,y:s.y+(t.y-s.y)*i/n};if(!fxOKp(p))break;l=p}return l};
const d=walk(c,q),ax=walk(d,{x:q.x,y:d.y}),ay=walk(ax,{x:ax.x,y:q.y}),by2=walk(d,{x:d.x,y:q.y}),bx=walk(by2,{x:q.x,y:by2.y});return [d,ay,bx].sort((u,v)=>Math.hypot(u.x-q.x,u.y-q.y)-Math.hypot(v.x-q.x,v.y-q.y))[0]}
function fxFresh(){exRun(fx.mv,()=>{$('fxdyn').innerHTML=fxDyn();$('fxst').textContent=fxStat();$('fxok').disabled=!fxSel()})}
// fxConfirm() makes the move exactly like free placement does (undo snapshot, new star, connection, Fuel spent, eliminations, redraw), or a Star preview with Move preview on. (new) A menu opened for a Star being moved moves it instead (stMove).
function fxConfirm(){if(!fx)return;const a=by(fx.a),sl=a&&exRun(fx.mv,fxSel);if(!sl){fx.pick=null;fx.fp=null;return fxDraw()}
$('ov').style.display='none';const f=fx,p=sl.p,nm=sl.nm,c=f.c;fx=null;fxPd=null;if(f.mv)return stMove(f.mv,a,p,c,nm);
if(pvOn())return pvStar(a,p,c,'Preview: Star at '+nm+' for '+c+' Fuel. Confirm or Cancel, or pick another Star.');
starSet(a,p,c,'Star set at '+nm)}
// ===== Fleet ask: the Fleets that go along with a move =====
// (new) Shmorden's request 2026-10-27; (2026-10-29-f) a setting in the Game section (setSecs). FASK = what happens to the Fleets on a Star that makes a move: 'ask' (the default) asks every time; 'all' sends every Fleet that can go; 'min' is the same as all, except that an attack commits only the Fleets it needs to win. It covers Setting a Star (Fleets on the origin that can still move go to the new Star, as a Fleet move along the new line: RULES.md 5.2 and 5.5, so no rule changes), Taking a Star (the Fleets committed, 4.10), and the attackers of a multi-attack ('min': as few Fleets in total as the attack needs, from the attackers in the order they were added). Making a Connection leaves Fleets where they are. Remembered on this device. Computers never use it.
const FAKEY='constellate-fleetask';let FASK='ask';try{const v=localStorage.getItem(FAKEY);if(v=='all'||v=='min')FASK=v}catch(e){}
const faLabel=()=>'Fleet ask: '+(FASK=='all'?'All':FASK=='min'?'Min':'Ask');
function faCycle(b){FASK=FASK=='ask'?'all':FASK=='all'?'min':'ask';try{localStorage.setItem(FAKEY,FASK)}catch(e){}if(b)b.textContent=faLabel()}
// fwAuto(a) = how many Fleets go with a Star set from a without asking: every Fleet that can still move ('all' and 'min'), none with 'ask'.
// (fixed 2026-10-27-k) fask() = the Fleet ask setting for the player moving now: a computer (cpuOf, or cpuRun while it plays) always gets 'cpu', which means none of this: no question, no Fleets sent along, and its own Fleet choices in attacks, exactly as before Fleet ask existed.
const fask=()=>cpuRun||(G&&cpuOf(cur()))?'cpu':FASK,faAuto=()=>fask()=='all'||fask()=='min';
const fwAuto=a=>faAuto()?fFree(a):0;
// fwMove(a,n,k,u) moves k Fleets from Star a to Star n (just set from it, so one Connection away) as a Fleet move: they count as moved this turn, and the move log gets a Fleet move record. u = the Undo entry of the Star's setting when both happen in one step: marked m2, so one Undo takes back both log records.
function fwMove(a,n,k,u){const b=JSON.parse(JSON.stringify(G));a.f-=k;n.f=(n.f||0)+k;n.fm=(n.fm||0)+k;mvRec({k:'f',a:mvPos(a),b:mvPos(n),n:k},b);if(u)u.m2=1}
// starSet(a,p,c,txt) sets a new Star at p from Star a for c Fuel, as every placement did before (one Undo entry, the Connection, both Stars used, Fuel paid, remembered as set this turn, logged), with the Fleets that go along (fwAuto) moving in the same step. With 'ask' and Fleets on a that can still move, it then asks how many go (fwAsk). txt = the start of the message.
function starSet(a,p,c,txt){const u=new String(JSON.stringify(G));undo.push(u);const n={id:G.nid++,x:p.x,y:p.y,o:cur()};G.stars.push(n);G.conns.push([a.id,n.id]);G.used.push(a.id,n.id);G.ap-=c;nwAdd(n,a);sel=null;mvRec({k:'s',a:mvPos(a),b:mvPos(p),c});
const k=fwAuto(a);if(k>0)fwMove(a,n,k,u);const m=elim();say(txt+' for '+c+' Fuel.'+(k>0?' '+k+' Fleet'+(k>1?'s':'')+' moved with it.':'')+m);render();if(fask()=='ask'&&fFree(a)>0&&!G.over)fwAsk(a.id,n.id,null)}
// pvStar(a,p,c,msg) makes a Star preview (Move preview on) carrying fl = the Fleets that go along when it is confirmed (fwAuto now; with 'ask' and Fleets that can move, fwAsk asks first).
function pvStar(a,p,c,msg){const k=fwAuto(a),q={k:'s',a:a.id,x:p.x,y:p.y,c};if(k)q.fl=k;pvAdd(q,msg+(k?' '+k+' Fleet'+(k>1?'s':'')+' will go with it.':''));if(fask()=='ask'&&fFree(a)>0)fwAsk(a.id,null,q.i)}
// fwAsk(aid,nid,pi) asks how many of Star aid's Fleets go with the Star just set from it: nid = that Star (they move at once, fwGo), or pi = the Star preview (the number is kept on it as fl, and they move when it is confirmed).
function fwAsk(aid,nid,pi){const a=by(aid),f=a?fFree(a):0;if(f<1)return;const q=pi!=null&&(G.pv||[]).find(z=>z.i==pi);ovQ(`<h1>Move Fleets with the new Star?</h1><p>This Star has ${f} Fleet${f>1?'s':''} that can move. Fleets that go count as moved this turn.</p><div class="r" style="flex-wrap:wrap">${[...Array(f+1)].map((_,i)=>`<button onclick="fwGo(${aid},${nid},${pi},${i})">${i?i:'None'}</button>`).join('')}</div>`,[a,nid!=null?nid:q])}
function fwGo(aid,nid,pi,k){$('ov').style.display='none';if(pi!=null){const q=(G.pv||[]).find(z=>z.i==pi);if(q){if(k)q.fl=k;else delete q.fl;say(k?k+' Fleet'+(k>1?'s':'')+' will go with the Star when it is confirmed.':'The Fleets stay.')}return render()}
const a=by(aid),n=by(nid);if(k>0&&a&&n&&fFree(a)>=k){undo.push(JSON.stringify(G));fwMove(a,n,k,null);say(k+' Fleet'+(k>1?'s':'')+' moved with the Star.')}render()}
// mcMin() ('min') spreads as few Fleets as the multi-attack needs over its attackers, in the order they were added; while even every Fleet is not enough, every Fleet is used.
function mcMin(){if(!multi||multi.t==null)return;let need=str(by(multi.t))+1-multi.att.reduce((t,x)=>t+cs(by(x.id)),0);multi.att.forEach(x=>{const f=by(x.id).f||0,u=Math.max(0,Math.min(f,need));x.use=u;need-=u})}
// ===== Drag and drop =====
// (new) Shmorden's request 2026-10-27, asked for by many testers; refined in build 2026-10-27-g. Press one of your Stars that has not acted and move (Instant, the default), or hold it for HOLD.drag seconds, and a new Star comes out of it on your finger: a Star and dashed line in the move-preview style, with a white crosshair (a tight dashed ring round the Star and a cross as thick as the range border) so it can be seen under the finger. The cross turns dashed where the Star can't go (a system with a Star it can't act on, too close to a Star or Connection, the line blocked). Past the Fuel range the Star stops at the edge of the range and shows as an X in the Fuel color. The Fuel gauge and the range outline follow the drag. Over an enemy Star, one of your own or a teammate's, the Star snaps to it and letting go takes, connects or offers Connect / Gift exactly like tapping it would (the attack line stays on show while the Fleets for it are chosen). Letting go in an empty system places the Star there (a dashed preview with Move preview on); anywhere else nothing happens.
// Holding still over a system that has room for HOLD.prec seconds opens the precision placement menu there: for the last HOLD.ring seconds the crosshair doubles in size and a ring goes round it from the top. A placement with fixed positions opens the menu on every drop. Stars set this turn (G.nw) and Star previews can be pressed and dragged the same way to move them, inside their system or, as the Fuel allows, to another one (the Fuel is worked out again from the origin). With a Star selected, holding an empty system in its Fuel range opens the menu too (same crosshair and ring, at the finger). Your Fleets can be dragged by their badge too: they snap to the Stars they can reach, and letting go moves them (asking how many when more could go than the distance needs).

// ===== (new) Computer players =====
// MAP of the CPU code (search for these names): cpuStep = one action of the computer's turn (place a Fleet, move a Fleet, make a move) | cpuCands = list the candidate moves and score each | cpuChoose = pick one | cpuDo / cpuMultiDo = play it through the normal tap code | cpuPlace2, cpuFleetMove2 = Fleets | cpuDefend (cpuPick) = Hold/Retreat answers | SCORING: cpuInc + incAdd + incPot2 (fast tally, see "Fast scoring" below) are what cpuCands/cpuCaps/cpuLoss use; cpuPot / cpuPot2 / cpuPotL are the slow full-board originals, kept only as the reference the harness checks the fast tally against | EVALUATOR (step 4): CPU_PARAMS = the one table of tunable values (per level), cpuP / cpuSet / cpuReset = read / change / reset them, cpuDlg = the CPU settings page generated from the table (step 8; Settings > CPU Designer and Menu > Dev), cpuGameSync = records the values in the game (G.cpuV) so saves replay the same, Custom = level 6, incEval = the position value built from them (own points, opponent point loss, leader focus, contest margins, rows, elimination risk) | TURN CACHE + PLANNER (step 5): cclear / cpuStrTab = remembered geometry and strengths; cpuPlanStep (cpuPlanMake, cpuPlanRoll, cpuPlanGen, cpuPlanApply, cpuPlanLeaf, cpuPlanOK) = plans a whole turn on a copy of the board, used by the levels in cpuPlanLv | cpuFleetLv / cpuFleetPlanOn, cpuPlanPlace (placement), the 'fmove' and 'ftake' moves in cpuPlanGen = Fleets planned inside the turn (step 6, test level 5 only, see cpuPlanCfg) | cpuFeat / cpuFeat3 = switches for the Medium / Hard ideas | cpuDangerCheck = near deficit elimination.
// A computer player is a color listed in G.cpu (color -> level; level 1 = Easy). It plays through the game's own move code (tap, placeF, resolve, ...), so it can only do what a person could do, and it must obey the same End-turn rule (all Fleets placed, all Fuel used while a move exists). It runs on this device in a local game, and on the host's device in an online game. cpuOf(c) = is color c a computer; cpuHere(c) = does THIS device run it.
const cpuOf=c=>!!(G&&G.cpu&&G.cpu[c]);
// allCpu() = every player still in the game is a computer.
const allCpu=()=>!!G&&!!G.cpu&&G.pl.filter(c=>G.alive[c]).every(c=>G.cpu[c]);
const cpuHere=c=>cpuOf(c)&&(!net.on||net.role=='host');
// (CPUs and teams, 2026-10-30) cpuTgt(o,me) = a star owned by o is one computer me may attack: not its own and not a LIVING teammate's (a dead teammate's leftover Stars may be captured, RULES.md 9.4). Who can take the computer's Stars is isFoe (living players on another team). Every 'enemy star' test in the CPU code uses one of the two, so a computer never targets a teammate and never guards against one. With teams off they are exactly the old tests (o!=me; o!=me and alive), so games without teams play the same.
const cpuTgt=(o,me)=>o!=me&&!isAlly(o,me);
// (CPUs and teams, step 2, 2026-10-30) cpuTeamCfg = the team values (placeholders, not tuned): mate = how much a teammate's Victory Point is worth to me, as a share of my own (round 30 is won on combined team VP, so a claim that breaks a teammate's sector costs the team; less than 1 because turn order, Fleets and Deficit Elimination use individual VP); endWin / endTeam = bonus for taking the last Star of an enemy who is the last living player of their team, when that ends the game / when other teams are still left; sup = strength a living teammate's Star within 2.3 adds to my new Star or capture (the teammate can Connect to it). Nothing here is read in a game without teams.
const cpuTeamCfg={mate:.8,endWin:40,endTeam:12,sup:1};
// cpuEndCore(o,left) = (team games) the bonus for leaving enemy o with `left` Stars: 0 unless left is 0 (o is eliminated) and o is the last living player of its team (the team is out, RULES.md 9.2); endWin when that leaves one side (the game is won), else endTeam. A player whose teammate is still alive gets no bonus: their linked Stars pass to that teammate (9.7). cpuEndB(o) = the same for one capture on the real board.
function cpuEndCore(o,left){if(!teamsOn()||left>0||!G.alive[o]||G.pl.some(c=>c!=o&&G.alive[c]&&sameTeam(c,o)))return 0;return sidesLeft()-1<2?cpuTeamCfg.endWin:cpuTeamCfg.endTeam}
const cpuEndB=o=>teamsOn()?cpuEndCore(o,G.stars.filter(q=>q.o==o).length-1):0;
// cpuMs = pause between the computer's moves (so you can follow them); 700 normal, 250 fast, 0 instant. cpuRun = true while the computer is making a move (it lets its moves through the "computer is playing" lock). cpuTimer = the pending next-move timer. cpuTimers = false turns the timer off (tests drive the computer by hand). cpuSeed = a number makes its randomness repeatable (tests); null = real randomness. cpuErr = the last error the computer hit (it never stops the game; after a few failures it just ends its turn; tests check it stays empty). cpuBad = moves that failed this turn, so they are not retried; cpuTurn = which turn cpuBad belongs to; cpuStall = consecutive failures.
let cpuErr=null,cpuMs=700,cpuRun=false,cpuTimer=null,cpuTimers=true,cpuSeed=null,cpuBad=new Set(),cpuTurn='',cpuStall=0;try{const v=localStorage.getItem('constellate-cpums');if(v!==null&&!isNaN(+v))cpuMs=+v}catch(e){}
const cpuR=()=>cpuSeed==null?Math.random():((cpuSeed=(cpuSeed*1664525+1013904223)>>>0)/4294967296);
// cpuSpeedLabel() / cpuSpeedCycle(b) = the Game menu button that changes the pause.
const cpuSpeedLabel=()=>'CPU speed: '+(cpuMs>=500?'Normal':cpuMs>0?'Fast':'Instant');
function cpuSpeedCycle(b){cpuMs=cpuMs>=500?250:cpuMs>0?0:700;try{localStorage.setItem('constellate-cpums',String(cpuMs))}catch(e){}b.textContent=cpuSpeedLabel()}
// (reference only: the game now uses the fast incPot1/incPot2; the harness checks them against this) cpuPot(S,me) = how good board S is for color me: 10 per Victory Point plus a small reward for leading in a sector (my stars minus the best opponent's, capped), so a move toward a majority counts even before it scores. S is a copy of the game with its stars changed (calc needs the whole game).
// cpuPotMate(S,me,vp) = (team games) teammates' points at cpuTeamCfg.mate of my own, 10 per point: the term incEval adds, repeated here so the reference values stay comparable.
const cpuPotMate=(S,me,vp)=>S.team?S.pl.reduce((a,c)=>a+(c!=me&&S.alive[c]&&S.team[c]&&S.team[c]==S.team[me]?cpuTeamCfg.mate*10*vp[c]:0),0):0;
function cpuPot(S,me){const V=calc(S).vp,vp=V[me],cnt={};S.stars.forEach(s=>{const k=Math.floor(s.x/3)+','+Math.floor(s.y/3);(cnt[k]=cnt[k]||[0,0,0,0])[s.o]++});let g=0;Object.values(cnt).forEach(n=>{let o=0;n.forEach((v,c)=>{if(c!=me&&v>o)o=v});g+=.4*Math.max(-2,Math.min(2,n[me]-o))});return vp*10+g+cpuPotMate(S,me,V)}
// ----- Levels. G.cpu[color] is 1 Easy, 2 Medium, 3 Hard (plans whole turns), 4 Hard (legacy, the old move-by-move Hard), 5 Hard+F (test, also plans Fleets), 6 Custom (the player's own saved level, step 8). cpuRaw() = the level number of the computer whose turn it is; cpuLvl() = its STYLE level: the same, except that Custom plays like the built-in level it was based on (1-3), so every 'is it Medium / Hard' check keeps working. Only the values (cpuPar) are Custom's own.
const CPU_LEVELS=['','Easy','Medium','Hard','Hard (legacy)','Hard+F (test)','Custom'],cpuRaw=()=>(G&&G.cpu&&G.cpu[cur()])||1,cpuEff=l=>l==6?cpuBaseNow():l,cpuLvl=()=>cpuEff(cpuRaw());
// cpuDanger = this computer is close to deficit elimination (it is last and 2 or more points behind the next player), so the center sector is worth its full 3 points again; cpuNew = ids of stars it claimed or captured this turn (they support each other).
// cpuFeat = switches for Medium's separate ideas (so each can be measured on its own): center = discount the center sector; rows = reward row/column progress; threat = discount claims and captures the opponent could take back; conn = value connections that lift a threatened star to safety; place = put Fleets on threatened stars; move = move Fleets onto threatened stars; attack = place and move Fleets to enable captures; reach = how many Fuel away an opponent star must be to count as a threat (opponents rarely spend more than a few Fuel on one capture); def = pick the strongest Retreat star. (The random wobble when choosing is the 'noise' row of CPU_PARAMS.)
const cpuFeat={center:1,rows:1,threat:1,conn:1,place:1,move:1,def:1,attack:1,reach:3};
let cpuDanger=false,cpuNew=[];
// (CPUs and teams) In a team game a player is immune to the gap above it when every player in the score level directly ahead is a teammate (RULES.md 9.3), so that is no danger.
function cpuDangerCheck(me){const vp=calc(G).vp,alive=G.pl.filter(c=>G.alive[c]);if(alive.some(c=>c!=me&&vp[c]<vp[me]))return false;const higher=alive.filter(c=>vp[c]>vp[me]).map(c=>vp[c]);if(!higher.length)return false;const up=Math.min(...higher);if(teamsOn()&&alive.every(c=>vp[c]!=up||sameTeam(c,me)))return false;return up-vp[me]>=2}
// cpuOppAp() = the Fuel an opponent will have on their next turn (this round's or next round's, whichever is more).
const cpuOppAp=()=>Math.max(1,Math.min(15,Math.max(acts(G.round),acts(G.round+1))));
// cpuThreatened(pos,tStr,me,ign) = could some live opponent star take a star at pos that has strength tStr, spending no more Fuel than the opponent will have? (ign = a star to leave out, such as the one being captured right now.)
function cpuThreatened(pos,tStr,me,ign){const ap=Math.min(cpuOppAp(),cpuFeat.reach);return G.stars.some(A=>A!==ign&&isFoe(A.o,me)&&cost(A,pos)<=ap&&cStr(A)>tStr)}
// (reference only, see incPot2) cpuPot2(S,me,danger) = Medium's board value for color me: 10 per Victory Point, but the center sector counts as 1 point not 3 (it costs too much to defend) unless danger; a small reward for leading each non-center sector; and progress toward full rows and columns of sectors that no one else has broken into (a rival's open line is subtracted, so blocking it counts).
function cpuPot2(S,me,danger){const {ctl,vp}=calc(S),Z=S.sz||7,mid=(Z-1)/2,cnt={};S.stars.forEach(s=>{const k=Math.floor(s.x/3)+','+Math.floor(s.y/3);(cnt[k]=cnt[k]||[0,0,0,0])[s.o]++});
let v=vp[me]*10+cpuPotMate(S,me,vp);if(cpuFeat.center&&!danger&&ctl[mid][mid]==me)v-=20;
Object.keys(cnt).forEach(k=>{const [x,y]=k.split(',').map(Number);if(cpuFeat.center&&!danger&&x==mid&&y==mid)return;const n=cnt[k];let o=0;n.forEach((c,col)=>{if(col!=me&&c>o)o=c});v+=.4*Math.max(-2,Math.min(2,n[me]-o))});
if(cpuFeat.rows)for(let i=0;i<Z;i++)[ctl[i],ctl.map(r=>r[i])].forEach(L=>{const mn=L.filter(c=>c==me).length,others=new Set(L.filter(c=>c>=0&&c!=me));if(!others.size)v+=9*Math.pow(mn/Z,2);else if(others.size==1&&mn==0){const f=[...others][0];if(S.alive[f]&&!(S.team&&S.team[f]&&S.team[f]==S.team[me]))v-=5*Math.pow(L.filter(c=>c==f).length/Z,2)}});return v}
// cpuPotL(S,me) = the board value for the level playing now.
const cpuPotL=(S,me)=>cpuLvl()>1?cpuPot2(S,me,cpuDanger):cpuPot(S,me);
// ===== Turn cache (CPU project step 5, part 1) =====
// The planner (and the old move search) ask the same geometry and strength questions many times per turn, so they are remembered. cclear(a,b) = clear(a,b) remembered (computed by clearBB, the same test that skips stars outside the line's bounding box; the harness --check compares it with clear): stars never move and are never removed, so a pair's answer can only change when a NEW star appears; the memory is therefore dropped when the star count changes, when the game object is replaced (Undo, online sync, new game) and at the start of every computer turn. cpuTab = strength table: cpuStrTab() counts every star's connections in ONE pass over the connection list; while cpuTab is set, cStr(s) / cCs(s) read it instead of rescanning the list for every call (same numbers as str / cs). cpuTab is only ever set INSIDE a read-only search (cpuCands, cpuPlace2, cpuFleetMove, ...) and is cleared before any move is made and in cpuStep's finally, so it can never be stale.
let cpuGeo={g:null,n:-1,m:new Map()},cpuTab=null;
function clearBB(a,b){const x0=Math.min(a.x,b.x)-.5,x1=Math.max(a.x,b.x)+.5,y0=Math.min(a.y,b.y)-.5,y1=Math.max(a.y,b.y)+.5,S=G.stars;for(let i=0;i<S.length;i++){const s=S[i];if(s===a||s===b||s.x<x0||s.x>x1||s.y<y0||s.y>y1)continue;if(dseg(s,a,b)<outerR(s)+LINE_W/2+PAD)return false}return true}
function cclear(a,b){if(cpuGeo.g!==G||cpuGeo.n!==G.stars.length)cpuGeo={g:G,n:G.stars.length,m:new Map()};const k=a.id<b.id?a.id*65536+b.id:b.id*65536+a.id;let v=cpuGeo.m.get(k);if(v===undefined){v=clearBB(a,b);cpuGeo.m.set(k,v)}return v}
function cpuStrTab(){let mx=0;G.stars.forEach(q=>{if(q.id>mx)mx=q.id});const t=new Int16Array(mx+1);G.conns.forEach(c=>{t[c[0]]++;t[c[1]]++});return t}
const cCs=s=>cpuTab?cpuTab[s.id]:cs(s),cStr=s=>cpuTab?cpuTab[s.id]+(s.f||0):str(s);
// ===== Fast scoring (CPU project step 3) =====
// The slow cpuPot/cpuPot2 above rescan every star for all 49 sectors for EVERY candidate move (and copy the star list). A candidate only ever changes ONE sector (a star appears, or a star changes owner), so the fast version keeps a tally of the board and changes just that sector, reads the value, and puts it back.
// cpuInc(S) builds the tally T for board S: n = stars per sector per color (index (y*Z+x)*4+color), ctl = who controls each sector (-1 nobody), vp = raw Victory Points per color (dead players are zeroed when read), lc = for each of the 2Z lines (rows 0..Z-1, then columns Z..2Z-1) how many of its sectors each color controls, mg = per color the sum over ALL sectors of the margin clamp(my stars - best other, -2, 2) as a whole number, alive = S.alive, pl = the players still in the game.
function cpuInc(S){const Z=S.sz||7,T={Z,mid:(Z-1)/2,alive:S.alive,tm:S.team||null,pl:S.pl.filter(c=>S.alive[c]!==false),n:new Int8Array(Z*Z*4),ctl:new Int8Array(Z*Z).fill(-1),vp:[0,0,0,0],lc:new Int8Array(2*Z*4),mg:[0,0,0,0]};
S.stars.forEach(q=>{T.n[((Math.floor(q.y/3))*Z+Math.floor(q.x/3))*4+q.o]++});
for(let y=0;y<Z;y++)for(let x=0;x<Z;x++){const s=y*Z+x,w=incOwner(T,s);T.ctl[s]=w;if(w>=0){T.vp[w]+=incPts(T,x,y);T.lc[y*4+w]++;T.lc[(Z+x)*4+w]++}for(let k=0;k<4;k++)T.mg[k]+=incMarg(T.n,s*4,k)}
for(let i=0;i<2*T.Z;i++)incLine(T,i,1);return T}
// incOwner(T,s) = the color with MORE THAN HALF of the stars in sector s, or -1 (the same rule calc uses).
function incOwner(T,s){const b=s*4,n=T.n,t=n[b]+n[b+1]+n[b+2]+n[b+3];for(let k=0;k<4;k++)if(n[b+k]*2>t)return k;return -1}
// incPts(T,x,y) = Victory Points a controlled sector is worth: 3 for the center, 1 otherwise.
const incPts=(T,x,y)=>(x==T.mid&&y==T.mid)?3:1;
// incMarg(n,b,k) = the margin of color k in the sector starting at index b: its stars minus the best other color's, kept between -2 and 2.
function incMarg(n,b,k){let o=0;for(let c=0;c<4;c++)if(c!=k&&n[b+c]>o)o=n[b+c];return Math.max(-2,Math.min(2,n[b+k]-o))}
// incLine(T,i,sg) = add (sg=1) or take away (sg=-1) the +1 bonus of line i if one color controls all Z of its sectors.
function incLine(T,i,sg){for(let k=0;k<4;k++)if(T.lc[i*4+k]==T.Z)T.vp[k]+=sg}
// incAdd(T,x,y,c,d) = change the star count of color c in sector (x,y) by d (+1 a star appears, -1 it goes) and fix everything that depends on that sector: its margins, its controller, the points that controller earns, and the full-row / full-column bonuses of its row and column. Calling it again with -d puts everything back exactly.
function incAdd(T,x,y,c,d){const Z=T.Z,s=y*Z+x,b=s*4;
for(let k=0;k<4;k++)T.mg[k]-=incMarg(T.n,b,k);
incLine(T,y,-1);incLine(T,Z+x,-1);
const old=T.ctl[s];if(old>=0){T.vp[old]-=incPts(T,x,y);T.lc[y*4+old]--;T.lc[(Z+x)*4+old]--}
T.n[b+c]+=d;
const w=incOwner(T,s);T.ctl[s]=w;if(w>=0){T.vp[w]+=incPts(T,x,y);T.lc[y*4+w]++;T.lc[(Z+x)*4+w]++}
incLine(T,y,1);incLine(T,Z+x,1);
for(let k=0;k<4;k++)T.mg[k]+=incMarg(T.n,b,k)}
// incStar(T,q,c,d) = incAdd for the sector star q (or a new position {x,y}) sits in.
const incStar=(T,q,c,d)=>incAdd(T,Math.floor(q.x/3),Math.floor(q.y/3),c,d);
// incVp(T,c) = Victory Points of color c (0 if eliminated), exactly what calc(S).vp[c] gives.
const incVp=(T,c)=>T.alive[c]===false?0:T.vp[c];
// ===== Evaluator (CPU project step 4) =====
// CPU_PARAMS = the ONE table of tunable values. One row per value: k = key, g = group, l = label, d = description, min / max / step = the range a settings page may offer, v = default per level [Easy, Medium, Hard (planner + the step 4 terms on), Hard (legacy) = the old Hard before step 7, kept for A/B tests; its step 4 terms are off]. A settings page (step 8) is generated from this table. Values are in "points x ownVp" units: with ownVp 10, a Victory Point is 10 and 0.4 is 4% of a point.
const CPU_PARAMS=[
{k:'ownVp',g:'Points',l:'Own point',d:'Value of each Victory Point I would score. Everything else is measured against this.',min:1,max:30,step:1,v:[10,10,10,10]},
{k:'oppVp',g:'Points',l:'Opponent point loss',d:'Value of each Victory Point an opponent would lose. Keep it below Own point: gaining a point is worth more than making a rival lose one.',min:0,max:20,step:.5,v:[0,0,4,0]},

// incEval(T,me,P,danger) = how good the board in tally T is for color me, using the values P (one level's cpuP). It adds up: my points (center discounted unless danger) + my lead per sector + progress on full rows/columns, then (only if those values are on) incRival: opponent points lost, rival leads, elimination risk. With the Easy / Medium / Hard defaults it gives exactly the old cpuPot / cpuPot2 values (the harness checks that).

// incRival(T,me,P,nc) = the part of the value that comes from the opponents (negative when they are doing well). Each opponent's points and sector leads are subtracted, weighted up by Leader focus when that opponent is ahead of me (the center discount applies to them too). Then the elimination risk: if I am in or tied for last place, the gap to the nearest higher score (plus the expected slip) costs elimPen per point beyond elimFrom, spread so that a gap of 4 costs the full elimPen (and more beyond).

function incRival(T,me,P,nc){const ci=T.mid*T.Z+T.mid,vme=incVp(T,me);let v=0,lo=vme,up=1e9;

// incMate(T,c,me) = in a team game, c is on me's team (T.tm = the game's teams, null without teams). (CPUs and teams) A teammate is not a rival: its points, sector leads and open lines are not counted against me (its points count for me instead, see incEval).

// incTake(T,b,me) = the board value for me if star b flipped to me (the star is put back before returning). incClaim(T,x,y,me) = the same if a new star of mine appeared at system position (x,y).

// cpuTeamMoves() = every teamwork move legal for the computer whose turn it is: {t:'tconn', a, b, c} Connect own Star a to teammate Star b for c Fuel; {t:'gift', a, b, c} Gift own Star a to the teammate whose Star b it links to; {t:'fgift', a, b, n} give the n Fleets on a that can still move (n = the whole group; any smaller group is legal too) to teammate Star b. key = the cpuBad key. Empty without teams.
function cpuTeamMoves(){if(!teamsOn())return [];const me=cur(),out=[];for(const a of G.stars){if(a.o!=me)continue;const n=fFree(a);for(const b of G.stars){if(!isAlly(b.o,me))continue;const c=cost(a,b);
if(!tmErr(a,b,'conn'))out.push({t:'tconn',a,b,c,key:'k'+a.id+'_'+b.id});if(!tmErr(a,b,'gift'))out.push({t:'gift',a,b,c,key:'g'+a.id+'_'+b.id});if(n>0&&!fgErr(a,b,n))out.push({t:'fgift',a,b,n,key:'h'+a.id+'_'+b.id+'_'+n})}}return out}
// cpuTeamDo(m) = make teamwork move m (from cpuTeamMoves; an fgift may carry a smaller n). Returns false if nothing changed, and remembers the move in cpuBad so it is not tried again this turn. cpuDo hands these kinds here, so a plan or a candidate list can include them later.
function cpuTeamDo(m){const a=m.a,b=m.b,key=m.key||m.t+a.id+'_'+b.id,before=JSON.stringify([G.ap,G.conns.length,a.o,a.f||0,b.f||0]);mode='s';resetFlow();
if(m.t=='fgift'){flow={src:a.id,n:m.n};fg={a:a.id,t:b.id,n:m.n};fgDo()}else{tm={a:a.id,b:b.id};tmDo(m.t=='gift'?'gift':'conn')}
resetFlow();if(JSON.stringify([G.ap,G.conns.length,a.o,a.f||0,b.f||0])!=before)return true;cpuBad.add(key);return false}
// cpuMateConn() = (CPUs and teams, 2026-10-30) the very last resort of a computer on a team: when every other move is gone but a Connect to a living teammate's Star is still possible, Full Fuel (RULES.md 9.4) says the turn can't end, so it makes the cheapest such Connect (a Gift never: nobody is forced to give a Star away). Computers don't connect to teammates for any other reason yet. Returns false at once without teams.
function cpuMateConn(){let best=null;for(const m of cpuTeamMoves())if(m.t=='tconn'&&!cpuBad.has(m.key)&&(!best||m.c<best.c))best=m;return best?cpuTeamDo(best):false}
function cpuMulti(){const me=cur(),mine=G.stars.filter(q=>q.o==me&&!G.used.includes(q.id));for(const b of G.stars){if(!cpuTgt(b.o,me))continue;const cand=mine.filter(a=>cclear(a,b)&&cost(a,b)<=G.ap);for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++){const x=cand[i],y=cand[j],key='x'+b.id+'_'+x.id+'_'+y.id;if(cpuBad.has(key))continue;if(cost(x,b)+cost(y,b)<=G.ap&&cs(x)+(x.f||0)+cs(y)+(y.f||0)>str(b)){if(cpuMultiDo(b,x,y,key))return true}}}return false}
// ===== Turn planner (CPU project step 5, part 2) =====
// Instead of choosing one move at a time, a planning level builds WHOLE turns on a lightweight copy of the board, scores the board each turn would leave behind, and plays the best one. Every star can act only once per turn (a new or captured star cannot act), so a turn is a set of moves under the Fuel budget; Fuel are a budget here, not a price (cpuP's apCost is not used).
// How a turn is built ("rollout"): repeat { list every move that is legal now; give each a value = how much better the board gets (incEval, same table as step 4) + the old Hard bonuses (Capital, cut-off, buffer, hopeless) with the old "the opponent can simply take it back" discount; pick one by value divided by cost^alpha; apply it to the copy } until the Fuel are gone. alpha = 0 chases the biggest gain, larger alpha prefers cheap moves, so different rollouts spend the same budget in different ways (one big steal versus several cheap gains). Later rollouts add random noise. The turn that leaves the best board wins: its leaf value = incEval of the final board + the move bonuses - a penalty for every own star an opponent could take back (0.7 x what losing it would cost, plus 8 for a Capital).
// What the copy models: claims (a new star in a system, connected to its origin), connections, captures (the target's connections are erased, the cheapest fleet count is committed, defending Fleets retreat to the strongest neighbor they may use (own, or a living teammate's, RULES.md 9.6) or, with no retreat, are forced to Hold and cost attackers), and two-star attacks. It does not model the defender's random Hold choices, or where inside a system a new star lands; the plan is therefore checked move by move (cpuPlanOK) and rebuilt from the real board when something no longer fits. Fleets are NOT planned (step 6): they are placed and moved first, as before, and not moved again while a plan is running.
// cpuPlanLv = levels that plan whole turns (2 = Medium with a handicapped planner: few turns tried, wobble, now and then a long move; 3 = Hard, 5 = the Hard+F test level; 4 = Hard (legacy) does not; the harness --plan adds more). cpuPlanCfg: K = rollouts per plan, ms = time cap per plan in real play (ignored when cpuSeed is set so seeded tests repeat), thr = share of a lost star's value charged for a star an opponent could retake, capPen = extra charge for a Capital, enable = share of a blocked capture's value credited to a connection that unblocks it, look = share of next turn's expected gain (cpuPlanNext) added to a turn's value, maxPlans = plans per turn (then the old move-by-move code finishes the turn), pred = keep the predicted end board for the harness check. cpuPS = counters the harness reads.
const cpuPlanLv=new Set([2,3,5]);
// cpuFleetLv = levels whose plans also place and move Fleets (step 6; 5 = the Hard+F test level). cpuFleetPlanOn() = does the level playing now plan its Fleets?
const cpuFleetLv=new Set([5]);
const cpuFleetPlanOn=()=>cpuPlanOn()&&cpuFleetLv.has(cpuLvl());
// Step 6 values: fPlace = place the Fleet pool inside the plan (cpuPlanPlace), fMove = list free Fleet moves, fmA = weight of the 'a move makes a capture possible' value of a Fleet move (0 = off; 'ftake' covers that case better), fmD = weight of the 'a move protects one star without exposing another' value, ftake = list 'move Fleets, then take' as one move, post = after the plan runs, the old cpuFleetMove still tidies up. All of these only act for the levels in cpuFleetLv.
const cpuPlanCfg={K:14,ms:300,thr:.7,thrLast:.2,capPen:8,enable:.5,look:.5,maxPlans:6,pred:false,fPlace:1,fMove:1,post:1,fmA:0,fmD:1,ftake:1};
let cpuPlan=null,cpuPS={plans:0,rolls:0,ms:0,exec:0,stale:0,failed:0,empty:0,pl:0,fm:0,xp:0,xf:0};
const cpuPlanOn=()=>cpuPlanLv.has(cpuLvl())||cpuPar().planK>0;
const cpuTClone=T=>({Z:T.Z,mid:T.mid,alive:T.alive,tm:T.tm,pl:T.pl,n:T.n.slice(),ctl:T.ctl.slice(),vp:T.vp.slice(),lc:T.lc.slice(),mg:T.mg.slice()});
// cpuPlanInit(me) = the copy of the board a plan starts from: per star (index i, real stars first, new ones appended) x,y, system cx,cy, owner o, Fleets f, Fleets already moved fm, acted-this-turn u, Capital cap, the real star object, and adj = the stars it is connected to; plus Fuel left (ap), the score tally T, the set of occupied systems, the stars touched this turn, and the sum of move bonuses.
function cpuPlanInit(me){const S=G.stars,idx=new Map(),s={me,n:S.length,n0:S.length,id:[],x:[],y:[],cx:[],cy:[],o:[],f:[],fm:[],u:[],cap:[],real:[],adj:[],ap:G.ap,T:cpuInc(G),occ:new Set(),touched:[],bonus:0,pool:0,plc:[]};
S.forEach((q,i)=>{idx.set(q.id,i);s.id.push(q.id);s.x.push(q.x);s.y.push(q.y);s.cx.push(Math.floor(q.x));s.cy.push(Math.floor(q.y));s.o.push(q.o);s.f.push(q.f||0);s.fm.push(q.fm||0);s.u.push(G.used.includes(q.id)?1:0);s.cap.push(q.cap?1:0);s.real.push(q);s.adj.push([]);s.occ.add(Math.floor(q.x)+','+Math.floor(q.y))});

if(cpuFleetPlanOn()&&G.pool>0){s.pool=G.pool;s.plc=placeable().map(q=>idx.get(q.id))}return s}
function cpuPlanClone(s){return {me:s.me,n:s.n,n0:s.n0,id:s.id.slice(),x:s.x.slice(),y:s.y.slice(),cx:s.cx.slice(),cy:s.cy.slice(),o:s.o.slice(),f:s.f.slice(),fm:s.fm.slice(),u:s.u.slice(),cap:s.cap.slice(),real:s.real.slice(),adj:s.adj.map(a=>a.slice()),ap:s.ap,T:cpuTClone(s.T),occ:new Set(s.occ),touched:s.touched.slice(),bonus:s.bonus,pool:s.pool,plc:s.plc}}
// cpuPlanEn(s,me) = the live opponents' stars as parallel lists (index, system column, system row, strength), the table every "could an opponent take this" question reads. cpuPlanThr(en,reach,cx,cy,t,ign) = could an opponent star within reach Fuel of system (cx,cy) beat strength t (star ign left out)?
function cpuPlanEn(s,me){const e={i:[],x:[],y:[],s:[]};for(let i=0;i<s.n;i++)if(isFoe(s.o[i],me)){e.i.push(i);e.x.push(s.cx[i]);e.y.push(s.cy[i]);e.s.push(s.adj[i].length+s.f[i])}return e}
function cpuPlanThr(e,reach,cx,cy,t,ign){for(let k=0;k<e.i.length;k++)if(e.i[k]!==ign&&Math.abs(e.x[k]-cx)+Math.abs(e.y[k]-cy)<=reach&&e.s[k]>t)return true;return false}
// cpuPlanLoss(s,e,X,i) = how much worse the board gets for me if my star i flips to the nearest opponent star (the planner's cpuLoss).
function cpuPlanLoss(s,e,X,i){if(!e.i.length)return 0;let fo=-1,bd=1e9;for(let k=0;k<e.i.length;k++){const j=e.i[k],d=Math.hypot(s.x[j]-s.x[i],s.y[j]-s.y[i]);if(d<bd){bd=d;fo=s.o[j]}}
const T=s.T,sx=Math.floor(s.cx[i]/3),sy=Math.floor(s.cy[i]/3),b=incEval(T,X.me,X.P,X.danger);incAdd(T,sx,sy,s.o[i],-1);incAdd(T,sx,sy,fo,1);const a=incEval(T,X.me,X.P,X.danger);incAdd(T,sx,sy,fo,-1);incAdd(T,sx,sy,s.o[i],1);return Math.max(0,b-a)}
// cpuPlanSup(s,a,N,c) = the strength a new star at N (claimed from star a for c Fuel) can be expected to reach (cpuSupport on the copy): 1 for its connection, free Fleets on a and its neighbors (up to 3), a friendly star within 2.3 with Fuel left over, a star touched this turn within 3, and (team games) a living teammate's star within 2.3.
function cpuPlanSup(s,a,N,c){const me=s.me;let st=1,fl=s.f[a]-s.fm[a];s.adj[a].forEach(k=>{if(s.o[k]==me)fl+=s.f[k]-s.fm[k]});st+=Math.max(0,Math.min(fl,3));
if(s.ap-c>=1)for(let i=0;i<s.n;i++)if(s.o[i]==me&&i!==a&&Math.hypot(s.x[i]-N.x,s.y[i]-N.y)<=2.3){st++;break}
if(s.touched.some(i=>Math.hypot(s.x[i]-N.x,s.y[i]-N.y)<=3))st++;

return st}
// cpuPlanTv(s,X,j) = what taking enemy star j is worth on the plan's STARTING board (incEval gain + the Capital / cut-off bonus), remembered in X.tv. Only valid before a rollout's first move, which is when Fleets are placed.
function cpuPlanTv(s,X,j){let v=X.tv.get(j);if(v===undefined){const T=s.T,me=s.me,o=s.o[j],sx=Math.floor(s.cx[j]/3),sy=Math.floor(s.cy[j]/3),v0=incEval(T,me,X.P,X.danger);incAdd(T,sx,sy,o,-1);incAdd(T,sx,sy,me,1);v=incEval(T,me,X.P,X.danger)-v0+(s.cap[j]?8:1)+X.cutB(j)+(X.team?cpuEndCore(o,s.o.filter((q,i)=>q==o&&i<s.n).length-1):0);incAdd(T,sx,sy,me,-1);incAdd(T,sx,sy,o,1);X.tv.set(j,v)}return v}
// cpuPlanPlace(s,X,pol,moves) = (step 6) place the whole Fleet pool on the copy, one Fleet at a time, each on the star that scores best: near the enemy, protecting a star an opponent could take (weight pol.wd), or making a capture possible that the Fleets in the pool can finish (weight pol.wa, the capture's value divided by the Fleets still missing), plus noise pol.tau. pol.conc = 1 prefers stacking Fleets on one star, 0 spreading. Different rollouts use different pol, so the plan search decides between attack-heavy, defence-heavy and stacked placements by the value of the whole turn. Adds {t:'place',a} moves (cost 0).
function cpuPlanPlace(s,X,pol,moves){const me=s.me,e=cpuPlanEn(s,me),rc=Math.min(s.ap,cpuFeat.reach),str=i=>s.adj[i].length+s.f[i],cl=(i,j)=>{const a=s.real[i],b=s.real[j];return !a||!b||cclear(a,b)};
const tg=[];if(cpuFeat.attack)for(let j=0;j<s.n0;j++)if(cpuTgt(s.o[j],me)&&cpuPlanTv(s,X,j)>0)tg.push(j);
const lc=new Map(),loss=i=>{let v=lc.get(i);if(v===undefined){v=cpuPlanLoss(s,e,X,i);lc.set(i,v)}return v};
const dist=i=>{let d=9;for(let k=0;k<e.i.length;k++){const j=e.i[k],v=Math.abs(s.x[j]-s.x[i])+Math.abs(s.y[j]-s.y[i]);if(v<d)d=v}return d};
const cands=s.plc.filter(i=>i!=null&&s.o[i]==me);
for(let k=0;k<s.pool&&cands.length;k++){let best=-1,bv=-1e18;const left=s.pool-k;
for(const p of cands){const sp=str(p),d=dist(p);let v=-.25*d+(s.cap[p]&&d<=4?1.5:0)+(pol.conc?.3:-.3)*s.f[p];
const th=cpuFeat.threat&&cpuPlanThr(e,X.reach,s.cx[p],s.cy[p],sp,-1),th1=th&&cpuPlanThr(e,X.reach,s.cx[p],s.cy[p],sp+1,-1);

if(v>bv){bv=v;best=p}}
s.f[best]++;moves.push({t:'place',a:best,c:0,d:0,bn:0})}}
// cpuPlanGen(s,X,R) = every legal move on the copy with its value d and cost c: {t:'take'|'claim'|'conn'|'multi', a, b | cx,cy, y, c, d}. a/b/y are star indices. Claims look R systems out and only the cheapest origin (then the weakest star) is listed per system, so strong stars are kept for attacks. A connection is listed only if it helps: it lifts an own star out of reach of an opponent, or it unblocks a capture that is short by exactly one strength (the unblocked capture's value x enable). Two-star attacks are listed for targets no single star can take. With X.ftk (step 6) {t:'ftake',x,a,b,n} = move n Fleets from star x to star a, then take b from a (listed when the Fleets are what lets a win). With X.fmv (step 6) free Fleet moves {t:'fmove',a,b,n,c:0} are listed too: a group of n Fleets from star a to star b (up to n Connections along own stars) when that makes a capture possible from b (value x enable, minus what leaving costs a) or makes b safe from a take (and does not expose a).
function cpuPlanGen(s,X,R){const eb=j=>X.team?cpuEndCore(s.o[j],s.o.reduce((n,o,i)=>n+(o==s.o[j]&&i<s.n?1:0),0)-1):0;const me=X.me,P=X.P,T=s.T,ap=s.ap,out=[],Z=T.Z,N=NSYS(G),mid=(N-1)/2,v0=incEval(T,me,P,X.danger),str=i=>s.adj[i].length+s.f[i],e=cpuPlanEn(s,me),thr=(cx,cy,t,ign)=>cpuPlanThr(e,X.reach,cx,cy,t,ign);
