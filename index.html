PLAYER TEXT: the words on the How to play page and in the tutorial lessons. Edit them here; the game reads them as they are.
How it works:
- A line that starts and ends with === begins a section. Keep those lines as they are, except the name after the colon, which you may change
  (after "TUTORIAL:" it is the page heading; after "LESSON N:" it is the lesson's name on the Tutorial page and its heading).
- In HOW TO PLAY, a line that starts with ## is a small heading ("## Fuel"). Glossary words (the Rulebook's Glossary) are underlined there by the game: a tap shows their rule.
- Every other line is one paragraph. In a lesson, each paragraph is one page of the tutorial panel (Back / Next). Empty lines are skipped. Lines up here, before the first section, are never shown.
- LESSON COMPLETE is the page after every lesson's last paragraph (the page with the lesson buttons).
- ADVANCED is a heading on the Tutorial page's list of lessons: it shows above the lesson whose section comes right after it, with its paragraphs under it.
  Move the section to move the heading.
- The two TUT marker lines (slash-star TUT...) around the tutorial sections mean only the preview has them (the live publish cuts them out). Keep them.
- Plain text only: no HTML. Any characters work, except the word made of < / script >, which would end this block.
- The lessons are checked by tools/lesson_tests.py (it finds each lesson by its section, not by the words), and the steps must still
  match what each lesson's position lets the player do. The positions are in docs/scenarios/lesson-*.txt.

=== HOW TO PLAY ===
## Goal
Have the most Victory Points (VP) when round 30 ends, or be the last player left.
## The board
The board is a grid of Sectors, and each Sector is 3 by 3 Systems. A System holds one Star. You start with one Star: your Capital.
## Moves
On your turn each of your Stars can start one Move: Set a Star in an empty System, Make a Connection between two of your Stars, or Take an opponent's Star.
Tap one of your Stars, then tap where the Move goes. Or drag from your Star and let go there. Hold while dragging, or hold a Star you just set, to place it precisely.
## Fuel
A Move costs 1 Fuel for each System border its line crosses; through a corner counts as 2. Fuel rises from 1 in round 1 to 15, then falls back to 1 in round 30. While a Move is still possible, you must keep spending it.
## Strength and Taking
A Star's Strength is its Connections plus the Fleets on it. To Take a Star, your attack must be stronger than the target. When a Star with Fleets is taken, its owner makes a Defence call for each Fleet: Hold or Retreat.
## Fleets
Each turn you place Fleets: 1 if you are in 1st place, 2 in 2nd, and so on. They go on Stars connected to your Capital through your own Connections. Moving Fleets is free: a group moves up to 1 Connection per Fleet in it.
## Scoring
After every round, each Sector you control (more of its Systems than everyone else together) gives 1 VP; the center Sector gives 3. Each full row or column of Sectors you control gives 1 bonus VP. The leader goes first next round; players behind place more Fleets.
## Watch out
Deficit Elimination: after each round, the lowest score that is more than 3 VP behind the next score above it is eliminated. Losing your last Star eliminates you too.
Tap any underlined word for its rule, or open the Rulebook for everything.

# Constellate

### Player Rulebook · Draft, November 2026

> **In development.** Constellate is still being developed and playtested. These rules are subject to change.

---

## Introduction

Constellate is an abstract strategy game for 2 or 4 players. Players race to take control of key territories and use their network of
Stars and their Fleets to swipe points from their opponents. There is no luck: no dice, no cards, nothing hidden.

**Theme.** In a star cluster, galaxies away from our own, four civilizations begin to reach for the distant stars. Their time is short: if
they do not act now, their neighbors will claim the stars before them, and they will be left as vassals to a foreign empire. Take command of
the expeditionary front, organize the expansion fleets, and claim this star cluster as your own.

**Objective.** Have the most Victory Points (VP) at the end of the game, or be the last player left.

**Equipment** (on paper): a game board or grid paper, a pen or pencil for each color, an eraser, Fleet tokens in each player's color, and
optionally the three Placement Stencils (1.6).

**How to read this book.** Rules are numbered (4.9 is the rule for Taking a Star) so the game and other documents can point to them.
A mark like **[F3]** points to a Fine Point at the end of the book: a small technicality that settles an unusual case.
This book covers the standard game and Team mode; other game modes have a rulebook of their own.

---

## 1. Board and setup

**1.1 The board.** The board is a square grid of **Sectors**. Each Sector is divided into a 3 by 3 grid of **Systems**. A System holds at
most one **Star**.

**1.1a Board north.** The top of the board is board north. It decides who goes first (2.3) and which way the Fixed Positions are read (1.6).
On a printed board the title runs along the north edge.

**1.2 Board sizes.** 7x7 Sectors is the standard game. 5x5 and 3x3 are shorter games on smaller boards. Every size uses the same rules,
including the 30-round game.

**1.3 Capitals.** Each player starts with one Star, their **Capital**, in the center System of a Sector:
- **4 players:** the Sectors in the middle of each board edge (north, east, south and west).
- **2 players:** the top-right and bottom-left corner Sectors.

**1.4 Players.** 2 or 4 players, each for themselves, or 4 players in teams (section 9).

**1.5 Setup.**
1. Agree on a board size.
2. Agree on how Stars are placed: free placement, or Fixed Positions (1.6). Fixed Positions are optional in casual games and required in
   regulated play, such as tournaments.
3. Each player picks a color and one of the Capitals. No two players share a Capital.
4. Each player marks their Capital with their color.

**1.6 Fixed Positions.** With Fixed Positions, a Star may only be set on one of 25 numbered positions inside its System, on a 5 by 5 grid:
- **Spaces S1 to S9:** the centers of a 3 by 3 grid (S5 is the center of the System),
- **Lines L1 to L12:** the points halfway between two neighboring Spaces,
- **Vertices V1 to V4:** the points between four Spaces.

Each set is numbered left to right, then top to bottom, reading from board north. A position can be used only if a Star there would keep
its clearance (4.5).

*On paper:* lay a Placement Stencil over the target System, lined up with its borders and with its numbers reading upright from board
north, and draw the Star through a hole.

**Notation.** A position is written Sector, System, position: Sectors are a column letter and a row number (A1 is the north-west corner;
G7 the south-east corner of a 7x7 board); Systems inside a Sector are a column letter a to c and a row number 1 to 3.
Example: **D4 · b2 · S5** is the exact center of a 7x7 board.

---

## 2. Rounds and turn order

**2.1 The round.** Each round:
1. Turn order is set (2.3).
2. Each player takes a turn.
3. The round is scored (section 6), positions are updated (2.2), and Deficit Elimination is checked (7.5).

**2.2 Positions.** Players are ranked by VP. Tied players share a position, and the next score below them takes the next position, so a
tie never skips a position.
*Examples:* scores of 7, 4, 4 and 4: the 7 is 1st and the other three are all 2nd. Scores of 7, 7 and 4: both 7s are 1st and the 4 is 2nd.

**2.3 Turn order.** 1st place goes first, then 2nd, 3rd and 4th.
- **Round 1:** everyone is tied for 1st. The player whose Capital is nearest board north goes first (with 2 players, the top-right Capital),
  then play goes clockwise.
- **Tied for 1st:** the tied player who comes first clockwise *after* the player who went first last round goes first.
  (If last round's first player is among the tied, they come last in this count.)
- **Tied for any other position:** the tied player who comes first clockwise after the player who just finished their turn goes next.

*Clockwise* means as seen from above with board north at the top: north, east, south, west. Sitting at your Capital facing the board, the
next player clockwise is on your left.

**2.4 Your turn.** On your turn you may, in any order and mixed together:
- place your Fleets (5.1),
- move Fleets (5.2),
- make Moves: Set a Star, Make a Connection, Take a Star (section 4).

*Example:* place a Fleet, make a Move, place another Fleet, then move a group.

**2.5 Ending your turn.** You may end your turn only when:
- you can no longer make a Set, a Connection or a Take with your Fuel (Full Fuel, 3.2), and
- you have placed all your Fleets, unless none of them can be placed (5.1, 5.1a).

Fuel you didn't spend and Fleets you couldn't place are lost when your turn ends. **[F10]**

---

## 3. Fuel

**3.1 Fuel per round.** Moves cost Fuel. At the start of each round every player gets Fuel equal to the round number, up to 15 at round
15. Round 16 also gives 15. From round 17, Fuel drops by 1 each round.

| Round | 1 | 2 | ... | 15 | 16 | 17 | ... | 25 | ... | 30 |
|---|---|---|---|---|---|---|---|---|---|---|
| Fuel | 1 | 2 | ... | 15 | 15 | 14 | ... | 5 | ... | 1 |

**3.2 Full Fuel.** While one of your Stars can still Set, Connect or Take with the Fuel you have left, you must keep spending it.
Sometimes every Move left hurts you. That is deliberate; Concede (7.4) is the only way out.
A Multi-attack (4.11) never forces you: if the only way left to use your Fuel is a Multi-attack, you may make it or end your turn. **[F9]**

---

## 4. Moves

**4.1 The three Moves.** Setting a Star, Making a Connection and Taking a Star. Every Move draws a line from one of your Stars.

**4.2 Fuel cost.** A Move costs 1 Fuel for each System border its line crosses. A line that passes exactly through a corner where borders
meet counts as crossing two.
*Quick count:* the cost is the number of System columns apart plus the number of System rows apart.

**4.3 One Move per Star.**
- Each Star can start at most one Move per turn. **[F2]**
- A Star that was Set or Taken this turn can't start a Move until your next turn.

**4.4 Stars.** A Star is never removed from the board; it can only change hands. Your Capital is a Star like any other for scoring and
for making Moves.

**4.5 Clearance.**
- A Star must keep a visible gap from every System border, every other Star and every line.
- A line must keep a visible gap from every Star except the two it joins. A line can't be drawn across a Star.
- Lines may cross other lines. **[F3]**

**4.6 Setting a Star.** Draw a line from one of your Stars to an empty System and draw a new Star there (anywhere with clearance, or on
a Fixed Position). The line is a Connection between the two Stars, so each gains 1 Strength.

**4.7 Making a Connection.** Draw a line between two of your Stars. Each gains 1 Strength. **[F1]**

**4.8 Strength.** A Star's Strength is its number of Connections plus the Fleets on it.

**4.9 Taking a Star.** Draw a line from one of your Stars to an opponent's Star. The attack's Strength (the attacking Star's Connections
plus the Fleets it uses, 4.10) must be greater than the target's Strength (its Connections plus all of its Fleets). **[F4]**
When the Star is taken:
1. If it has Fleets, its owner makes the Defence call (4.12).
2. All of its Connections are erased.
3. It becomes yours, and the attack's line stays as a Connection between your Star and the Star you took.
4. Your surviving attacking Fleets move onto it.

The Stars of an eliminated player stay on the board and can be taken the same way (7.3).

**4.10 Fleets in an attack.** You choose how many of the attacking Star's Fleets join the attack (at least enough to win). Fleets that
join add to the attack's Strength and move onto the target if the attack succeeds. Fleets that don't join stay where they are. Fleets
that already moved this turn may join. A Fleet used in an attack can't move again that turn.

**4.11 Multi-attack.** Two or more of your Stars may attack one opponent's Star together. Draw a line from each; each line costs Fuel as
normal. The Strengths of the attacking Stars, with the Fleets they use, are added together and must be greater than the target's.
Every attacking Star must be able to start a Move, and each counts as having started one. All the Fleets used count as one group for the
Defence call and all move onto the target. Each attacker's line stays as a Connection to the Star taken.

**4.12 Defence call.** The Fleets on a target Star always add to its Strength. When a Star with Fleets on it is taken, its owner decides,
one Fleet at a time, whether each Fleet Holds or Retreats:
- **Retreat:** the Fleet moves across one Connection of the attacked Star to another Star its owner controls.
- **Hold:** the Fleet is lost, and the attacker loses one of the Fleets used in the attack.

Hold is possible only while the attacker still has an attacking Fleet left to lose. Retreat is possible only if the attacked Star is
connected to another Star its owner controls. If only one of the two is possible, the Fleet must do that. If neither is, the Fleet is lost.

*Example:* Red takes Blue's Star using 1 Fleet. Blue's Star holds 2 Fleets and is connected to one other Blue Star. Blue may Hold the first
Fleet (it is lost, and so is Red's Fleet). Red has no attacking Fleet left, so Blue's second Fleet must Retreat.

(Team mode changes the Defence call: see 9.6.)

---

## 5. Fleets

**5.1 Placing Fleets.** Each turn you place as many Fleets as your position: 1st places 1, 2nd places 2, 3rd places 3, 4th places 4.
In round 1 everyone is 1st and places 1. Fleets go on any of your Stars that is linked to your Capital by an unbroken chain of your own
Connections. You must place all of them if you can (2.5).

**5.1a Lost Capital.** If an opponent holds your Capital when your turn starts, you place no Fleets that turn, unless you retake it. If
you retake it during that turn, you may place your Fleets, but only on your Capital. **[F5]**

**5.2 Moving Fleets.** Moving Fleets costs no Fuel and is not a Move. Any number of Fleets and groups may move each turn, but each Fleet
moves only once per turn (except by hitchhiking, 5.4). A group moves along your Connections, through your own Stars, up to 1 Connection
per Fleet in the group: 1 Fleet can move 1 Connection, a group of 3 up to 3. **[F6] [F7]**

**5.3 Groups.** A group moves together and stops at the same Star. You may split Fleets into groups before they move, but not during a move.

**5.4 Hitchhiking.**
- When a moving group passes through one of your Stars that has other Fleets on it, those Fleets may join the group for the rest of its
  move, whether or not they moved earlier this turn.
- When Fleets arrive at a Star, Fleets already there may move on and carry them along.
- Either way, a hitchhiking Fleet adds nothing to how far the group can move, ends on the group's destination, and counts as moved.
- A Fleet used in an attack this turn can't hitchhike (4.10).
- At the start of the next round, all Fleets on the same Star count as one group.

**5.5 Fleets and Moves.** Setting a Star or Making a Connection from a Star with Fleets doesn't affect those Fleets; they may still move.
(Moving Fleets onto a Star you have just set is an ordinary Fleet move.)

**5.6 Large Fleet token.** *On paper:* a large token counts as 5 Fleets for all purposes, and may be broken up or added to at any time.

---

## 6. Scoring

The round is scored after every player has had their turn; then positions are updated (2.2).

**6.1 System control.** You control a System when you control the Star in it.

**6.2 Sector control.** You control a Sector when you control more of its Systems than all other players together. Otherwise nobody
controls it. **[F8]**

**6.3 Victory Points.**
- Each Sector you control: 1 VP.
- The center Sector: 3 VP instead of 1, on every board size.
- Each complete row or column of Sectors you control: 1 extra VP (7 Sectors on 7x7, 5 on 5x5, 3 on 3x3).

---

## 7. Elimination

**7.1 Ways out.** A player is eliminated only by Conceding, by Deficit Elimination, or by losing their last Star.

**7.2 Losing your last Star.** A player who loses their last Star is eliminated at once, even in the middle of a turn. If only one player
is left, the game ends on the spot.

**7.3 After elimination.** The eliminated player's Connections and Fleets are removed at once. Their Stars (now **leftover Stars**) stay on
the board in their color and can be taken like any other Star. (Team mode: see 9.7.)

*On paper:* erase the eliminated player's Connections and remove their Fleet tokens.

**7.4 Conceding.** On your turn you may Concede. You are eliminated at once.

**7.5 Deficit Elimination.** After each round is scored, group the players still in the game by score into score levels (players with the
same score share a level). Compare the lowest level with the level directly above it:
- If the gap is greater than 3 VP, every player in the lower level is eliminated, and checking stops for this round.
- If not, compare the next pair of levels up, and so on.

At most one level is eliminated each round.

*Example:* P1 has 4, P2 9, P3 5, P4 10. Positions: P4 1st, P2 2nd, P3 3rd, P1 4th. Compare 4 with 5: gap 1, nobody is out. Compare 5 with 9:
gap 4, P3 is eliminated. Checking stops. P1 survives this round, but must close the gap to P2 (now 5 VP) before the next check.

---

## 8. Ending the game

**8.1 The end.** The game ends when only one player is left (that player wins), or when round 30 is complete (most VP wins).

**8.2 Tiebreaker.** If two or more players are tied for the most VP, each of them adds the number of Stars they control to their VP. If
that gives a single highest total, that player wins.

**8.3 Overtime.** If they are still tied, play goes on in overtime rounds. Overtime Fuel follows the same 30-round ramp as the main game
(1, rising to 15, 15 again, then falling to 1), and starts over at 1 if the tie lasts longer. There is no limit. At the end of each
overtime round, score as if it were the last round, tiebreaker included; the first round with a clear winner ends the game.
A tied round that doesn't end the game counts as an ordinary round: Deficit Elimination is checked after it as usual.
*Example:* after round 30 the scores are 20, 20, 10 and 9. The two leaders are tied, so overtime begins, and first the player on 10 is
eliminated (10 is more than 3 behind 20).

---

## 9. Team mode

**9.1 Setup.** 4 players only. Each player is on team 1, 2 or 3, with at least 2 different teams (2 against 2, 3 against 1, or 2, 1 and 1).
Computer players can be on any team.

**9.2 Scores and winning.**
- Scores stay individual. Turn order, Fleet placement and Deficit Elimination use each player's own VP. **[F11]**
- A team wins at once when it is the only team with a player left; one survivor is enough.
- After round 30, the team with the highest combined VP wins. Eliminated players count 0.
- Ties: each tied team adds the Stars its remaining players control to its combined VP; if still tied, overtime (8.3).

**9.3 Deficit Elimination with teams.** It works as in 7.5, except that a player is safe from a gap if every player in the level directly
above is their teammate. The check then carries on up the levels.
*Examples,* with Red and Purple on one team and Blue and Orange on the other: Red 4, Blue 5, Orange 10, Purple 12: nobody is out (Blue is
5 behind Orange, a teammate). Red 4, Blue 5, Orange 10, Purple 15: Orange is out (5 behind Purple). Next round Blue's nearest level up is
Purple, no longer a teammate.

**9.4 Teammates' Stars.**
- You can't attack a living teammate's Star. Leftover Stars of an eliminated teammate can be taken normally.
- Aiming a Move at a teammate's Star gives two choices, each costing Fuel like any other line:
  - **Connect:** a Connection between your Star and theirs. It raises both Stars' Strength.
  - **Gift:** your Star becomes theirs, as if they had taken it: its other Connections are erased, its Fleets go with it, and the line
    stays as a Connection to their Star. They can use it from their next turn.
- Capitals can't be gifted, and you can't gift your last Star.
- Full Fuel (3.2): a Connect to a teammate counts as a Move you could make. A Gift never does, so nobody is ever forced to give a Star away.
- Taking a Star erases all of its Connections, a link to a teammate included.

**9.5 Fleet gifts.**
- You may give a group of Fleets to a living teammate's Star in the same Sector, or to one directly linked to their Star by a Connection
  (in any Sector). This costs no Fuel.
- The group must not have moved this turn. The Fleets arrive as already moved, and can move normally on their new owner's next turn.

**9.6 Defence call with teams.** A teammate's Star linked to the attacked Star is also a Retreat spot. Retreating there gives the Fleet to
that teammate. Everything else in 4.12 applies unchanged: once the attacker has no attacking Fleets left, Hold isn't possible, so a Fleet
whose only Retreat spot is a teammate's Star goes to that teammate.

**9.7 When a teammate is eliminated.**
- Their Stars that are linked by a Connection to a living teammate's Star pass to that teammate, with their Fleets. This includes a
  linked Capital. A Star linked to two teammates goes to the one it was linked to first.
- Players eliminated at the same moment can't receive Stars from each other.
- Their other Stars stay on the board as leftover Stars, and anyone, a surviving teammate included, can take them.

---

## Glossary

| Term | Meaning | Rule |
|---|---|---|
| **Capital** | Your starting Star. Fleets enter play through Stars connected to it. | 1.3, 5.1 |
| **Connection** | A line between two Stars of the same player (or two teammates). Adds 1 Strength to each. | 4.7 |
| **Defence call** | The choice to Hold or Retreat each Fleet on a Star being taken. | 4.12 |
| **Deficit Elimination** | Being eliminated after a round for being more than 3 VP behind the score level above. | 7.5 |
| **Fleet** | A unit on a Star. Adds 1 Strength; can move, attack and defend. | 5.1, 5.2, 4.10 |
| **Fuel** | What Moves cost. Every player gets the same amount each round. | 3.1, 4.2, 3.2 |
| **Full Fuel** | You must keep spending Fuel while a Set, Connection or Take is possible. | 3.2 |
| **Hitchhiking** | Fleets joining a moving group as it passes or arrives. | 5.4 |
| **Hold** | A defending Fleet is lost, and takes one attacking Fleet with it. | 4.12 |
| **Leftover Star** | A Star of an eliminated player. Anyone can take it. | 7.3 |
| **Move** | Setting a Star, Making a Connection or Taking a Star. | 4.1 |
| **Multi-attack** | Two or more of your Stars taking one Star together. | 4.11 |
| **Overtime** | Extra rounds after round 30 when the leaders are tied. | 8.3 |
| **Position** | Your rank by VP. Sets turn order and how many Fleets you place. | 2.2 |
| **Retreat** | A defending Fleet moves across one Connection to safety. | 4.12 |
| **Sector** | A 3 by 3 block of Systems. Controlling Sectors scores VP. | 6.2, 1.1 |
| **Set** | Drawing a line to an empty System and a new Star there. | 4.6 |
| **Star** | A dot in a System. Never removed; it only changes hands. | 4.4 |
| **Strength** | A Star's Connections plus the Fleets on it. | 4.8 |
| **System** | One square of the grid. Holds at most one Star. | 1.1 |
| **Take** | Capturing an opponent's Star with a stronger attack. | 4.9 |
| **VP** | Victory Points, scored every round. | 6.3 |

---

## Examples

**Fuel cost.** Your Capital is in System column 10, row 1. Setting a Star in column 11, row 1 crosses 1 border: 1 Fuel. Setting one in
column 11, row 2 crosses 2 borders (1 column + 1 row): 2 Fuel, even if the line passes exactly through the corner.

**Strength.** Capital A has 2 Connections and 1 Fleet: Strength 3. Star B has 1 Connection: Strength 1. Star C has 1 Connection and
5 Fleets: Strength 6.

**A Take.** Your Star has 2 Connections and 3 Fleets. The target has 1 Connection and 2 Fleets (Strength 3). You need an attack of 4, so
you use at least 2 Fleets (2 + 2 = 4). Your third Fleet may stay behind.

---

## Fine Points

Small technicalities. They rarely matter, but they settle the unusual cases.

- **F1. One Connection per pair (4.7).** Two Stars can share only one Connection.
- **F2. Connecting uses only one Star (4.3).** Making a Connection uses up the Star the line starts from. The Star at the other end may
  still start its own Move that turn.
- **F3. Crossing lines (4.5).** Lines may cross each other, whoever drew them. Only Stars block a line. A new Star, though, must keep its
  gap from every line.
- **F4. Fleets left out (4.9, 4.10).** Fleets on the attacking Star that don't join the attack add nothing to it. The target's Fleets
  always all count.
- **F5. Holding a Capital (5.1a).** Holding someone else's Capital doesn't let you place Fleets there or through it; Fleets come only
  through your own Capital. A held Capital is otherwise an ordinary Star for whoever holds it.
- **F6. New Fleets can move (5.2).** Fleets placed this turn can move this turn.
- **F7. Only through your own Stars (5.2).** Fleets travel only along Connections between your own Stars. Reaching a teammate's Star is a
  Fleet gift (9.5), not a move.
- **F8. Leftover Stars still count (6.2).** An eliminated player's leftover Stars count as "other players" in a Sector until someone takes
  them, so they can stop anyone from controlling it.
- **F9. Multi-attacks and Full Fuel (3.2).** Full Fuel only looks at Moves one Star can make by itself. Fuel that only a Multi-attack could
  use may be left unspent; finding that Multi-attack is your opportunity, not your obligation.
- **F10. Nothing carries over (2.5).** Unspent Fuel and Fleets you couldn't place don't carry over to the next turn.
- **F11. Teammates and Sectors (9.2).** Teammates' Stars are not combined for Sector control: your teammate's Stars count against you in a
  Sector like anyone else's.
